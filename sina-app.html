      </Card>}
    </div>
  </div>;
}

/* ---------- Simulador de mensajes entrantes ---------- */
function SimuladorView({go}){
  const { state, dispatch } = useStore();
  const [telefono, setTelefono] = useState('+56 9 1111 2222');
  const [mensaje, setMensaje] = useState('Hola, necesito 12 unidades de Latex Premium Blanco 4 L. RUT 76.123.456-7, despacho a Las Condes');
  const [trace, setTrace] = useState([]);
  const toast = useToast();

  const procesar = async () => {
    const text = mensaje.trim(); if(!text) return;

    // 1) Conversación existente por teléfono o crear nueva
    let conv = state.whatsappConversations.find(c=>c.telefono===telefono);
    let isNew = false;
    if(!conv){
      conv = { id:uid('WC'), telefono, clienteId:null, estado:'nuevo', responsable:null, draftId:null, ovId:null, lastSeenAt:today(), intentosFallidos:0 };
      isNew = true;
    }
    // 2) Cargar draft o crear
    let draft = conv.draftId ? state.whatsappDrafts.find(d=>d.id===conv.draftId) : null;
    if(!draft) draft = { id:uid('WD'), conversationId:conv.id, items:[], clienteId:null, despacho:null, estimadoNeto:0, estimadoTotal:0 };

    // 3) Persistir mensaje entrante
    const inMsg = { id:uid('WM'), conversationId:conv.id, direccion:'in', texto:text, ts:new Date().toISOString(), autor:'cliente' };
    dispatch({type:'UPSERT', collection:'whatsappMessages', item:inMsg});

    // 4) Llamar al agente
    const r = SalesAgentService.process({conversation:conv, draft, message:text, state});

    // 5) Persistir draft actualizado
    if(r.updatedDraft){
      const d = {...r.updatedDraft};
      d.estimadoNeto = d.items.reduce((s,it)=>s+it.precio*it.cantidad,0);
      d.estimadoTotal = Math.round(d.estimadoNeto*1.19);
      dispatch({type:'UPSERT', collection:'whatsappDrafts', item:d});
      conv = {...conv, clienteId:d.clienteId||conv.clienteId, draftId:d.id};
    }

    // 6) Decidir efectos según acción
    let resultadoOV = null;
    let newEstado = r.newConvState || conv.estado;
    if(r.action==='crear_ov'){
      // crear OV con origen WhatsApp
      const d = r.updatedDraft;
      const items = d.items.map(it=>({productoId:it.productoId, sku:it.sku, nombre:it.nombre, cantidad:it.cantidad, precio:it.precio, descuento:0, descuentoTipo:'%', descuentoValor:0, total:Math.round(it.precio*it.cantidad), costo:it.costo}));
      const neto = items.reduce((s,i)=>s+i.total,0);
      const iva = Math.round(neto*0.19);
      const ov = {
        id: uid('OV'), numero: 'OV-WA-'+String(rand(10000,99999)),
        clienteId: d.clienteId, fecha: today(), items, neto, iva, total:neto+iva,
        estado: 'Confirmada',
        vendedor: state.clients.find(c=>c.id===d.clienteId)?.ejecutivo || EJECUTIVOS[0],
        descuentoGlobal:{tipo:'%',valor:0},
        origen:'WhatsApp', whatsappConversationId: conv.id,
        historialEstados:[{de:null, a:'Confirmada', fecha:today(), usuario:'Agente AI', modo:'auto · WhatsApp'}],
        observaciones: d.condicionesEspeciales || ''
      };
      dispatch({type:'UPSERT', collection:'sales', item:ov});
      conv = {...conv, ovId: ov.id};
      newEstado = 'orden_creada';
      resultadoOV = ov;
    }
    if(r.action==='derivar'){
      const responsable = state.clients.find(c=>c.id===conv.clienteId)?.ejecutivo || EJECUTIVOS[0];
      conv = {...conv, responsable};
      newEstado = 'derivado';
      dispatch({type:'UPSERT', collection:'humanHandoffs', item:{id:uid('HH'), conversationId:conv.id, fecha:today(), motivo:r.motivo, detalle:text.slice(0,200), responsable, resuelto:false}});
    }
    if(r.action==='esperar_info'){ newEstado = 'esperando_info'; }

    // 7) Persistir reply (si hay)
    let replyFinal = r.reply;
    if(resultadoOV){
      replyFinal = `Listo. Tu pedido quedó ingresado con el número ${resultadoOV.numero}. Te avisaremos cuando esté en preparación.`;
    }
    if(replyFinal){
      const provider = MESSAGING_PROVIDERS[ACTIVE_MESSAGING_PROVIDER];
      await provider.send(telefono, replyFinal);
      dispatch({type:'UPSERT', collection:'whatsappMessages', item:{id:uid('WM'), conversationId:conv.id, direccion:'out', texto:replyFinal, ts:new Date().toISOString(), autor:'agente'}});
    }

    // 8) Persistir conversación con intentos fallidos / estado actualizado
    if(r.intentosFallidos!=null) conv.intentosFallidos = r.intentosFallidos; else if(r.action!=='esperar_info') conv.intentosFallidos = 0;
    conv = {...conv, estado:newEstado, lastSeenAt: new Date().toISOString()};
    dispatch({type:'UPSERT', collection:'whatsappConversations', item:conv});

    // 9) Logs AI
    (r.logs||[]).forEach(l=>dispatch({type:'UPSERT', collection:'aiAgentLogs', item:{id:uid('AL'), conversationId:conv.id, ts:l.ts, decision:l.decision, detalle:l.detalle, confianza:l.confianza}}));

    setTrace(t=>[{
      ts:new Date().toLocaleTimeString('es-CL'),
      mensaje:text,
      respuesta:replyFinal,
      accion:r.action,
      motivo:r.motivo,
      estado:newEstado,
      logs:r.logs,
      ov:resultadoOV
    }, ...t]);
    setMensaje('');
    toast(isNew? 'Conversación nueva creada' : 'Mensaje procesado');
  };

  const ejemplos = [
    'Hola, necesito 20 unidades de Latex Premium Blanco 4 L. RUT 76.123.456-7, despacho a Las Condes',
    'Buenas tardes, ¿pueden cotizar 5 galones de esmalte negro? RUT 76.555.111-2',
    'Necesito un descuento por volumen, son 200 litros',
    'Quiero hablar con una persona',
    'Sí, confirmado',
    'Esto está pésimo, llevo 3 días esperando'
  ];

  return <div className="p-8 space-y-6 max-w-5xl">
    <Card title="Simulador de WhatsApp" subtitle="Probar flujo agente AI → validación → creación de OV sin conectar Cloud API">
      <div className="grid grid-cols-3 gap-3 mb-3">
        <Input label="Teléfono del cliente" value={telefono} onChange={e=>setTelefono(e.target.value)} className="col-span-1"/>
        <div className="col-span-2 self-end text-xs text-sina-muted">
          El sistema enrutará por <code className="bg-sina-bg px-1 rounded">MessagingProvider</code> activo: <b>{ACTIVE_MESSAGING_PROVIDER}</b>
        </div>
      </div>
      <Textarea label="Mensaje entrante del cliente" rows="3" value={mensaje} onChange={e=>setMensaje(e.target.value)}/>
      <div className="flex flex-wrap gap-2 mt-3 mb-3">
        {ejemplos.map((ex,i)=><button key={i} onClick={()=>setMensaje(ex)} className="text-xs px-2 py-1 rounded border border-sina-line bg-white text-sina-body hover:border-sina-navy hover:text-sina-navy">{ex.slice(0,46)+(ex.length>46?'…':'')}</button>)}
      </div>
      <div className="flex justify-end">
        <Btn onClick={procesar}>Procesar mensaje</Btn>
      </div>
    </Card>

    {trace.length>0 && <Card title="Trace de procesamiento" subtitle="Cada turno muestra mensaje, decisión del agente, acciones tomadas y respuesta enviada">
      <div className="space-y-4">{trace.map((t,i)=>(
        <div key={i} className="border border-sina-line rounded-lg p-4 bg-white">
          <div className="text-xs text-sina-muted mb-2">{t.ts} · acción: <Badge tone={t.accion==='crear_ov'?'mint':t.accion==='derivar'?'rose':t.accion==='esperar_info'?'amber':'navy'} dot>{t.accion}</Badge>{t.motivo? <span className="ml-2 text-sina-muted">motivo: {t.motivo}</span>:''} · estado: <Badge tone="navy">{t.estado}</Badge></div>
          <div className="text-sm"><span className="text-sina-muted">Cliente:</span> <span className="text-sina-ink">{t.mensaje}</span></div>
          <div className="text-sm mt-1"><span className="text-sina-muted">Agente:</span> <span className="text-sina-ink whitespace-pre-line">{t.respuesta}</span></div>
          {t.ov && <div className="mt-2 text-xs"><Badge tone="mint" dot>OV creada</Badge> <span className="font-mono">{t.ov.numero}</span> · {CLP(t.ov.total)}</div>}
          {t.logs?.length>0 && <details className="mt-2"><summary className="text-xs text-sina-muted">Decisiones internas ({t.logs.length})</summary><ul className="mt-1 text-xs text-sina-body space-y-0.5">{t.logs.map((l,k)=><li key={k} className="font-mono">{l.decision} · {l.detalle} · conf. {Math.round(l.confianza*100)}%</li>)}</ul></details>}
        </div>
      ))}</div>
    </Card>}
  </div>;
}

function DeudaView({tab}){
  if(tab==='pagos') return <DeudaPagosView/>;
  return <DeudaDashboardView/>;

function DeudaDashboardView(){
  const { state, dispatch } = useStore();
  const { debts=[], debtPayments=[] } = state;
  const [edit, setEdit] = useState(null);
  const [detail, setDetail] = useState(null);
  const toast = useToast();

  // Recalcular estado vencida
  const enriched = debts.map(d=>{
    const dias = daysBetween(d.fechaVencimiento, today());
    let estado = d.estado;
    if(estado==='Activa' && d.saldoPendiente<=0) estado='Pagada';
    if(estado==='Activa' && dias>0 && d.saldoPendiente>0) estado='Vencida';
    return {...d, estado, diasAlVencimiento: -dias};
  });

  const totalVigente = enriched.filter(d=>d.estado!=='Pagada').reduce((s,d)=>s + d.saldoPendiente,0);
  const cuotaMensual = enriched.filter(d=>d.estado==='Activa').reduce((s,d)=>s+d.cuotaMensual,0);
  const interesesAño = debtPayments.filter(p=>p.fecha>=today().slice(0,4)+'-01-01').reduce((s,p)=>s+p.interes,0);
  const vencidas = enriched.filter(d=>d.estado==='Vencida').length;
  const proximos30 = enriched.filter(d=>d.estado==='Activa' && d.diasAlVencimiento>=0 && d.diasAlVencimiento<=30).length;

  // Evolución histórica: saldo mensual aproximado
  const months = 12;
  const evolucion = range(months).map(i=>{
    const cutoff = addDays(today(), -30*(months-1-i));
    const saldo = debts.reduce((s,d)=>{
      if(d.fechaInicio>cutoff) return s;
      const pagosHasta = debtPayments.filter(p=>p.debtId===d.id && p.fecha<=cutoff).reduce((a,p)=>a+p.capital,0);
      return s + Math.max(0, d.montoOriginal - pagosHasta);
    },0);
    return { mes: cutoff.slice(0,7), saldo };
  });

  const porInst = {};
  enriched.filter(d=>d.estado!=='Pagada').forEach(d=>{ porInst[d.institucion]=(porInst[d.institucion]||0)+d.saldoPendiente; });

  const newDebt = () => setEdit({ id:uid('DT'), nombre:'', institucion:'', tipo:'Préstamo bancario', moneda:'CLP',
    montoOriginal:0, saldoPendiente:0, tasaAnual:0.08, tipoTasa:'fija',
    fechaInicio:today(), fechaVencimiento:addDays(today(),365),
    cuotas:12, cuotaMensual:0, diaPago:5, estado:'Activa' });

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
      <Kpi label="Deuda vigente" value={CLP(totalVigente)} tone={totalVigente>0?'accent':'neutral'}/>
      <Kpi label="Cuota mensual total" value={CLP(cuotaMensual)} sub="suma cuotas activas"/>
      <Kpi label="Intereses pagados año" value={CLP(interesesAño)} sub="alimenta gastos financieros"/>
      <Kpi label="Vencidas" value={vencidas} tone={vencidas>0?'risk':'neutral'}/>
      <Kpi label="Vencen ≤ 30 días" value={proximos30} tone={proximos30>0?'warn':'neutral'}/>
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <Card title="Evolución histórica de deuda" className="lg:col-span-2">
        <ChartBox type="line" height={240} data={{labels:evolucion.map(e=>fmtMonth(e.mes+'-01')), datasets:[{label:'Saldo deuda', data:evolucion.map(e=>e.saldo), borderColor:'#1C3566', backgroundColor:'#7EB8F733', fill:true, tension:.35, pointRadius:0, borderWidth:2}]}} options={{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false},ticks:{color:'#6B7280',font:{size:11}}},y:{grid:{color:'#F0F1F4'},ticks:{color:'#6B7280',font:{size:11},callback:v=>'$'+(v/1e6).toFixed(0)+'M'}}}}}/>
      </Card>
      <Card title="Deuda por institución">
        <ChartBox type="doughnut" height={240} data={{labels:Object.keys(porInst), datasets:[{data:Object.values(porInst), backgroundColor:['#1C3566','#2A4E8C','#7EB8F7','#0E8A6B','#B45309','#9CA3AF']}]}} options={{plugins:{legend:{position:'bottom',labels:{boxWidth:8,boxHeight:8,font:{size:11}}}}}}/>
      </Card>
    </div>

    <Card title="Obligaciones financieras" action={<Btn onClick={newDebt}>Nueva deuda</Btn>}>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
          <th className="pb-2 font-medium">Nombre</th><th className="pb-2 font-medium">Institución</th><th className="pb-2 font-medium">Tipo</th><th className="pb-2 font-medium text-right">Original</th><th className="pb-2 font-medium text-right">Saldo</th><th className="pb-2 font-medium text-right">Tasa</th><th className="pb-2 font-medium text-right">Cuota</th><th className="pb-2 font-medium">Vence</th><th className="pb-2 font-medium">Estado</th><th></th>
        </tr></thead>
        <tbody>{enriched.map(d=>(
          <tr key={d.id} className="border-b border-sina-lineSoft row-hover">
            <td className="py-3"><div className="text-sina-ink">{d.nombre}</div><div className="text-xs text-sina-muted">{d.tipoTasa} · {d.cuotas} cuotas</div></td>
            <td>{d.institucion}</td>
            <td className="text-sina-body text-xs">{d.tipo}</td>
            <td className="text-right num">{d.moneda} {NUM(d.montoOriginal)}</td>
            <td className="text-right num font-medium">{d.moneda} {NUM(d.saldoPendiente)}</td>
            <td className="text-right num">{(d.tasaAnual*100).toFixed(2)}%</td>
            <td className="text-right num">{d.moneda} {NUM(d.cuotaMensual)}</td>
            <td className="text-xs"><div>{fmtDate(d.fechaVencimiento)}</div><div className="text-sina-muted">{d.diasAlVencimiento>=0?`en ${d.diasAlVencimiento}d`:`hace ${-d.diasAlVencimiento}d`}</div></td>
            <td><Badge tone={d.estado==='Pagada'?'mint':d.estado==='Vencida'?'rose':d.estado==='Refinanciada'?'amber':'navy'} dot>{d.estado}</Badge></td>
            <td className="text-right text-xs space-x-2">
              <button className="text-sina-navy font-medium" onClick={()=>setDetail(d)}>Detalle</button>
              <button className="text-sina-body font-medium" onClick={()=>setEdit({...d})}>Editar</button>
            </td>
          </tr>
        ))}</tbody>
      </table>
    </Card>

    <Modal open={!!edit} onClose={()=>setEdit(null)} title={edit?.nombre? 'Editar deuda':'Nueva deuda'} size="lg">
      {edit && <DebtForm initial={edit} onSave={(d)=>{dispatch({type:'UPSERT', collection:'debts', item:d}); toast('Deuda guardada'); setEdit(null);}} onCancel={()=>setEdit(null)}/>}
    </Modal>
    <Modal open={!!detail} onClose={()=>setDetail(null)} title={`${detail?.nombre||''}`} size="xl">
      {detail && <DebtDetail debt={detail} onClose={()=>setDetail(null)}/>}
    </Modal>
  </div>;
}

function DebtDetail({debt, onClose}){
  const { state, dispatch } = useStore();
  const pagos = (state.debtPayments||[]).filter(p=>p.debtId===debt.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const totalCapital = pagos.reduce((s,p)=>s+p.capital,0);
  const totalIntereses = pagos.reduce((s,p)=>s+p.interes,0);
  const [pago, setPago] = useState(null);
  const toast = useToast();

  const newPago = () => setPago({id:uid('DP'), debtId:debt.id, fecha:today(), capital:Math.round(debt.cuotaMensual*0.78), interes:Math.round(debt.cuotaMensual*0.22), saldoRestante: Math.max(0, debt.saldoPendiente - Math.round(debt.cuotaMensual*0.78)), metodo:'Transferencia', comprobante:null, observaciones:''});

  const savePago = (p) => {
    dispatch({type:'UPSERT', collection:'debtPayments', item:p});
    dispatch({type:'UPSERT', collection:'debts', item:{...debt, saldoPendiente: Math.max(0, debt.saldoPendiente - p.capital)}});
    toast('Pago registrado');
    setPago(null);
  };

  return <div className="space-y-4">
    <div className="grid grid-cols-4 gap-3">
      <Kpi label="Saldo actual" value={debt.moneda+' '+NUM(debt.saldoPendiente)} tone={debt.saldoPendiente>0?'accent':'good'}/>
      <Kpi label="Capital pagado" value={debt.moneda+' '+NUM(totalCapital)}/>
      <Kpi label="Intereses pagados" value={debt.moneda+' '+NUM(totalIntereses)}/>
      <Kpi label="Próximo pago" value={'día '+debt.diaPago}/>
    </div>
    <Card title="Información de la deuda">
      <dl className="grid grid-cols-3 gap-4 text-sm">
        <div><dt className="text-xs text-sina-muted">Institución</dt><dd>{debt.institucion}</dd></div>
        <div><dt className="text-xs text-sina-muted">Tipo</dt><dd>{debt.tipo}</dd></div>
        <div><dt className="text-xs text-sina-muted">Tipo de tasa</dt><dd>{debt.tipoTasa} · {(debt.tasaAnual*100).toFixed(2)}% anual</dd></div>
        <div><dt className="text-xs text-sina-muted">Cuotas</dt><dd>{debt.cuotas} · cuota {debt.moneda} {NUM(debt.cuotaMensual)}</dd></div>
        <div><dt className="text-xs text-sina-muted">Inicio</dt><dd>{fmtDate(debt.fechaInicio)}</dd></div>
        <div><dt className="text-xs text-sina-muted">Vencimiento</dt><dd>{fmtDate(debt.fechaVencimiento)}</dd></div>
      </dl>
    </Card>
    <Card title="Historial de pagos" action={<Btn size="sm" onClick={newPago}>Registrar pago</Btn>}>
      {pagos.length===0 ? <div className="text-sm text-sina-muted">Sin pagos registrados.</div> :
        <table className="w-full text-sm">
          <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
            <th className="pb-2 font-medium">Fecha</th><th className="pb-2 font-medium text-right">Capital</th><th className="pb-2 font-medium text-right">Interés</th><th className="pb-2 font-medium text-right">Saldo</th><th className="pb-2 font-medium">Método</th><th className="pb-2 font-medium">Comprobante</th><th className="pb-2 font-medium">Obs.</th>
          </tr></thead>
          <tbody>{pagos.map(p=>(
            <tr key={p.id} className="border-b border-sina-lineSoft">
              <td className="py-2">{fmtDate(p.fecha)}</td>
              <td className="text-right num">{debt.moneda} {NUM(p.capital)}</td>
              <td className="text-right num text-sina-body">{debt.moneda} {NUM(p.interes)}</td>
              <td className="text-right num text-sina-muted">{debt.moneda} {NUM(p.saldoRestante)}</td>
              <td>{p.metodo}</td>
              <td className="text-xs">{p.comprobante? <a href={p.comprobante.dataUrl} download={p.comprobante.nombre} className="text-sina-navy">Descargar</a> : <span className="text-sina-muted">—</span>}</td>
              <td className="text-xs text-sina-body max-w-xs truncate">{p.observaciones}</td>
            </tr>
          ))}</tbody>
        </table>
      }
    </Card>
    <Modal open={!!pago} onClose={()=>setPago(null)} title="Registrar pago" size="md">
      {pago && <PagoDeudaForm pago={pago} setPago={setPago} debt={debt} onSave={savePago} onCancel={()=>setPago(null)}/>}
    </Modal>
  </div>;
}

function PagoDeudaForm({pago, setPago, debt, onSave, onCancel}){
  const fileRef = useRef();
  const onFile = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    const doc = await fileToDoc(f, 'Comprobante');
    setPago({...pago, comprobante:doc});
  };
  return <div className="space-y-3">
    <Input label="Fecha de pago" type="date" value={pago.fecha} onChange={e=>setPago({...pago, fecha:e.target.value})}/>
    <div className="grid grid-cols-3 gap-3">
      <Input label={`Capital (${debt.moneda})`} type="number" value={pago.capital} onChange={e=>setPago({...pago, capital:+e.target.value, saldoRestante: Math.max(0, debt.saldoPendiente - +e.target.value)})}/>
      <Input label={`Interés (${debt.moneda})`} type="number" value={pago.interes} onChange={e=>setPago({...pago, interes:+e.target.value})}/>
      <Input label={`Saldo restante (${debt.moneda})`} type="number" value={pago.saldoRestante} onChange={e=>setPago({...pago, saldoRestante:+e.target.value})}/>
    </div>
    <Select label="Método" value={pago.metodo} onChange={e=>setPago({...pago, metodo:e.target.value})}><option>Transferencia</option><option>Cheque</option><option>Cargo automático</option><option>Otro</option></Select>
    <div>
      <div className="text-xs font-medium text-sina-body mb-1.5">Comprobante</div>
      <Btn variant="secondary" size="sm" onClick={()=>fileRef.current.click()}>{pago.comprobante? 'Reemplazar archivo':'Adjuntar archivo'}</Btn>
      {pago.comprobante && <span className="ml-2 text-xs text-sina-muted">{pago.comprobante.nombre} · {pago.comprobante.size}</span>}
      <input ref={fileRef} type="file" className="hidden" onChange={onFile}/>
    </div>
    <Textarea label="Observaciones" rows="2" value={pago.observaciones} onChange={e=>setPago({...pago, observaciones:e.target.value})}/>
    <div className="flex justify-end gap-2 pt-2 border-t border-sina-line">
      <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
      <Btn onClick={()=>onSave(pago)}>Registrar pago</Btn>
    </div>
  </div>;
}

function InventarioPorUbicacionView(){
  const { state } = useStore();
  const { products=[], pickupPoints=[], sales=[] } = state;
  const [q, setQ] = useState('');

  // Stock reservado = sum de items en OV con retiro pendiente, por ubicación
  const reservasByLoc = {};
  sales.forEach(o=>{
    if(o.tipoEntrega==='retiro' && ['Pendiente preparación','Listo para retiro'].includes(o.estadoRetiro)){
      const loc = o.puntoRetiroId || 'BC';
      o.items.forEach(it=>{
        const k = loc+'|'+it.productoId;
        reservasByLoc[k] = (reservasByLoc[k]||0) + it.cantidad;
      });
    }
  });

  const filtered = products.filter(p=>!q || `${p.nombre} ${p.sku}`.toLowerCase().includes(q.toLowerCase())).slice(0,200);

function TransferenciasView(){
  const { state, dispatch } = useStore();
  const { inventoryTransfers=[], pickupPoints=[], products=[] } = state;
  const [edit, setEdit] = useState(null);
  const toast = useToast();

  const newTransfer = () => setEdit({id:uid('TR'), fecha:today(), origenId:'BC', destinoId: pickupPoints.find(p=>p.id!=='BC')?.id||'', items:[], usuario:'Arturo', estado:'borrador', observaciones:''});

  const confirmar = (tr) => {
    // Resta del origen, suma al destino, agrega movimientos
    tr.items.forEach(it=>{
      const p = products.find(x=>x.id===it.productoId); if(!p) return;
      const sbl = {...(p.stockByLocation||{})};
      sbl[tr.origenId] = Math.max(0, (sbl[tr.origenId]||0) - it.cantidad);
      sbl[tr.destinoId] = (sbl[tr.destinoId]||0) + it.cantidad;
      const nuevoStock = Object.values(sbl).reduce((s,v)=>s+v,0);
      dispatch({type:'UPSERT', collection:'products', item:{...p, stockByLocation:sbl, stock:nuevoStock}});
      dispatch({type:'UPSERT', collection:'movements', item:{id:uid('M'), productoId:p.id, tipo:'Ajuste', cantidad:it.cantidad, motivo:`Transferencia ${tr.id} ${tr.origenId}→${tr.destinoId}`, fecha:today(), costoUnit:p.costo, usuario:tr.usuario||'Bodega'}});
    });
    dispatch({type:'UPSERT', collection:'inventoryTransfers', item:{...tr, estado:'recibida'}});
    toast('Transferencia recibida · stock actualizado');
  };

  return <div className="p-8 space-y-6">
    <Card title="Transferencias de inventario" subtitle="Mover stock entre Bodega central y puntos de retiro" action={<Btn onClick={newTransfer}>Nueva transferencia</Btn>}>

        </tr></thead>
        <tbody>{[...inventoryTransfers].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(tr=>{
          const o=pickupPoints.find(p=>p.id===tr.origenId); const d=pickupPoints.find(p=>p.id===tr.destinoId);
          const unid = tr.items.reduce((s,i)=>s+i.cantidad,0);
          return <tr key={tr.id} className="border-b border-sina-lineSoft row-hover">
            <td className="py-3">{fmtDate(tr.fecha)}</td>
            <td>{o?.nombre}</td>
            <td>{d?.nombre}</td>
            <td className="text-right num">{tr.items.length}</td>
            <td className="text-right num">{unid}</td>
            <td className="text-sina-body text-xs">{tr.usuario}</td>
            <td><Badge tone={tr.estado==='recibida'?'mint':tr.estado==='en_transito'?'amber':'navy'} dot>{({borrador:'Borrador',en_transito:'En tránsito',recibida:'Recibida'})[tr.estado]||tr.estado}</Badge></td>
            <td className="text-right text-xs space-x-2">
              <button className="text-sina-navy font-medium" onClick={()=>setEdit({...tr})}>Detalle</button>
              {tr.estado!=='recibida' && <button className="text-sina-mint font-medium" onClick={()=>confirmar(tr)}>Confirmar recepción</button>}
            </td>
          </tr>;
        })}</tbody>
      </table>
    </Card>
    <Modal open={!!edit} onClose={()=>setEdit(null)} title={`Transferencia ${edit?.id||''}`} size="xl">
      {edit && <TransferForm tr={edit} setTr={setEdit} pickupPoints={pickupPoints} products={products} onSave={(t)=>{dispatch({type:'UPSERT', collection:'inventoryTransfers', item:t}); toast('Transferencia guardada'); setEdit(null);}} onCancel={()=>setEdit(null)}/>}

function periodRange(period){
  const today_ = new Date();
  if(period==='mensual'){ const d=new Date(today_.getFullYear(), today_.getMonth(), 1); return {from:d.toISOString().slice(0,10), to:today().slice(0,10), label:'Mes actual'}; }
  if(period==='trimestral'){ const q=Math.floor(today_.getMonth()/3); const d=new Date(today_.getFullYear(), q*3, 1); return {from:d.toISOString().slice(0,10), to:today(), label:`Q${q+1} ${today_.getFullYear()}`}; }
  if(period==='anual'){ const d=new Date(today_.getFullYear(),0,1); return {from:d.toISOString().slice(0,10), to:today(), label:String(today_.getFullYear())}; }
  return null;
}

function computeIncomeStatement(state, from, to){
  const { invoices=[], operatingExpenses=[], debtPayments=[], financialSettings={} } = state;
  const inRange = d => d>=from && d<=to;
  const facturas = invoices.filter(i=>i.estadoFactura!=='Anulada' && inRange(i.fechaEmision));
  const ingresos = facturas.reduce((s,i)=>s+i.neto,0);
  const costoVenta = facturas.reduce((s,i)=>s+i.items.reduce((a,b)=>a+b.cantidad*(b.costo_snapshot||b.costo||0),0),0);
  const margenBruto = ingresos - costoVenta;
  const sgaByCat = {};
  const sgaTotal = operatingExpenses.filter(g=>inRange(g.fecha)).reduce((s,g)=>{ sgaByCat[g.categoriaId]=(sgaByCat[g.categoriaId]||0)+g.monto; return s+g.monto; },0);
  const resultadoOperacional = margenBruto - sgaTotal;
  const ebitda = resultadoOperacional; // simplificación: sin D&A en este modelo
  const gastosFin = debtPayments.filter(p=>inRange(p.fecha)).reduce((s,p)=>s+p.interes,0);
  const rai = ebitda - gastosFin;
  const impuestoEst = Math.max(0, rai*0.27);
  const resultadoNeto = rai - impuestoEst;
  return { ingresos, costoVenta, margenBruto, margenBrutoPct: ingresos? margenBruto/ingresos:0, sgaByCat, sgaTotal, resultadoOperacional, ebitda, gastosFin, rai, impuestoEst, resultadoNeto };
}

function BalanceView(){
  const { state } = useStore();
  const { invoices=[], payments=[], products=[], supplierInvoices=[], debts=[], operatingExpenses=[], debtPayments=[], financialSettings={} } = state;
  const cajaInicial = financialSettings.cajaInicial || 0;
  const capitalInicial = financialSettings.capitalInicial || 0;
  // Caja simplificada
  const cobros = payments.reduce((s,p)=>s+p.monto,0);
  const pagosProv = supplierInvoices.flatMap(f=>f.pagos||[]).reduce((s,p)=>s+(p.monto||0),0);
  const pagosSGA = operatingExpenses.reduce((s,g)=>s+g.monto,0);
  const pagosDeuda = debtPayments.reduce((s,p)=>s+p.capital+p.interes,0);
  const caja = Math.max(0, cajaInicial + cobros - pagosProv - pagosSGA - pagosDeuda);
  // Activos
  const cxc = invoices.filter(i=>i.estadoPago==='Pendiente' || i.estadoPago==='Parcialmente pagada').reduce((s,i)=>s+i.total,0);
  const inventario = products.reduce((s,p)=>s+p.costo*p.stock,0);
  const otrosActivos = 0;
  const activosTotal = caja + cxc + inventario + otrosActivos;
  // Pasivos
  const cxp = supplierInvoices.filter(f=>f.estado!=='Pagada').reduce((s,f)=>s+(f.saldo||f.total),0);
  const deudaFin = debts.filter(d=>d.estado!=='Pagada').reduce((s,d)=>s+d.saldoPendiente,0);
  const otrosPasivos = 0;
  const pasivosTotal = cxp + deudaFin + otrosPasivos;
  // Patrimonio: capital + (activos - pasivos - capital)
  const resultadoAcumulado = activosTotal - pasivosTotal - capitalInicial;
  const patrimonioTotal = capitalInicial + resultadoAcumulado;
  const cuadre = activosTotal - (pasivosTotal + patrimonioTotal);

  const row = (label, value, opts={}) => <div className={`flex justify-between py-2 ${opts.bold?'font-semibold border-t border-sina-line':'text-sina-body'} ${opts.indent?'pl-4 text-sm':''}`}><span>{label}</span><span className="num">{CLP(value)}</span></div>;

  return <div className="p-8 space-y-6">
    <Card title="Balance gerencial" subtitle="Calculado a partir del estado actual del ERP">
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div>
          <div className="text-[11px] uppercase tracking-wider text-sina-muted mb-2">Activos</div>
          {row('Caja y bancos', caja, {indent:true})}
          {row('Cuentas por cobrar', cxc, {indent:true})}
          {row('Inventario valorizado', inventario, {indent:true})}
          {row('Otros activos', otrosActivos, {indent:true})}
          {row('Total activos', activosTotal, {bold:true})}
        </div>
        <div>
          <div className="text-[11px] uppercase tracking-wider text-sina-muted mb-2">Pasivos</div>
          {row('Cuentas por pagar', cxp, {indent:true})}
          {row('Deuda financiera', deudaFin, {indent:true})}
          {row('Otros pasivos', otrosPasivos, {indent:true})}
          {row('Total pasivos', pasivosTotal, {bold:true})}
          <div className="text-[11px] uppercase tracking-wider text-sina-muted mt-6 mb-2">Patrimonio</div>
          {row('Capital inicial', capitalInicial, {indent:true})}
          {row('Resultados acumulados (estimado)', resultadoAcumulado, {indent:true})}
          {row('Total patrimonio', patrimonioTotal, {bold:true})}
          {row('Pasivo + Patrimonio', pasivosTotal+patrimonioTotal, {bold:true})}
        </div>
      </div>
      {Math.abs(cuadre)>1 ? <div className="mt-6 p-3 rounded-lg border border-sina-amber/40 bg-amber-50/40 text-sm text-sina-amber">El balance no cuadra. Diferencia: {CLP(cuadre)}. Revise caja inicial, capital o cobros/pagos pendientes.</div>
                          : <div className="mt-6 p-3 rounded-lg border border-sina-mint/40 bg-emerald-50/40 text-sm text-sina-mint">Balance cuadrado: Activos = Pasivos + Patrimonio</div>}
    </Card>
  </div>;
}

/* ---------- Token seguro vía Web Crypto ---------- */
function generateSecureToken(bytes=24){
  try {
    const b = new Uint8Array(bytes);
    (window.crypto || window.msCrypto).getRandomValues(b);
    return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let out=''; for(let i=0;i<bytes*2;i++) out += Math.floor(Math.random()*16).toString(16);
    return out;
  }
}

/* ---------- Hash de contraseña ----------
   Usa Web Crypto SubtleCrypto SHA-256 + salt fijo. En producción real esto
   debería ejecutarse en backend con bcrypt/argon2 + salt por usuario. */
async function hashPassword(plain, salt='sina-erp-2026'){
  try {
    const enc = new TextEncoder().encode(salt+'::'+plain);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    // fallback no-crypto (sólo para entornos sin SubtleCrypto)
    let h=5381; const s=salt+'::'+plain;
    for(let i=0;i<s.length;i++) h = ((h<<5)+h) + s.charCodeAt(i);
    return 'fallback_'+(h>>>0).toString(16);
  }
}
async function verifyPassword(plain, hash){ return (await hashPassword(plain)) === hash; }

/* ---------- Auth Context ---------- */
const AuthCtx = createContext({currentUser:null, role:null, can:()=>true, login:()=>{}, logout:()=>{}, setCurrentUserId:()=>{}});
const useAuth = () => useContext(AuthCtx);

function AuthProvider({children}){
  const { state, dispatch } = useStore();
  const [currentUserId, _setCurrentUserId] = useState(()=>{ try { return localStorage.getItem('sina-current-user') || 'U1'; } catch { return 'U1'; } });
  const setCurrentUserId = (id) => {
    _setCurrentUserId(id);
    try { if(id) localStorage.setItem('sina-current-user', id); else localStorage.removeItem('sina-current-user'); } catch {}
  };

  const currentUser = currentUserId ? (state.users||[]).find(u=>u.id===currentUserId) : null;
  const role = currentUser ? (state.roles||[]).find(r=>r.id===currentUser.roleId) : null;

  const can = (modulo, accion) => {
    if(!currentUser) return false;
    if(role?.nombre==='Administrador') return true;
    const key = `${modulo}.${accion}`;
    const ov = currentUser.permisosOverride?.[key];
    if(ov!=null) return ov;
    return !!role?.permisos?.[key];
  };

  const login = async (email, password) => {
    const user = (state.users||[]).find(u=>u.email.toLowerCase()===String(email||'').toLowerCase() && u.activo);
    if(!user) throw new Error('Usuario no encontrado o cuenta inactiva');
    let ok = false;
    if(user.passwordHash) ok = await verifyPassword(password, user.passwordHash);
    if(!ok && user.passwordPlain) ok = user.passwordPlain===password;
    if(!ok) throw new Error('Credenciales incorrectas');
    setCurrentUserId(user.id);
    dispatch({type:'UPSERT', collection:'users', item:{...user, ultimoLogin:today()}});
    dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId:user.id, accion:'login', fecha:today(), detalle:'Inicio de sesión'}});
    return user;
  };

  const logout = () => {
    if(currentUser) dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId:currentUser.id, accion:'logout', fecha:today(), detalle:'Cierre de sesión'}});
    setCurrentUserId(null);
    if(window.location.hash) window.location.hash = '';
  };

  return <AuthCtx.Provider value={{currentUser, role, can, login, logout, setCurrentUserId}}>{children}</AuthCtx.Provider>;
}

/* ---------- Helper: enviar invitación (orquesta provider + outbox + audit) ---------- */
async function sendInvitationFlow({invitation, role, fromUser, dispatch}){
  const msg = buildInviteEmail(invitation, role, fromUser);
  const provider = EMAIL_PROVIDERS[ACTIVE_EMAIL_PROVIDER];
  const result = await provider.send(msg);
  dispatch({type:'UPSERT', collection:'emailOutbox', item:{
    id:uid('EM'), at:new Date().toISOString(), provider:provider.name, kind:'invite',
    to:msg.to, from:msg.from, subject:msg.subject, text:msg.text, html:msg.html,
    status: result.ok? 'enviado':'error', providerMessageId: result.id, activationLink: msg.activationLink
  }});
  dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId:fromUser.id, accion:'enviar_invitacion', fecha:today(), detalle:`Invitación a ${invitation.email} con rol ${role?.nombre||'—'}`}});
  return { result, msg };
}

  if(new Date(inv.expiresAt) < new Date()) return <CenteredCard><SinaLogo size={36}/><h1 className="text-lg font-semibold text-sina-rose">Invitación expirada</h1><p className="text-sm text-sina-muted">Pide al administrador que reenvíe la invitación.</p></CenteredCard>;

  const role = (state.roles||[]).find(r=>r.id===inv.roleId);

  const submit = async (e) => {
    e?.preventDefault();
    setErr('');
    if(!form.firstName.trim() || !form.lastName.trim()) return setErr('Completa nombre y apellido');
    if(form.password.length < 8) return setErr('La contraseña debe tener al menos 8 caracteres');
    if(form.password !== form.password2) return setErr('Las contraseñas no coinciden');
    setLoading(true);
    try {
      const hash = await hashPassword(form.password);
      const userId = inv.userId || uid('U');
      const user = {
        id: userId, nombre: form.firstName.trim(), apellido: form.lastName.trim(),
        email: inv.email, telefono: form.telefono, cargo: inv.cargo||'', area: inv.area||'',
        roleId: inv.roleId, activo: true, ultimoLogin: today(),
        permisosOverride: {}, authProviders:['password'],
        passwordHash: hash, activatedAt: today()
      };
      dispatch({type:'UPSERT', collection:'users', item:user});
      dispatch({type:'UPSERT', collection:'userInvitations', item:{...inv, status:'accepted', acceptedAt:today(), userId}});
      dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId, accion:'activate_account', fecha:today(), detalle:'Cuenta activada desde invitación'}});
      setDone(true);
      setTimeout(()=>{ window.location.hash=''; toast('Cuenta activada. Inicia sesión.'); }, 1800);
    } finally { setLoading(false); }
  };

  if(done) return <CenteredCard><SinaLogo size={36}/><h1 className="text-lg font-semibold text-sina-mint">Cuenta activada</h1><p className="text-sm text-sina-muted">Te redirigimos al login en un momento…</p></CenteredCard>;

  return <CenteredCard wide>
    <SinaLogo size={36}/>
    <h1 className="text-lg font-semibold text-sina-ink pt-2">Activa tu cuenta</h1>
    <p className="text-sm text-sina-muted">Fuiste invitado con el rol <b className="text-sina-navy">{role?.nombre||'—'}</b>. Completa tus datos para activar la cuenta.</p>
    <form onSubmit={submit} className="space-y-3 pt-2">
      <div className="grid grid-cols-2 gap-3">
        <Input label="Nombre" value={form.firstName} onChange={e=>setForm({...form, firstName:e.target.value})}/>
        <Input label="Apellido" value={form.lastName} onChange={e=>setForm({...form, lastName:e.target.value})}/>
      </div>
      <Input label="Email" value={inv.email} disabled/>
      <Input label="Teléfono (opcional)" value={form.telefono} onChange={e=>setForm({...form, telefono:e.target.value})}/>
      <Input label="Contraseña" type="password" value={form.password} onChange={e=>setForm({...form, password:e.target.value})} hint="Mínimo 8 caracteres"/>
      <Input label="Confirmar contraseña" type="password" value={form.password2} onChange={e=>setForm({...form, password2:e.target.value})}/>
      {err && <div className="text-xs text-sina-rose">{err}</div>}
      <Btn className="w-full" type="submit" disabled={loading}>{loading?'Activando…':'Activar cuenta'}</Btn>
    </form>
  </CenteredCard>;
}

function ForgotPasswordView(){
  const { state, dispatch } = useStore();
  const [email,setEmail] = useState('');
  const [sent,setSent] = useState(false);
  const [preview,setPreview] = useState(null);
  const submit = async (e) => {
    e?.preventDefault();
    setSent(true);
    const u = (state.users||[]).find(x=>x.email.toLowerCase()===email.toLowerCase() && x.activo);
    // Por seguridad NO revelamos si el email existe
    if(!u) return;
    const token = generateSecureToken();
    const reset = { id:uid('PR'), userId:u.id, token, createdAt:new Date().toISOString(), expiresAt:new Date(Date.now()+3600*1000).toISOString(), used:false };
    dispatch({type:'UPSERT', collection:'passwordResets', item:reset});
    const msg = buildPasswordResetEmail(u, token);
    const result = await EMAIL_PROVIDERS[ACTIVE_EMAIL_PROVIDER].send(msg);
    dispatch({type:'UPSERT', collection:'emailOutbox', item:{id:uid('EM'), at:new Date().toISOString(), provider:ACTIVE_EMAIL_PROVIDER, kind:'password_reset', to:msg.to, from:msg.from, subject:msg.subject, text:msg.text, html:msg.html, status:result.ok?'enviado':'error', resetLink:msg.resetLink}});
    dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId:u.id, accion:'solicitar_reset', fecha:today(), detalle:'Solicitud de reset de contraseña'}});
    setPreview(msg);
  };
  return <CenteredCard>
    <SinaLogo size={36}/>
    <h1 className="text-lg font-semibold text-sina-ink pt-2">Recuperar contraseña</h1>
    {!sent ? <form onSubmit={submit} className="space-y-3">
      <p className="text-sm text-sina-muted">Ingresa tu email registrado y te enviaremos un enlace para restablecer tu contraseña.</p>
      <Input label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} autoFocus/>
      <Btn className="w-full" type="submit">Enviar enlace</Btn>
      <button type="button" onClick={()=>{window.location.hash='';}} className="text-xs text-sina-navy font-medium w-full text-center">Volver al login</button>
    </form> : <div className="space-y-3">
      <p className="text-sm text-sina-body">Si la dirección está registrada, enviamos un correo con instrucciones.</p>
      {preview && <div className="border border-sina-line rounded-lg p-4 bg-sina-bg">
        <div className="text-[11px] uppercase tracking-wider text-sina-muted mb-2">Preview email enviado (modo demo)</div>
        <div className="text-xs"><b>Para:</b> {preview.to}</div>
        <div className="text-xs"><b>Asunto:</b> {preview.subject}</div>
        <pre className="text-xs mt-2 whitespace-pre-line text-sina-body">{preview.text}</pre>
        <Btn variant="ghost" size="sm" className="mt-2" onClick={()=>{window.location.hash = preview.resetLink.split('#')[1] ? '#'+preview.resetLink.split('#')[1] : '';}}>Abrir enlace de reset</Btn>
      </div>}
      <Btn className="w-full" variant="secondary" onClick={()=>{window.location.hash='';}}>Volver al login</Btn>
    </div>}
  </CenteredCard>;
}

function ResetPasswordView({token}){
  const { state, dispatch } = useStore();
  const toast = useToast();
  const reset = (state.passwordResets||[]).find(r=>r.token===token && !r.used);
  const user = reset? (state.users||[]).find(u=>u.id===reset.userId) : null;
  const [password,setPassword] = useState(''); const [password2,setPassword2] = useState('');
  const [err,setErr] = useState(''); const [done,setDone] = useState(false); const [loading,setLoading] = useState(false);

  if(!token || !reset) return <CenteredCard><SinaLogo size={36}/><h1 className="text-lg font-semibold text-sina-rose">Enlace inválido</h1><p className="text-sm text-sina-muted">Solicita un nuevo enlace de recuperación.</p><Btn className="w-full" onClick={()=>{window.location.hash='#forgot';}}>Solicitar enlace</Btn></CenteredCard>;
  if(new Date(reset.expiresAt) < new Date()) return <CenteredCard><SinaLogo size={36}/><h1 className="text-lg font-semibold text-sina-rose">Enlace expirado</h1><p className="text-sm text-sina-muted">Los enlaces de recuperación duran 1 hora.</p><Btn className="w-full" onClick={()=>{window.location.hash='#forgot';}}>Solicitar nuevo enlace</Btn></CenteredCard>;
  if(!user) return <CenteredCard><h1 className="text-lg font-semibold text-sina-rose">Usuario no encontrado</h1></CenteredCard>;

  const submit = async (e) => {
    e?.preventDefault(); setErr('');
    if(password.length<8) return setErr('La contraseña debe tener al menos 8 caracteres');
    if(password!==password2) return setErr('Las contraseñas no coinciden');
    setLoading(true);
    try {
      const hash = await hashPassword(password);
      dispatch({type:'UPSERT', collection:'users', item:{...user, passwordHash:hash, passwordPlain:null}});
      dispatch({type:'UPSERT', collection:'passwordResets', item:{...reset, used:true, usedAt:new Date().toISOString()}});
      dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId:user.id, accion:'reset_password', fecha:today(), detalle:'Contraseña restablecida'}});
      setDone(true);
      setTimeout(()=>{window.location.hash=''; toast('Contraseña restablecida. Inicia sesión.');},1500);
    } finally { setLoading(false); }
  };
  if(done) return <CenteredCard><SinaLogo size={36}/><h1 className="text-lg font-semibold text-sina-mint">Contraseña actualizada</h1><p className="text-sm text-sina-muted">Te redirigimos al login…</p></CenteredCard>;
  return <CenteredCard>
    <SinaLogo size={36}/>
    <h1 className="text-lg font-semibold text-sina-ink pt-2">Nueva contraseña</h1>
    <p className="text-sm text-sina-muted">Para la cuenta <b>{user.email}</b></p>
    <form onSubmit={submit} className="space-y-3 pt-2">
      <Input label="Nueva contraseña" type="password" value={password} onChange={e=>setPassword(e.target.value)} hint="Mínimo 8 caracteres" autoFocus/>
      <Input label="Confirmar contraseña" type="password" value={password2} onChange={e=>setPassword2(e.target.value)}/>
      {err && <div className="text-xs text-sina-rose">{err}</div>}
      <Btn className="w-full" type="submit" disabled={loading}>{loading?'Actualizando…':'Restablecer contraseña'}</Btn>
    </form>
  </CenteredCard>;
}

/* =====================================================================================
   VISTAS · INVITACIONES (sub-tab dentro de Usuarios)
   ===================================================================================== */
function InvitacionesView(){
  const { state, dispatch } = useStore();
  const { currentUser, can } = useAuth();
  const toast = useToast();
  const [showInvite, setShowInvite] = useState(false);
  const [emailPreview, setEmailPreview] = useState(null);
  const [filter, setFilter] = useState('all');

  const canManage = can('usuarios','gestionar');

  // Marcar como expiradas las invitaciones que pasaron de fecha
  const invitations = (state.userInvitations||[]).map(i=>{
    if(i.status==='pending' && new Date(i.expiresAt) < new Date()) return {...i, status:'expired'};
    return i;
  });

  const filtered = invitations.filter(i=>filter==='all' || i.status===filter)
    .sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));

  const pending = invitations.filter(i=>i.status==='pending').length;
  const accepted = invitations.filter(i=>i.status==='accepted').length;
  const expired = invitations.filter(i=>i.status==='expired').length;
  const cancelled = invitations.filter(i=>i.status==='cancelled').length;

  const reenviar = async (inv) => {
    if(!canManage) return toast('Sin permiso para gestionar usuarios','warn');
    const role = (state.roles||[]).find(r=>r.id===inv.roleId);
    // refrescar token + expiración
    const refreshed = {...inv, token:generateSecureToken(), expiresAt:addDays(today(),7), status:'pending', lastResentAt: new Date().toISOString()};
    dispatch({type:'UPSERT', collection:'userInvitations', item:refreshed});
    const { msg } = await sendInvitationFlow({invitation:refreshed, role, fromUser:currentUser, dispatch});
    setEmailPreview(msg);
    toast('Invitación reenviada');
  };
  const cancelar = (inv) => {
    if(!canManage) return toast('Sin permiso','warn');
    if(!confirm('¿Cancelar esta invitación?')) return;
    dispatch({type:'UPSERT', collection:'userInvitations', item:{...inv, status:'cancelled'}});
    dispatch({type:'UPSERT', collection:'auditLog', item:{id:uid('AU'), userId:currentUser.id, accion:'cancelar_invitacion', fecha:today(), detalle:`Canceló invitación a ${inv.email}`}});
    toast('Invitación cancelada','warn');
  };
  const copiarLink = (inv) => {
    const link = `${window.location.origin}${window.location.pathname}#activate?token=${inv.token}`;
    try { navigator.clipboard?.writeText(link); toast('Enlace copiado al portapapeles'); }
    catch { prompt('Copia el enlace:', link); }
  };

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
      <Kpi label="Total invitaciones" value={invitations.length}/>
      <Kpi label="Pendientes" value={pending} tone={pending>0?'accent':'neutral'}/>
      <Kpi label="Aceptadas" value={accepted} tone="good"/>
      <Kpi label="Expiradas" value={expired} tone={expired>0?'warn':'neutral'}/>
      <Kpi label="Canceladas" value={cancelled} tone="neutral"/>
    </div>

    <Card title="Invitaciones" subtitle="Invita usuarios al ERP. Cada uno recibirá un email con un enlace de activación seguro válido 7 días." action={
      <div className="flex gap-2">
        <Select value={filter} onChange={e=>setFilter(e.target.value)} className="!w-44"><option value="all">Todas</option><option value="pending">Pendientes</option><option value="accepted">Aceptadas</option><option value="expired">Expiradas</option><option value="cancelled">Canceladas</option></Select>
        <Btn onClick={()=>setShowInvite(true)} disabled={!canManage}>Invitar usuario</Btn>
      </div>
    }>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
          <th className="pb-2 font-medium">Email</th><th className="pb-2 font-medium">Nombre</th><th className="pb-2 font-medium">Cargo · Área</th><th className="pb-2 font-medium">Rol inicial</th><th className="pb-2 font-medium">Invitado por</th><th className="pb-2 font-medium">Creada</th><th className="pb-2 font-medium">Expira</th><th className="pb-2 font-medium">Estado</th><th></th>
        </tr></thead>
        <tbody>{filtered.map(inv=>{const role=(state.roles||[]).find(r=>r.id===inv.roleId); const byUser=(state.users||[]).find(u=>u.id===inv.invitedBy); return <tr key={inv.id} className="border-b border-sina-lineSoft row-hover">
          <td className="py-3 text-sina-ink">{inv.email}</td>
          <td>{inv.firstName} {inv.lastName}</td>
          <td className="text-xs">{inv.cargo}<div className="text-sina-muted">{inv.area}</div></td>
          <td><Badge tone="navy">{role?.nombre||'—'}</Badge></td>
          <td className="text-xs text-sina-body">{byUser? `${byUser.nombre} ${byUser.apellido}` : '—'}</td>
          <td className="text-xs">{fmtDate(inv.createdAt)}</td>
          <td className="text-xs">{fmtDate(inv.expiresAt)}<div className="text-sina-muted">{daysBetween(today(), inv.expiresAt)>=0?`en ${daysBetween(today(),inv.expiresAt)}d`:`hace ${-daysBetween(today(),inv.expiresAt)}d`}</div></td>
          <td><Badge tone={inv.status==='accepted'?'mint':inv.status==='pending'?'sky':inv.status==='expired'?'amber':'rose'} dot>{({pending:'Pendiente',accepted:'Aceptada',expired:'Expirada',cancelled:'Cancelada'})[inv.status]||inv.status}</Badge></td>
          <td className="text-right text-xs space-x-2">
            {inv.status==='pending' && <Fragment>
              <button className="text-sina-navy font-medium" onClick={()=>copiarLink(inv)}>Copiar enlace</button>
              <button className="text-sina-body font-medium" onClick={()=>reenviar(inv)}>Reenviar</button>
              <button className="text-sina-rose font-medium" onClick={()=>cancelar(inv)}>Cancelar</button>
            </Fragment>}
            {inv.status==='expired' && <button className="text-sina-navy font-medium" onClick={()=>reenviar(inv)}>Reenviar</button>}
          </td>
        </tr>;})}</tbody>
      </table>
      {filtered.length===0 && <div className="text-sm text-sina-muted py-8 text-center">Sin invitaciones para este filtro.</div>}
    </Card>

    <Modal open={showInvite} onClose={()=>setShowInvite(false)} title="Invitar usuario" size="md">
      <InviteForm onClose={()=>setShowInvite(false)} onSent={(preview)=>{setShowInvite(false); setEmailPreview(preview);}}/>
    </Modal>

    <Modal open={!!emailPreview} onClose={()=>setEmailPreview(null)} title="Email enviado" size="lg">
      {emailPreview && <EmailPreviewModal msg={emailPreview} onClose={()=>setEmailPreview(null)}/>}
    </Modal>
  </div>;
}

function InviteForm({onClose, onSent}){
  const { state, dispatch } = useStore();
  const { currentUser } = useAuth();
  const toast = useToast();
  const roles = state.roles||[];
  const [form, setForm] = useState({email:'', firstName:'', lastName:'', cargo:'', area:'', roleId:roles.find(r=>r.nombre==='Ventas')?.id||roles[0]?.id||''});
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e?.preventDefault(); setErr('');
    if(!form.firstName.trim() || !form.lastName.trim()) return setErr('Completa nombre y apellido');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) return setErr('Email inválido');
    // Validar duplicados
    const dupUser = (state.users||[]).find(u=>u.email.toLowerCase()===form.email.toLowerCase());
    if(dupUser) return setErr('Ya existe un usuario activo con ese email');
    const dupInv = (state.userInvitations||[]).find(i=>i.email.toLowerCase()===form.email.toLowerCase() && i.status==='pending');
    if(dupInv) return setErr('Ya existe una invitación pendiente para ese email');

    setLoading(true);
    try {
      const role = roles.find(r=>r.id===form.roleId);
      const invitation = {
        id: uid('INV'), email: form.email.trim().toLowerCase(),
        firstName: form.firstName.trim(), lastName: form.lastName.trim(),
        cargo: form.cargo, area: form.area, roleId: form.roleId,
        invitedBy: currentUser.id, token: generateSecureToken(),
        status:'pending', expiresAt: addDays(today(),7), createdAt: new Date().toISOString(),
        acceptedAt:null, lastResentAt:null, userId:null
      };
      dispatch({type:'UPSERT', collection:'userInvitations', item:invitation});
      const { msg } = await sendInvitationFlow({invitation, role, fromUser:currentUser, dispatch});
      toast(`Invitación enviada a ${invitation.email}`);
      onSent(msg);
    } finally { setLoading(false); }
  };

  return <form onSubmit={submit} className="space-y-3">
    <div className="grid grid-cols-2 gap-3">
      <Input label="Nombre" value={form.firstName} onChange={e=>setForm({...form, firstName:e.target.value})}/>
      <Input label="Apellido" value={form.lastName} onChange={e=>setForm({...form, lastName:e.target.value})}/>
    </div>
    <Input label="Email" type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})}/>
    <div className="grid grid-cols-2 gap-3">
      <Input label="Cargo" value={form.cargo} onChange={e=>setForm({...form, cargo:e.target.value})}/>
      <Input label="Área" value={form.area} onChange={e=>setForm({...form, area:e.target.value})}/>
    </div>
    <Select label="Rol inicial" value={form.roleId} onChange={e=>setForm({...form, roleId:e.target.value})}>{roles.map(r=><option key={r.id} value={r.id}>{r.nombre}</option>)}</Select>
    {err && <div className="text-xs text-sina-rose">{err}</div>}
    <div className="text-xs text-sina-muted">El usuario recibirá un email con un enlace de activación seguro. La invitación expirará en 7 días.</div>
    <div className="flex justify-end gap-2 pt-3 border-t border-sina-line">
      <Btn variant="ghost" onClick={onClose} type="button">Cancelar</Btn>
      <Btn type="submit" disabled={loading}>{loading?'Enviando…':'Enviar invitación'}</Btn>
    </div>
  </form>;
}

/* ---------- CSV: parseo robusto, templates y export ---------- */
function csvEscape(v){
  if(v==null) return '';
  const s = String(v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function csvBuild(headers, rows){
  return [headers.join(',')].concat(rows.map(r=>headers.map(h=>csvEscape(r[h])).join(','))).join('\n');
}
function downloadFile(name, content, mime='text/csv;charset=utf-8'){
  const blob = new Blob(['﻿'+content], {type:mime});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function csvParse(text){
  const rows=[]; let cur=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"' && text[i+1]==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ cur.push(field); field=''; }
      else if(c==='\n'){ cur.push(field); rows.push(cur); cur=[]; field=''; }
      else if(c==='\r'){}
      else field+=c;
    }
  }
  if(field || cur.length){ cur.push(field); rows.push(cur); }
  return rows.filter(r=>r.length>1 || (r.length===1 && r[0]!==''));
}

function csvFromState(stateKey, state){
  const sch = CSV_SCHEMAS[stateKey];
  if(!sch) return '';
  if(stateKey==='sales'){
    const rows=[]; state.sales.forEach(o=>{
      const c=state.clients.find(x=>x.id===o.clienteId);
      o.items.forEach(it=>rows.push({numero:o.numero, clienteRut:c?.rut||'', fecha:o.fecha, sku:it.sku, cantidad:it.cantidad, precioUnitario:it.precio, descuentoPct:Math.round((it.descuento||0)*100)}));
    });
    return csvBuild(sch.headers, rows);
  }
  if(stateKey==='movements'){
    const rows = state.movements.map(m=>{const p=state.products.find(x=>x.id===m.productoId); return {sku:p?.sku||'', tipo:m.tipo, cantidad:m.cantidad, motivo:m.motivo, fecha:m.fecha};});
    return csvBuild(sch.headers, rows);
  }
  if(stateKey==='suppliers'){
    const rows = state.suppliers.map(s=>({nombre:s.nombre, pais:s.pais, contacto:s.contacto, email:s.email, telefono:s.telefono, ciudad:s.ciudad||'', codigoPostal:s.codigoPostal||'', tiempoProduccionDias:s.tiempoProduccionDias||0, tiempoTransitoDias:s.tiempoTransitoDias||0, leadTimeDias:s.leadTimeDias, moneda:s.moneda, banco:s.banca?.banco||'', titular:s.banca?.titular||'', cuenta:s.banca?.cuenta||'', swift:s.banca?.swift||''}));
    return csvBuild(sch.headers, rows);
  }
  return csvBuild(sch.headers, state[stateKey]||[]);
}

function CsvActions({stateKey, onImport, label='Datos'}){
  const { state } = useStore();
  const sch = CSV_SCHEMAS[stateKey];
  const [preview,setPreview]=useState(null);
  const toast = useToast();
  const fileInput = useRef();

  const downloadTemplate = () => {
    const csv = csvBuild(sch.headers, [sch.sample]);
    downloadFile(`plantilla_${sch.file}.csv`, csv);
  };
  const exportAll = () => {
    downloadFile(`export_${sch.file}_${today()}.csv`, csvFromState(stateKey, state));
    toast(`${label}: exportación completada`);
  };
  const handleFile = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rows = csvParse(reader.result);
        if(!rows.length){ toast('CSV vacío','warn'); return; }
        const headers = rows[0].map(h=>h.trim());
        const dataRows = rows.slice(1).map(r=>{
          const obj={}; headers.forEach((h,i)=>obj[h]=(r[i]||'').trim()); return obj;
        });
        const parsed = dataRows.map((r,idx)=>{
          const errs = sch.validate ? sch.validate(r) : [];
          const item = sch.parseRow ? sch.parseRow(r) : r;
          return { idx:idx+2, raw:r, item, errors:errs };
        });
        setPreview({ rows:parsed, headers });
      } catch(err) {
        toast('Error al leer CSV: '+err.message,'error');
      }
    };
    reader.readAsText(f);
    e.target.value='';
  };
  const confirmImport = () => {
    if(!preview) return;
    const valid = preview.rows.filter(r=>r.errors.length===0);
    onImport(valid.map(r=>r.item));
    toast(`${valid.length} ${label.toLowerCase()} importado(s)`);
    setPreview(null);
  };

  return <Fragment>
    <Btn variant="ghost" size="sm" onClick={downloadTemplate}>Plantilla CSV</Btn>
    <Btn variant="ghost" size="sm" onClick={()=>fileInput.current.click()}>Importar CSV</Btn>
    <input ref={fileInput} type="file" accept=".csv,text/csv" className="hidden" onChange={handleFile}/>
    <Btn variant="secondary" size="sm" onClick={exportAll}>Exportar</Btn>
    <Modal open={!!preview} onClose={()=>setPreview(null)} title={`Previsualizar importación · ${label}`} size="xl">
      {preview && (() => {
        const ok = preview.rows.filter(r=>r.errors.length===0).length;
        const err = preview.rows.length - ok;
        return <div className="space-y-4">
          <div className="grid grid-cols-3 gap-3">
            <Kpi label="Filas detectadas" value={preview.rows.length}/>
            <Kpi label="Válidas" value={ok} tone={ok>0?'good':'neutral'}/>
            <Kpi label="Con errores" value={err} tone={err>0?'risk':'neutral'}/>
          </div>
          <div className="border border-sina-line rounded-lg overflow-x-auto max-h-96 overflow-y-auto scrollbar">
            <table className="w-full text-xs">
              <thead className="bg-sina-bg sticky top-0"><tr><th className="px-3 py-2 text-left text-sina-muted">Fila</th>{preview.headers.map(h=><th key={h} className="px-3 py-2 text-left text-sina-muted font-medium">{h}</th>)}<th className="px-3 py-2 text-left text-sina-muted">Validación</th></tr></thead>
              <tbody>{preview.rows.slice(0,200).map(r=>(
                <tr key={r.idx} className={`border-t border-sina-lineSoft ${r.errors.length?'bg-rose-50/30':''}`}>
                  <td className="px-3 py-2 font-mono text-sina-muted">{r.idx}</td>
                  {preview.headers.map(h=><td key={h} className="px-3 py-2 text-sina-ink">{r.raw[h]}</td>)}
                  <td className="px-3 py-2">{r.errors.length===0 ? <Badge tone="mint" dot>OK</Badge> : <span className="text-sina-rose text-[11px]">{r.errors.join(' · ')}</span>}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
          <div className="flex justify-end gap-2">
            <Btn variant="ghost" onClick={()=>setPreview(null)}>Cancelar</Btn>
            <Btn onClick={confirmImport} disabled={ok===0}>Confirmar e importar {ok}</Btn>
          </div>
        </div>;
      })()}
    </Modal>
  </Fragment>;
}

function evaluateAutomations(state){
  const out = [];
  (state.automations||[]).forEach(rule=>{
    if(!rule.activa) return;
    const t = `${rule.trigger.entity}.${rule.trigger.condicion}`;
    if(t==='factura.vencida_mas_de'){
      state.invoices.filter(i=>i.estadoPago==='Pendiente' && daysBetween(i.fechaVencimiento,today())>=(+rule.trigger.valor||0)).forEach(i=>{
        out.push({ruleId:rule.id, evento:'Factura '+i.folio, detalle:`vencida hace ${daysBetween(i.fechaVencimiento,today())} días`});
      });
    } else if(t==='cliente.riesgo_fuga'){
      state.clients.forEach(c=>{
        const st = clientStats(c, state.invoices, state.payments);
        const ch = churnRisk(st);
        const nivel = (rule.trigger.valor||'').toLowerCase();
        if((nivel==='alto' && ch.level==='Alto') || (nivel==='medio' && ch.level==='Medio')){
          out.push({ruleId:rule.id, evento:c.razonSocial, detalle:`riesgo ${ch.level.toLowerCase()}`});
        }
      });
    } else if(t==='producto.bajo_stock'){
      state.products.filter(p=>p.stock>0 && p.stock<p.stockMin).forEach(p=>out.push({ruleId:rule.id, evento:p.nombre, detalle:`stock ${p.stock} < mín ${p.stockMin}`}));
    } else if(t==='producto.riesgo_quiebre'){
      state.products.filter(p=>p.stock < p.stockMin*0.5).forEach(p=>out.push({ruleId:rule.id, evento:p.nombre, detalle:`stock ${p.stock} bajo 50% del mínimo`}));
    }
  });
  return out;
}

/* ---------- Cálculo de descuento flexible ($ o %) ---------- */
function applyDiscount(precio, cantidad, descuento){
  // descuento: { tipo:'%'|'$', valor:number }
  const subtotal = precio*cantidad;
  if(!descuento || !descuento.valor) return subtotal;
  if(descuento.tipo==='$') return Math.max(0, subtotal - (+descuento.valor));
  return Math.max(0, subtotal * (1 - (+descuento.valor)/100));
}
function computeDocTotals(items, descuentoGlobal){
  let bruto = items.reduce((s,i)=>s+i.precio*i.cantidad, 0);
  let conLinea = items.reduce((s,i)=>s+(i.total||0), 0);
  let neto = conLinea;
  if(descuentoGlobal && descuentoGlobal.valor){
    if(descuentoGlobal.tipo==='$') neto = Math.max(0, conLinea - (+descuentoGlobal.valor));
    else neto = Math.max(0, conLinea*(1-(+descuentoGlobal.valor)/100));
  }
  const iva = Math.round(neto*0.19);
  const total = Math.round(neto)+iva;
  return { bruto, neto:Math.round(neto), iva, total };
}

function useHashRoute(){
  const [hash, setHash] = useState(typeof window!=='undefined' ? window.location.hash : '');
  useEffect(()=>{
    const onChange = () => setHash(window.location.hash);
    window.addEventListener('hashchange', onChange);
    return ()=>window.removeEventListener('hashchange', onChange);
  },[]);
  // parse #name?key=value
  const m = hash.match(/^#([\w-]+)(?:\?(.+))?$/);
  const name = m?.[1] || null;
  const params = new URLSearchParams(m?.[2] || '');
  return { name, params, raw:hash };
}

          {active==='compras'    && tab==='ordenes'        && <OrdenesCompraView go={go}/>}
          {active==='compras'    && tab==='cxp'            && <CuentasPorPagarView go={go}/>}
          {active==='compras'    && tab==='inteligencia'   && <InteligenciaCompraView go={go}/>}

          {active==='puntos'     && <PuntosRetiroView tab={tab} go={go}/>}
          {active==='finanzas'   && <FinanzasView tab={tab} go={go}/>}
          {active==='deuda'      && <DeudaView tab={tab}/>}
          {active==='mensajeria' && <MensajeriaView tab={tab} go={go}/>}
          {active==='usuarios'   && <UsuariosView tab={tab}/>}
          {active==='automatizaciones' && <AutomatizacionesView/>}
          {active==='reportes'   && <ReportesView/>}
          {active==='config'     && <ConfigView/>}
        </main>
      </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
