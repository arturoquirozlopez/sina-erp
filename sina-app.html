<div id="root"></div>

<script type="text/babel" data-presets="env,react">
/* =====================================================================================
   SINA · SISTEMA OPERATIVO
   ERP + CRM + Inventario + Compras + Cobranzas + BI
   ===================================================================================== */
const { useState, useEffect, useMemo, useReducer, useRef, useCallback, createContext, useContext, Fragment } = React;

/* ---------- Helpers ---------- */
const CLP = n => '$' + Math.round(n||0).toLocaleString('es-CL');
const NUM = n => (Math.round((n||0)*100)/100).toLocaleString('es-CL');
const PCT = n => (n==null||isNaN(n)?'—':(n*100).toFixed(1)+'%');
const fmtDate = d => { if(!d) return '—'; const x=new Date(d); return x.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}); };
const fmtMonth = d => { const x=new Date(d); return x.toLocaleDateString('es-CL',{month:'short',year:'2-digit'}); };
const daysBetween = (a,b) => Math.floor((new Date(b)-new Date(a))/(1000*60*60*24));
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const uid = (p='') => p + Math.random().toString(36).slice(2,9).toUpperCase();
const pick = (arr) => arr[Math.floor(Math.random()*arr.length)];
const range = n => Array.from({length:n},(_,i)=>i);
const rand = (a,b) => Math.floor(a+Math.random()*(b-a));
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-');

/* ---------- RUT ---------- */
function rutDV(num){let M=0,S=1;for(;num;num=Math.floor(num/10))S=(S+num%10*(9-M++%6))%11;return S?S-1:'K';}
function genRUT(){const n=rand(8000000,25000000);return `${n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}-${rutDV(n)}`;}

/* ---------- Catálogo Sina (pinturas) ---------- */
const CATEGORIAS = ['Látex','Esmalte al agua','Esmalte sintético','Óleo','Barniz','Anticorrosivo','Selladores','Diluyentes','Accesorios'];
const ACABADOS = ['Mate','Satinado','Semibrillo','Brillante'];
const COLORES_BASE = ['Blanco','Negro','Beige','Gris Perla','Azul Marino','Verde Bosque','Rojo Toscana','Amarillo Sol','Terracota','Celeste','Marrón Chocolate'];
const FORMATOS = [{n:'1 L',f:1},{n:'4 L',f:3.6},{n:'1 GL',f:3.8},{n:'5 GL',f:18},{n:'20 L',f:18.5},{n:'200 L',f:185}];
const COMUNAS = ['Santiago','Providencia','Las Condes','Ñuñoa','Maipú','La Florida','Puente Alto','Quilicura','San Bernardo','Vitacura','La Reina','Estación Central','Recoleta','Independencia','Macul','Peñalolén'];
const SEGMENTOS = ['Constructora','Ferretería','Pintor Profesional','Retail','Industria','Inmobiliaria','Mayorista'];
const EJECUTIVOS = ['María Fernández','Carlos Reyes','Javiera Soto','Diego Pérez','Camila Rojas'];

const NOMBRES_EMPRESA = ['Constructora Andes','Pinturas El Maestro','Ferretería Cordillera','Inmobiliaria Aconcagua','Maestranza Bío Bío','Edificios del Sur','Grupo Renacer','Hogar y Color','Industrias del Pacífico','Distribuidora Atacama','Pintamax','Acabados Premium','Color Total','Constructora Aysén','Servicios Maule','Pinturería Central','Obras y Diseño','Maestros del Color','Aceros Lircay','Maderas Patagonia','Cementos Río','Decohome SpA','Pintura Express','Constructora Llaima','Servicios Punta Arenas','Inversiones Limarí','Color Studio','MegaPinturas','Comercial Elqui','Ferretería Nuevo Sol'];

/* ---------- BillingProvider abstraction ---------- */
class BillingProvider {
  async emit(invoice){ throw new Error('not implemented'); }
  async cancel(folio){ throw new Error('not implemented'); }
  get name(){ return 'abstract'; }
}
class InternalMockProvider extends BillingProvider {
  get name(){ return 'sina-internal-mock'; }
  async emit(inv){
    await new Promise(r=>setTimeout(r,120));
    return { ok:true, providerFolio: 'SINA-'+rand(100000,999999), trackId: uid('TRK-'), response:{aceptado:true, glosa:'Folio recepcionado correctamente'} };
  }
  async cancel(folio){
    await new Promise(r=>setTimeout(r,80));
    return { ok:true, response:{aceptado:true, glosa:'Anulación registrada'} };
  }
}
// Stubs (no usados, demuestran extensibilidad)
class BsaleProvider extends BillingProvider { get name(){return 'bsale'} }
class OpenFacturaProvider extends BillingProvider { get name(){return 'openfactura'} }
class NuboxProvider extends BillingProvider { get name(){return 'nubox'} }
class DefontanaProvider extends BillingProvider { get name(){return 'defontana'} }
const PROVIDERS = { 'sina-internal-mock': new InternalMockProvider(), bsale:new BsaleProvider(), openfactura:new OpenFacturaProvider(), nubox:new NuboxProvider(), defontana:new DefontanaProvider() };
let ACTIVE_PROVIDER = 'sina-internal-mock';

/* ---------- Seed data ---------- */
function seedProducts(){
  const list=[]; let i=0;
  CATEGORIAS.forEach(cat=>{
    const cuantos = ['Látex','Esmalte al agua','Esmalte sintético'].includes(cat) ? 8 : cat==='Accesorios'?6:4;
    for(let k=0;k<cuantos;k++){
      const color = pick(COLORES_BASE);
      const fmt = pick(FORMATOS);
      const acabado = ['Látex','Esmalte al agua','Esmalte sintético','Óleo'].includes(cat) ? pick(ACABADOS) : '';
      const nombre = cat==='Accesorios'
        ? pick(['Rodillo profesional','Brocha pelo natural','Pincel artístico','Bandeja','Espátula','Lija al agua','Cinta de enmascarar','Guantes nitrilo'])+' '+fmt.n
        : `${cat} ${color} ${acabado} ${fmt.n}`.trim();
      const costo = Math.round((cat==='Accesorios'? rand(800,4500) : rand(2500,9000)*fmt.f/3.6)/10)*10;
      const margen = cat==='Accesorios'? 0.45 : 0.32+Math.random()*0.18;
      const precio = Math.round(costo/(1-margen)/10)*10;
      const stock = rand(0,180);
      const stockMin = rand(15,50);
      const stockReco = stockMin*3;
      list.push({
        id: uid('P'),
        sku: 'SN-'+ String(++i).padStart(4,'0'),
        nombre, categoria:cat, acabado, color: cat==='Accesorios'?'':color, formato:fmt.n,
        descripcion: cat==='Accesorios'? 'Herramienta profesional para aplicación.' : `Pintura ${cat.toLowerCase()} de alto rendimiento. Acabado ${acabado.toLowerCase()}, color ${color.toLowerCase()}, formato ${fmt.n}.`,
        proveedorId: null,
        costo, precio, margen: (precio-costo)/precio,
        stock, stockMin, stockReco,
        creado: addDays(today(),-rand(60,720))
      });
    }
  });
  return list;
}
function seedSuppliers(){
  const ch=['Guangzhou ColorTech Co.','Shenzhen PaintMaster Ltd.','Ningbo Chemicals Group','Qingdao Coatings Inc.','Foshan Brush & Tools'];
  const cl=['Químicos Andinos SpA','Distribuidora Quilín','Importadora Costanera','Solventes del Sur Ltda.'];
  const list=[];
  ch.forEach(n=>{
    const prod=rand(20,40), trans=rand(35,55);
    list.push({
      id:uid('SUP'), nombre:n, pais:'China',
      contacto:pick(['Mr. Liu','Ms. Wang','Mr. Zhang','Ms. Chen']),
      email:slug(n).slice(0,12)+'@'+slug(n).split('-')[0]+'.cn',
      telefono:'+86 '+rand(130,189)+' '+rand(1000,9999)+' '+rand(1000,9999),
      direccion: pick(['No. 88 Zhujiang Rd.','12F Pearl Tower, Tianhe','Building C, Industrial Park'])+', '+pick(['Guangzhou','Shenzhen','Ningbo','Qingdao','Foshan']),
      ciudad: pick(['Guangzhou','Shenzhen','Ningbo','Qingdao','Foshan']),
      codigoPostal: String(rand(100000,999999)),
      tiempoProduccionDias: prod,
      tiempoTransitoDias: trans,
      leadTimeDias: prod+trans,
      moneda:'USD',
      banca:{
        banco: pick(['Bank of China','HSBC Hong Kong','ICBC','Standard Chartered']),
        titular: n,
        cuenta: String(rand(1000000000,9999999999)),
        swift: pick(['BKCHCNBJ','HSBCHKHH','ICBKCNBJ','SCBLHKHH']),
        iban: '',
        monedaCuenta:'USD'
      }
    });
  });
  cl.forEach(n=>{
    const trans=rand(2,5);
    list.push({
      id:uid('SUP'), nombre:n, pais:'Chile',
      contacto:pick(['Sr. Muñoz','Sra. Rojas','Sr. Cárdenas','Sra. Vega']),
      email:'contacto@'+slug(n).split('-')[0]+'.cl',
      telefono:'+56 9 '+rand(4000,9999)+' '+rand(1000,9999),
      direccion: pick(['Av. Vicuña Mackenna','Av. Apoquindo','Camino Lo Echevers','Av. Américo Vespucio'])+' '+rand(1000,9999),
      ciudad: pick(['Santiago','Quilicura','Pudahuel','San Bernardo']),
      codigoPostal: String(rand(7000000,9000000)),
      tiempoProduccionDias: rand(2,5),
      tiempoTransitoDias: trans,
      leadTimeDias: rand(5,15),
      moneda:'CLP',
      banca:{
        banco: pick(['Banco de Chile','BCI','Santander','Itaú']),
        titular: n+' SpA',
        cuenta: String(rand(10000000,99999999)),
        swift: '',
        iban: '',
        monedaCuenta:'CLP'
      }
    });
  });
  return list;
}
function seedClients(){
  return NOMBRES_EMPRESA.map((n,i)=>{
    const seg = pick(SEGMENTOS);
    return {
      id: uid('C'),
      razonSocial: n + ' SpA',
      contacto: pick(['Juan Morales','María González','Pedro Saavedra','Carolina Tapia','Luis Henríquez','Andrea Vidal','Felipe Cárcamo','Patricia Olmedo','Ricardo Bustos','Daniela Quintana']),
      rut: genRUT(),
      email: 'contacto@'+slug(n).split('-').slice(0,2).join('')+'.cl',
      telefono: '+56 9 '+rand(4000,9999)+' '+rand(1000,9999),
      direccion: pick(['Av. Apoquindo','Av. Vicuña Mackenna','Av. Irarrázaval','Av. Pajaritos','Av. Vitacura','Av. Tobalaba','Camino El Alba','Av. Macul'])+' '+rand(100,9999),
      comuna: pick(COMUNAS),
      ciudad: 'Santiago',
      segmento: seg,
      ejecutivo: pick(EJECUTIVOS),
      creado: addDays(today(),-rand(60,1100))
    };
  });
}

function seedAll(){
  const products = seedProducts();
  const suppliers = seedSuppliers();
  products.forEach(p=>{ p.proveedorId = pick(suppliers).id; });
  const clients = seedClients();

  // Inventory movements (initial entries)
  const movs = [];
  products.forEach(p=>{
    movs.push({ id:uid('M'), productoId:p.id, tipo:'Entrada', cantidad: p.stock+rand(50,150), motivo:'Stock inicial', fecha: addDays(today(),-rand(180,360)), costoUnit:p.costo, usuario:'Sistema' });
  });

  // Sales: 12 months of orders + invoices + payments
  const sales=[], invoices=[], payments=[], quotes=[];
  const startDate = addDays(today(),-365);
  let folio = 10000;
  clients.forEach(c=>{
    const freq = c.segmento==='Mayorista'? rand(8,18) : c.segmento==='Constructora'? rand(5,12) : c.segmento==='Industria'? rand(4,10) : rand(2,8);
    for(let k=0;k<freq;k++){
      const fecha = addDays(startDate, rand(0,360));
      const nItems = rand(1,6);
      const items=[];
      let subtotal=0;
      for(let j=0;j<nItems;j++){
        const p=pick(products);
        const cant=rand(1,12);
        const desc = Math.random()<0.2? rand(2,10)/100 : 0;
        const totalLinea = Math.round(p.precio*cant*(1-desc));
        items.push({ productoId:p.id, sku:p.sku, nombre:p.nombre, cantidad:cant, precio:p.precio, descuento:desc, total:totalLinea, costo:p.costo });
        subtotal += totalLinea;
      }
      const neto = Math.round(subtotal);
      const iva = Math.round(neto*0.19);
      const total = neto+iva;
      const oid = uid('OV');
      const estado = pick(['Pagada','Pagada','Pagada','Facturada','Entregada','Confirmada']);
      // Construir historial de transiciones realista
      const trayectoria = ['Pendiente','Confirmada','Entregada','Facturada','Pagada'];
      const cortePos = trayectoria.indexOf(estado);
      const historial = trayectoria.slice(0, cortePos+1).map((e,i)=>({
        de: i===0?null:trayectoria[i-1], a:e,
        fecha: addDays(fecha, i*2),
        usuario: i===0?'Sistema':c.ejecutivo,
        modo: i===0?'inicial':'automatico'
      }));
      sales.push({ id:oid, numero:'OV-'+(++folio), clienteId:c.id, fecha, items, neto, iva, total, estado, vendedor:c.ejecutivo, historialEstados: historial });
      if(['Facturada','Pagada'].includes(estado)){
        const inv = {
          id: uid('F'), folio: rand(100000,999999), oid, clienteId:c.id, items, neto, iva, total,
          fechaEmision: fecha, fechaVencimiento: addDays(fecha,30),
          estadoFactura:'Emitida', estadoPago: estado==='Pagada'?'Pagada':'Pendiente',
          providerResponse:{ aceptado:true, glosa:'Folio recepcionado correctamente' },
          providerName: 'sina-internal-mock',
          providerFolio: 'SINA-'+rand(100000,999999),
          trackId: uid('TRK-')
        };
        invoices.push(inv);
        if(estado==='Pagada'){
          payments.push({ id:uid('PG'), invoiceId:inv.id, fecha:addDays(fecha,rand(5,40)), monto:total, metodo:pick(['Transferencia','Cheque','Efectivo']), referencia:'OP-'+rand(10000,99999) });
        }
      }
      // Movements (Salida)
      items.forEach(it=>{
        movs.push({ id:uid('M'), productoId:it.productoId, tipo:'Salida', cantidad:it.cantidad, motivo:'Venta '+oid, fecha, costoUnit:it.costo, usuario:c.ejecutivo });
      });
    }
    // Some quotes (drafts/sent)
    if(Math.random()<0.4){
      const fecha = addDays(today(),-rand(0,40));
      const nItems=rand(1,4);
      const items=[]; let subt=0;
      for(let j=0;j<nItems;j++){const p=pick(products); const cant=rand(1,8); const total=p.precio*cant; items.push({productoId:p.id,sku:p.sku,nombre:p.nombre,cantidad:cant,precio:p.precio,descuento:0,total,costo:p.costo}); subt+=total;}
      const neto=subt, iva=Math.round(neto*0.19), total=neto+iva;
      const qEstado = pick(['Borrador','Enviada','Enviada','Aprobada','Rechazada']);
      const qVence = addDays(fecha,15);
      const expirada = qVence < today() && ['Borrador','Enviada'].includes(qEstado);
      quotes.push({
        id:uid('CT'), numero:'COT-'+(++folio), clienteId:c.id, fecha, vence:qVence,
        items, neto, iva, total,
        estado: expirada?'Expirada':qEstado, vendedor:c.ejecutivo,
        descuentoGlobal:{ tipo:'%', valor:0 },
        observaciones:'',
        condiciones:'Forma de pago: 30 días desde emisión de factura. Despacho FOB Santiago. Cotización sujeta a disponibilidad de stock.',
        historialEnvios: qEstado!=='Borrador' ? [{fecha:addDays(fecha,1), canal:'email', destinatario:c.email, asunto:'Cotización Sina N° COT-'+folio}] : []
      });
    }
  });

  // Apply movements to current stock (recompute)
  const stockMap={};
  products.forEach(p=>stockMap[p.id]=0);
  movs.forEach(m=>{ stockMap[m.productoId] += (m.tipo==='Entrada'?m.cantidad:-m.cantidad); });
  products.forEach(p=>{ p.stock = Math.max(0, stockMap[p.id]); });

  // Purchase orders
  const purchaseOrders=[];
  suppliers.forEach(sup=>{
    const cuantas = sup.pais==='China'? 3 : 4;
    for(let k=0;k<cuantas;k++){
      const items=[];
      const candidatos = products.filter(p=>p.proveedorId===sup.id);
      if(!candidatos.length) continue;
      const n=rand(2,5);
      let total=0;
      for(let j=0;j<n;j++){
        const p=pick(candidatos);
        const cant=rand(50,400);
        const costo=p.costo;
        items.push({productoId:p.id, sku:p.sku, nombre:p.nombre, cantidad:cant, costo, total:cant*costo});
        total+=cant*costo;
      }
      const fechaEmit = addDays(today(),-rand(0, sup.pais==='China'?180:30));
      const eta = addDays(fechaEmit, sup.leadTimeDias);
      const llegado = daysBetween(today(),eta) < 0;
      const estado = llegado? pick(['Recibida','Recibida','Llegada']) : (sup.pais==='China'? pick(['En tránsito','En producción','En tránsito','Confirmada']) : pick(['Confirmada','Enviada','En tránsito']));
      const ocId = uid('OC');
      purchaseOrders.push({
        id:ocId, numero:'OC-'+rand(2000,9999), proveedorId:sup.id,
        fecha:fechaEmit, eta, etaReal: llegado? addDays(eta, rand(-5,10)): null,
        items, total, estado, moneda:sup.moneda,
        documentos: llegado? [
          {id:uid('DOC'), tipo:'Proforma', nombre:'proforma_'+ocId.toLowerCase()+'.pdf', size:rand(80,250)+' KB', fecha:fechaEmit, dataUrl:''},
          {id:uid('DOC'), tipo:'Invoice', nombre:'invoice_'+ocId.toLowerCase()+'.pdf', size:rand(80,250)+' KB', fecha:addDays(fechaEmit, sup.tiempoProduccionDias||10), dataUrl:''},
          {id:uid('DOC'), tipo:'Packing List', nombre:'packing_'+ocId.toLowerCase()+'.pdf', size:rand(40,120)+' KB', fecha:addDays(fechaEmit, (sup.tiempoProduccionDias||10)+2), dataUrl:''},
          ...(sup.pais==='China' ? [{id:uid('DOC'), tipo:'Bill of Lading', nombre:'bl_'+ocId.toLowerCase()+'.pdf', size:rand(60,200)+' KB', fecha:addDays(fechaEmit, (sup.tiempoProduccionDias||10)+5), dataUrl:''}] : [])
        ] : [],
        historial:[
          {de:null, a:'Borrador', fecha:fechaEmit, usuario:'Sistema'},
          {de:'Borrador', a:'Confirmada', fecha:addDays(fechaEmit,1), usuario:'Arturo'}
        ]
      });
    }
  });

  // Bank transactions (a mix; some unreconciled)
  const bankTx=[];
  payments.forEach(p=>{
    if(Math.random()<0.7){
      bankTx.push({ id:uid('TX'), fecha:p.fecha, monto:p.monto, descripcion:'TRANSFERENCIA '+(invoices.find(i=>i.id===p.invoiceId)?.folio||''), referencia:p.referencia, conciliado:true, paymentId:p.id });
    }
  });
  for(let i=0;i<25;i++){
    bankTx.push({ id:uid('TX'), fecha: addDays(today(),-rand(0,45)), monto: rand(50000,2500000), descripcion: pick(['ABONO PROVEEDOR','TRANSFERENCIA CLIENTE','PAGO ENVIO','DEPOSITO EFECTIVO','TRANSFERENCIA SPA']), referencia:'REF'+rand(10000,99999), conciliado:false, paymentId:null });
  }

  // Collection notes for overdue
  const collectionNotes=[];
  invoices.filter(i=>i.estadoPago==='Pendiente' && daysBetween(i.fechaVencimiento,today())>0).slice(0,15).forEach(inv=>{
    collectionNotes.push({ id:uid('GN'), invoiceId:inv.id, fecha:addDays(today(),-rand(1,10)), autor:pick(EJECUTIVOS), nota:pick(['Cliente confirma pago próxima semana.','Solicita reprogramación a 60 días.','Sin respuesta tras 3 contactos.','Enviado recordatorio por WhatsApp.']) });
  });

  // Client notes (CRM)
  const clientNotes=[];
  clients.forEach(c=>{
    if(Math.random()<0.5){
      clientNotes.push({ id:uid('N'), clienteId:c.id, fecha:addDays(today(),-rand(0,180)), autor:c.ejecutivo, tipo:pick(['Llamada','Visita','Email','WhatsApp']), nota:pick(['Cliente interesado en línea industrial.','Solicita catálogo actualizado.','Pidió cotización por proyecto Las Condes.','Necesita despacho urgente próxima semana.','Reunión programada con gerencia.']) });
    }
  });

  // Cuentas por pagar (facturas de proveedores)
  const supplierInvoices=[];
  purchaseOrders.forEach(oc=>{
    if(['Confirmada','En producción','En tránsito','Llegada','Recibida','Recepción parcial'].includes(oc.estado) && Math.random()<0.85){

/* ---------- Store (Context + Reducer + localStorage) ---------- */
const STORAGE_KEY = 'sina-os-v4';
const StoreCtx = createContext(null);
const useStore = () => useContext(StoreCtx);

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return seedAll();
}

function reducer(state, action){
  switch(action.type){
    case 'RESET': return seedAll();
    case 'UPSERT': {
      const { collection, item } = action;
      const list = [...(state[collection]||[])];
      const i = list.findIndex(x=>x.id===item.id);
      if(i>=0) list[i] = {...list[i], ...item}; else list.unshift(item);
      return {...state, [collection]: list};
    }
    case 'DELETE': {
      const { collection, id } = action;
      return {...state, [collection]: (state[collection]||[]).filter(x=>x.id!==id)};
    }
    case 'PATCH_MANY': {
      const { collection, updates } = action;
      const map = new Map(updates.map(u=>[u.id,u]));
      return {...state, [collection]: state[collection].map(x=> map.has(x.id)? {...x,...map.get(x.id)} : x)};
    }
    case 'BULK': return {...state, ...action.payload};
    default: return state;
  }
}

function StoreProvider({children}){
  const [state, dispatch] = useReducer(reducer, null, loadState);
  useEffect(()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }, [state]);
  const value = useMemo(()=>({state, dispatch}), [state]);
  return <StoreCtx.Provider value={value}>{children}</StoreCtx.Provider>;
}

/* ---------- Derivations / Intelligence ---------- */
function stockState(p){
  if(p.stock<=0) return {label:'Sin stock', color:'rose'};
  if(p.stock < p.stockMin*0.5) return {label:'Riesgo de quiebre', color:'rose'};
  if(p.stock < p.stockMin) return {label:'Bajo stock', color:'amber'};
  return {label:'Stock saludable', color:'mint'};
}

function salesByMonth(invoices, months=12){
  const buckets = {};
  const start = new Date(); start.setDate(1); start.setMonth(start.getMonth()-(months-1));
  for(let i=0;i<months;i++){const d=new Date(start);d.setMonth(start.getMonth()+i);buckets[d.toISOString().slice(0,7)] = {ventas:0, costo:0, margen:0};}
  invoices.forEach(inv=>{
    const k = inv.fechaEmision.slice(0,7);
    if(buckets[k]){
      const costo = inv.items.reduce((s,i)=>s+(i.costo*i.cantidad),0);
      buckets[k].ventas += inv.neto;
      buckets[k].costo += costo;
      buckets[k].margen += inv.neto - costo;
    }
  });
  return Object.entries(buckets).map(([k,v])=>({mes:k, ...v}));
}

function productSalesStats(product, invoices, days=180){
  const cutoff = addDays(today(), -days);
  let qty=0, revenue=0, costo=0, lastSale=null;
  invoices.forEach(inv=>{
    if(inv.fechaEmision < cutoff) return;
    inv.items.forEach(it=>{
      if(it.productoId===product.id){
        qty += it.cantidad;
        revenue += it.total;
        costo += it.costo*it.cantidad;
        if(!lastSale || inv.fechaEmision>lastSale) lastSale=inv.fechaEmision;
      }
    });
  });
  const avgDaily = qty/days;
  const avgMonthly = avgDaily*30;
  const daysOfStock = avgDaily>0 ? Math.floor(product.stock/avgDaily) : 999;
  const stockoutDate = avgDaily>0 ? addDays(today(), daysOfStock) : null;
  return { qty, revenue, costo, margen: revenue-costo, avgDaily, avgMonthly, daysOfStock, stockoutDate, lastSale };
}

function clientStats(client, invoices, payments){
  const own = invoices.filter(i=>i.clienteId===client.id);
  const totalCompras = own.reduce((s,i)=>s+i.neto,0);
  const totalCosto = own.reduce((s,i)=>s+i.items.reduce((a,b)=>a+b.cantidad*b.costo,0),0);
  const margen = totalCompras-totalCosto;
  const lastInv = own.map(i=>i.fechaEmision).sort().slice(-1)[0];
  const months = new Set(own.map(i=>i.fechaEmision.slice(0,7)));
  const freq = months.size;
  const ticket = own.length? totalCompras/own.length : 0;
  // last 90 vs previous 90
  const cut90 = addDays(today(),-90);
  const cut180 = addDays(today(),-180);
  const rev90 = own.filter(i=>i.fechaEmision>=cut90).reduce((s,i)=>s+i.neto,0);
  const revPrev = own.filter(i=>i.fechaEmision<cut90 && i.fechaEmision>=cut180).reduce((s,i)=>s+i.neto,0);
  const trend = revPrev>0 ? (rev90-revPrev)/revPrev : null;
  const distinctProds = new Set(own.flatMap(i=>i.items.map(x=>x.productoId))).size;
  return { totalCompras, margen, freq, ticket, lastInv, ordersCount:own.length, trend, distinctProds, rev90, revPrev };
}

function churnRisk(stats){
  if(!stats.lastInv) return { score:0, level:'Bajo', reasons:['Sin compras registradas'] };
  const dSinceLast = daysBetween(stats.lastInv, today());
  let score=0; const reasons=[];
  if(dSinceLast>120){score+=40; reasons.push(`Sin compras hace ${dSinceLast} días`);}
  else if(dSinceLast>90){score+=30; reasons.push(`Sin compras hace ${dSinceLast} días`);}
  else if(dSinceLast>60){score+=15; reasons.push(`Sin compras hace ${dSinceLast} días`);}
  if(stats.trend!=null){
    if(stats.trend<-0.5){score+=30; reasons.push(`Ventas cayeron ${Math.round(-stats.trend*100)}% últimos 90d`);}
    else if(stats.trend<-0.25){score+=15; reasons.push(`Ventas cayeron ${Math.round(-stats.trend*100)}%`);}
  }
  if(stats.freq<3 && stats.ordersCount>0){score+=10; reasons.push('Baja frecuencia de compra');}
  if(stats.distinctProds<3 && stats.ordersCount>2){score+=10; reasons.push('Compra pocas categorías');}
  const level = score>=50?'Alto': score>=25?'Medio':'Bajo';
  return { score:Math.min(100,score), level, reasons, dSinceLast };
}

/**
 * Lead time observado (aprendido): promedia diferencias entre fecha de emisión y fecha real de recepción
 * de las OC ya recibidas/llegadas. Se usa para preferir el dato empírico sobre el configurado.
 */
function supplierObservedLeadTime(supplierId, purchaseOrders, receptions){
  const ocs = purchaseOrders.filter(o=>o.proveedorId===supplierId && (o.etaReal || receptions.some(r=>r.ocId===o.id)));
  if(!ocs.length) return null;
  const samples = ocs.map(o=>{
    const rec = receptions.filter(r=>r.ocId===o.id).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(-1)[0];
    const recvDate = rec?.fecha || o.etaReal;
    return recvDate ? daysBetween(o.fecha, recvDate) : null;
  }).filter(v=>v!=null && v>0);
  if(!samples.length) return null;
  const avg = samples.reduce((a,b)=>a+b,0)/samples.length;
  return { promedio: Math.round(avg), muestras: samples.length, min: Math.min(...samples), max: Math.max(...samples) };
}

/**
 * Stock comprometido = unidades en OV con estado Pendiente/Confirmada/Entregada (todavía no facturadas).
 */
function stockComprometido(productId, sales){
  return sales
    .filter(o=>['Pendiente','Confirmada','Entregada'].includes(o.estado))
    .flatMap(o=>o.items.filter(i=>i.productoId===productId).map(i=>i.cantidad))
    .reduce((a,b)=>a+b,0);
}

/**
 * Factor de estacionalidad simple: cociente del consumo del último mes vs promedio de 6 meses.
 * 1.0 = sin variación; >1 = mes pico; <1 = mes bajo.
 */
function seasonalityFactor(productId, invoices){
  const buckets=[0,0,0,0,0,0];
  invoices.forEach(inv=>{
    const m = daysBetween(inv.fechaEmision, today());
    if(m<0 || m>180) return;
    const idx = Math.floor(m/30);
    if(idx>=6) return;
    inv.items.forEach(it=>{ if(it.productoId===productId) buckets[idx]+=it.cantidad; });
  });
  const ultimo = buckets[0];
  const prom = buckets.reduce((a,b)=>a+b,0)/6 || 0;
  if(!prom) return 1;
  const f = ultimo/prom;
  return Math.max(0.5, Math.min(1.8, f));
}

function purchaseRecommendation(product, invoices, suppliers, purchaseOrders, sales=[], receptions=[]){
  const sup = suppliers.find(s=>s.id===product.proveedorId);
  const leadConfig = sup?.leadTimeDias || 90;
  const obs = sup ? supplierObservedLeadTime(sup.id, purchaseOrders, receptions) : null;
  const leadReal = obs?.promedio || null;
  // Si el observado es mayor al configurado, se prefiere para no caer corto
  const lead = leadReal && leadReal > leadConfig ? leadReal : leadConfig;
  const stats = productSalesStats(product, invoices, 180);
  const seasonality = seasonalityFactor(product.id, invoices);
  const avgDailyAjustado = stats.avgDaily * seasonality;
  const safety = avgDailyAjustado * 30;
  const enTransito = purchaseOrders
    .filter(po=>['Confirmada','En producción','En tránsito','Enviada','Llegada','Recepción parcial'].includes(po.estado))
    .flatMap(po=>po.items.filter(i=>i.productoId===product.id).map(i=>i.cantidad))
    .reduce((a,b)=>a+b,0);
  const comprometido = stockComprometido(product.id, sales);
  const stockNeto = product.stock - comprometido;
  const consumoLead = avgDailyAjustado*lead;
  const recomendado = Math.max(0, Math.round(consumoLead + safety - stockNeto - enTransito));
  const stockoutDate = avgDailyAjustado>0? addDays(today(), Math.floor((stockNeto+enTransito)/avgDailyAjustado)) : null;
  const orderByDate = stockoutDate ? addDays(stockoutDate, -lead) : null;
  const urgencia = orderByDate ? daysBetween(today(), orderByDate) : 999;
  return { lead, leadConfig, leadReal, leadObs: obs, avgDaily:stats.avgDaily, avgDailyAjustado, seasonality, avgMonthly:stats.avgMonthly, enTransito, comprometido, stockNeto, recomendado, stockoutDate, orderByDate, urgencia, sup };
}

function Toast({toasts, remove}){

      <div key={t.id} className="px-4 py-3 rounded-md text-sm fade-in bg-white border border-sina-line text-sina-ink shadow-soft min-w-[260px] cursor-pointer flex items-center gap-3" onClick={()=>remove(t.id)}>
        <span className="dot" style={{background: t.kind==='error'?'#B91C1C':t.kind==='warn'?'#B45309':'#0E8A6B'}}/>
        <span>{t.msg}</span>
      </div>
    ))}
  </div>;

const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const push = (msg, kind='ok') => {
    const id=uid(); setToasts(s=>[...s,{id,msg,kind}]);
    setTimeout(()=>setToasts(s=>s.filter(t=>t.id!==id)), 3500);
  };
  return <ToastCtx.Provider value={push}>{children}<Toast toasts={toasts} remove={id=>setToasts(s=>s.filter(t=>t.id!==id))}/></ToastCtx.Provider>;
}
const useToast = () => useContext(ToastCtx);

/* ---------- Charts (Chart.js wrappers) ---------- */
function ChartBox({type, data, options, height=240}){
  const ref = useRef();
  const inst = useRef();
  useEffect(()=>{
    if(inst.current) inst.current.destroy();
    inst.current = new Chart(ref.current, { type, data, options:{responsive:true, maintainAspectRatio:false, ...options} });
    return ()=>{ if(inst.current) inst.current.destroy(); };
  }, [JSON.stringify(data), type]);
  return <div style={{height}}><canvas ref={ref}/></div>;
}

/* ---------- KPI ---------- */
function Kpi({label, value, sub, tone='neutral', delta}){
  // tone: neutral | warn | risk | good — controla únicamente un dot lateral, no el fondo
  const dotColor = {neutral:'#9CA3AF', warn:'#B45309', risk:'#B91C1C', good:'#0E8A6B', accent:'#7EB8F7'}[tone] || '#9CA3AF';
  return (
    <div className="rounded-lg p-5 bg-white border border-sina-line">
      <div className="flex items-center gap-2 text-[11px] uppercase tracking-wider font-medium text-sina-muted">
        <span className="dot" style={{background:dotColor}}/>
        {label}
      </div>
      <div className="text-[26px] leading-tight font-semibold text-sina-ink mt-2 num tracking-tight2">{value}</div>
      {sub && <div className="text-xs text-sina-muted mt-1.5">{sub}</div>}
      {delta!=null && <div className={`text-xs mt-1 num ${delta>=0?'text-sina-mint':'text-sina-rose'}`}>{delta>=0?'+':''}{delta}% vs período anterior</div>}
    </div>
  );
}

function Dashboard({go}){
  const { state } = useStore();
  const { products, clients, invoices, payments, purchaseOrders, suppliers, sales, receptions=[] } = state;

  const mesActual = today().slice(0,7);
  const ventasMes = invoices.filter(i=>i.fechaEmision.startsWith(mesActual)).reduce((s,i)=>s+i.neto,0);
  const ventasAnio = invoices.filter(i=>i.fechaEmision.startsWith(today().slice(0,4))).reduce((s,i)=>s+i.neto,0);
  const costoAnio = invoices.filter(i=>i.fechaEmision.startsWith(today().slice(0,4))).reduce((s,i)=>s+i.items.reduce((a,b)=>a+b.cantidad*b.costo,0),0);
  const margenAnio = ventasAnio - costoAnio;
  const margenPct = ventasAnio? margenAnio/ventasAnio : 0;
  const invValor = products.reduce((s,p)=>s+p.costo*p.stock,0);
  const bajoStock = products.filter(p=>p.stock>0 && p.stock<p.stockMin).length;
  const riesgoQuiebre = products.filter(p=>p.stock < p.stockMin*0.5).length;
  const facturasVencidas = invoices.filter(i=>i.estadoPago==='Pendiente' && daysBetween(i.fechaVencimiento, today())>0);
  const ctasCobrar = invoices.filter(i=>i.estadoPago==='Pendiente').reduce((s,i)=>s+i.total,0);
  const comprasTransito = purchaseOrders.filter(p=>['En tránsito','En producción','Confirmada','Enviada'].includes(p.estado));
  const ocAbiertas = purchaseOrders.filter(p=>!['Recibida'].includes(p.estado)).length;

  const series = salesByMonth(invoices, 12);
  const topClientes = clients.map(c=>({c, ...clientStats(c, invoices, payments)})).sort((a,b)=>b.totalCompras-a.totalCompras).slice(0,5);
  const topProductos = products.map(p=>({p, ...productSalesStats(p, invoices, 365)})).sort((a,b)=>b.revenue-a.revenue).slice(0,5);

  // Alertas
  const alerts = [];
  products.forEach(p=>{
    const rec = purchaseRecommendation(p, invoices, suppliers, purchaseOrders, sales, receptions);
    if(rec.recomendado>0 && rec.urgencia<14){
      alerts.push({ kind:'compra', sev: rec.urgencia<0?'alta':'media', text:`Comprar ${rec.recomendado} unidades de ${p.nombre} en los próximos ${Math.max(0,rec.urgencia)} días`, link:()=>go('compras','inteligencia') });
    }
  });
  clients.forEach(c=>{
    const st = clientStats(c, invoices, payments);
    const ch = churnRisk(st);
    if(ch.level==='Alto'){
      alerts.push({ kind:'fuga', sev:'alta', text:`${c.razonSocial} presenta alto riesgo de fuga (${ch.reasons[0]||'inactividad'})`, link:()=>go('clientes','churn') });
    }
  });
  facturasVencidas.forEach(inv=>{
    const dias = daysBetween(inv.fechaVencimiento, today());
    if(dias>=30){
      const cli = clients.find(c=>c.id===inv.clienteId);
      alerts.push({ kind:'cobranza', sev: dias>=60?'alta':'media', text:`Factura ${inv.folio} de ${cli?.razonSocial} lleva ${dias} días vencida`, link:()=>go('cobranza','cxc') });
    }
  });

  // Top alertas priorizadas (5 más críticas)
  const topAlerts = alerts.slice().sort((a,b)=>(a.sev==='alta'?-1:1)-(b.sev==='alta'?-1:1)).slice(0,5);

  // Top clientes en riesgo
  const clientesRiesgo = clients.map(c=>{const st=clientStats(c, invoices, payments); return {c, st, ch:churnRisk(st)};}).filter(x=>x.ch.level==='Alto').sort((a,b)=>b.ch.score-a.ch.score).slice(0,5);

  // Compras recomendadas más urgentes
  const comprasReco = products.map(p=>({p, rec:purchaseRecommendation(p, invoices, suppliers, purchaseOrders, sales, receptions)})).filter(x=>x.rec.recomendado>0).sort((a,b)=>a.rec.urgencia-b.rec.urgencia).slice(0,5);

  return (
    <div className="p-8 space-y-8 max-w-[1400px]">
      {/* SECTION · KPIs ejecutivos (4 números clave, sin colores estridentes) */}
      <section>
        <SectionLabel>Resumen</SectionLabel>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <Kpi label="Ventas del mes" value={CLP(ventasMes)} sub={`${invoices.filter(i=>i.fechaEmision.startsWith(mesActual)).length} facturas emitidas`}/>
          <Kpi label="Ventas acumuladas año" value={CLP(ventasAnio)} sub="Neto, sin IVA"/>
          <Kpi label="Margen bruto año" value={CLP(margenAnio)} sub={`${PCT(margenPct)} sobre ventas`}/>
          <Kpi label="Inventario valorizado" value={CLP(invValor)} sub={`${products.length} SKUs activos`}/>
        </div>
      </section>

      {/* SECTION · Ventas */}
      <section className="space-y-3">
        <SectionLabel>Ventas</SectionLabel>
        <Card title="Evolución mensual" subtitle="Últimos 12 meses · ventas netas y margen bruto" padding="p-6">
          <ChartBox type="bar" height={260}
            data={{
              labels: series.map(s=>fmtMonth(s.mes+'-01')),
              datasets:[
                { type:'bar', label:'Ventas (neto)', data: series.map(s=>s.ventas), backgroundColor:'#1C3566', borderRadius:3, barThickness:18 },
                { type:'line', label:'Margen', data: series.map(s=>s.margen), borderColor:'#7EB8F7', backgroundColor:'#7EB8F7', borderWidth:2, tension:.35, pointRadius:0 },

              scales:{
                x:{grid:{display:false}, ticks:{color:'#6B7280', font:{size:11}}},
                y:{grid:{color:'#F0F1F4'}, border:{display:false}, ticks:{color:'#6B7280', font:{size:11}, callback:v=>'$'+(v/1e6).toFixed(1)+'M'}}
              }
            }}/>
        </Card>

        <div className="space-y-3">
          <SectionLabel>Inventario</SectionLabel>
          <div className="grid grid-cols-3 gap-3">
            <Kpi label="Bajo stock"  value={bajoStock}     tone={bajoStock>0?'warn':'neutral'} sub={`de ${products.length}`}/>
            <Kpi label="Riesgo quiebre" value={riesgoQuiebre} tone={riesgoQuiebre>0?'risk':'neutral'} sub="bajo 50% mínimo"/>
            <Kpi label="OC en tránsito" value={comprasTransito.length} sub={`${ocAbiertas} OC abiertas`}/>

function ProductosView({go}){
  const { state, dispatch } = useStore();
  const { products, suppliers, invoices, movements } = state;
  const [q,setQ]=useState(''); const [cat,setCat]=useState(''); const [stockFil,setStockFil]=useState('');
  const [editing,setEditing]=useState(null);
  const [detail,setDetail]=useState(null);
  const toast = useToast();

  const filtered = products.filter(p=>{
    if(q && !(`${p.nombre} ${p.sku} ${p.color} ${p.formato}`.toLowerCase().includes(q.toLowerCase()))) return false;
    if(cat && p.categoria!==cat) return false;
    if(stockFil){
      const s = stockState(p).label;
      if(stockFil!==s) return false;
    }
    return true;

  const totalValor = products.reduce((s,p)=>s+p.costo*p.stock,0);

    </div>

    <Card title="Catálogo de productos" action={
      <div className="flex gap-2 flex-wrap">
        <CsvActions stateKey="products" label="Productos" onImport={(items)=>{
          items.forEach(it=>{ if(!it.id) it.id=uid('P'); if(!it.proveedorId) it.proveedorId=suppliers[0]?.id; dispatch({type:'UPSERT', collection:'products', item:it}); });
        }}/>
        <Btn onClick={()=>setEditing({id:uid('P'), sku:'SN-'+String(products.length+1).padStart(4,'0'), nombre:'', categoria:CATEGORIAS[0], color:'', formato:'1 L', acabado:'Mate', descripcion:'', proveedorId:suppliers[0]?.id||'', costo:1000, precio:2000, stock:0, stockMin:10, stockReco:30})}>Nuevo producto</Btn>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
        <Input placeholder="Buscar SKU, nombre, color..." value={q} onChange={e=>setQ(e.target.value)}/>
        <Select value={cat} onChange={e=>setCat(e.target.value)}>
          <option value="">Todas las categorías</option>
          {CATEGORIAS.map(c=><option key={c}>{c}</option>)}

        <Select value={stockFil} onChange={e=>setStockFil(e.target.value)}>

          <option>Stock saludable</option><option>Bajo stock</option><option>Riesgo de quiebre</option><option>Sin stock</option>

        <div className="text-right text-xs text-sina-muted self-center">{filtered.length} producto(s)</div>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="text-left text-xs text-sina-muted border-b border-sina-line">
            <tr><th className="py-2">SKU</th><th>Producto</th><th>Categoría</th><th className="text-right">Costo</th><th className="text-right">Precio</th><th className="text-right">Margen</th><th className="text-right">Stock</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody>
            {filtered.slice(0,300).map(p=>{
              const st = stockState(p);
              return <tr key={p.id} className="border-b border-sina-lineSoft row-hover">
                <td className="py-2 font-mono text-xs text-sina-muted">{p.sku}</td>
                <td><div className="font-medium">{p.nombre}</div><div className="text-xs text-sina-muted">{p.color} · {p.formato}</div></td>
                <td className="text-sina-body">{p.categoria}</td>
                <td className="text-right num">{CLP(p.costo)}</td>
                <td className="text-right num">{CLP(p.precio)}</td>
                <td className="text-right num text-sina-mint">{PCT(p.margen)}</td>
                <td className="text-right num font-semibold">{p.stock}</td>
                <td><Badge tone={st.color}>{st.label}</Badge></td>
                <td className="text-right">
                  <button className="text-sina-navy text-xs font-semibold mr-2" onClick={()=>setDetail(p)}>Ver</button>
                  <button className="text-sina-muted text-xs font-semibold" onClick={()=>setEditing({...p})}>Editar</button>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </Card>

    <Modal open={!!editing} onClose={()=>setEditing(null)} title={editing?.nombre? 'Editar producto' : 'Nuevo producto'}>
      {editing && <ProductoForm initial={editing} suppliers={suppliers} onSave={(p)=>{
        dispatch({type:'UPSERT', collection:'products', item:{...p, margen:(p.precio-p.costo)/p.precio}});
        toast('Producto guardado');
        setEditing(null);
      }} onCancel={()=>setEditing(null)} onDelete={editing.nombre? ()=>{ dispatch({type:'DELETE', collection:'products', id:editing.id}); toast('Producto eliminado','warn'); setEditing(null); } : null}/>}
    </Modal>

    <Modal open={!!detail} onClose={()=>setDetail(null)} title={detail?.nombre||''} size="xl">

}

/* ---------- Movimientos de inventario ---------- */
function MovimientosView(){
  const { state, dispatch } = useStore();
  const { movements, products } = state;
  const [form,setForm]=useState(null);
  const toast = useToast();
  const sorted = [...movements].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,300);
  return <div className="p-8 space-y-6">
    <Card title="Movimientos de inventario" action={
      <div className="flex gap-2 flex-wrap">
        <CsvActions stateKey="movements" label="Movimientos" onImport={(items)=>{
          items.forEach(it=>{
            const p = products.find(x=>x.sku===it.sku); if(!p) return;
            const delta = it.tipo==='Entrada'? it.cantidad : it.tipo==='Salida'? -it.cantidad : (it.cantidad - p.stock);
            const realCant = it.tipo==='Ajuste'? Math.abs(delta) : it.cantidad;
            dispatch({type:'UPSERT', collection:'movements', item:{id:uid('M'), productoId:p.id, tipo:it.tipo, cantidad:realCant, motivo:it.motivo||it.tipo, fecha:it.fecha||today(), costoUnit:p.costo, usuario:'CSV'}});
            dispatch({type:'UPSERT', collection:'products', item:{...p, stock:Math.max(0, p.stock+delta)}});
          });
        }}/>
        <Btn variant="ghost" size="sm" onClick={()=>setForm({tipo:'Ajuste', productoId:products[0]?.id, cantidad:0, motivo:'Ajuste manual', fecha:today()})}>Ajuste</Btn>
        <Btn variant="ghost" size="sm" onClick={()=>setForm({tipo:'Salida', productoId:products[0]?.id, cantidad:0, motivo:'', fecha:today()})}>Salida</Btn>
        <Btn onClick={()=>setForm({tipo:'Entrada', productoId:products[0]?.id, cantidad:0, motivo:'', fecha:today()})}>Entrada</Btn>
      </div>
    }>
      <table className="w-full text-sm">
        <thead className="text-left text-xs text-sina-muted border-b border-sina-line"><tr><th className="py-2">Fecha</th><th>Producto</th><th>Tipo</th><th className="text-right">Cantidad</th><th>Motivo</th><th>Usuario</th></tr></thead>
        <tbody>
          {sorted.map(m=>{const p=products.find(x=>x.id===m.productoId); return <tr key={m.id} className="border-b border-sina-lineSoft row-hover">
            <td className="py-2">{fmtDate(m.fecha)}</td>
            <td><div className="font-medium">{p?.nombre||'(eliminado)'}</div><div className="text-xs text-sina-muted">{p?.sku}</div></td>
            <td><Badge tone={m.tipo==='Entrada'?'mint':m.tipo==='Salida'?'rose':'amber'}>{m.tipo}</Badge></td>
            <td className="text-right num font-semibold">{m.tipo==='Entrada'?'+':m.tipo==='Salida'?'-':'='}{m.cantidad}</td>
            <td className="text-sina-body">{m.motivo}</td>
            <td className="text-sina-muted">{m.usuario}</td>
          </tr>;})}
        </tbody>
      </table>
    </Card>
    <Modal open={!!form} onClose={()=>setForm(null)} title="Nuevo movimiento de inventario">
      {form && <div className="space-y-3">
        <Select label="Tipo" value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})}><option>Entrada</option><option>Salida</option><option>Ajuste</option></Select>
        <Select label="Producto" value={form.productoId} onChange={e=>setForm({...form,productoId:e.target.value})}>{products.map(p=><option key={p.id} value={p.id}>{p.sku} · {p.nombre} (stock {p.stock})</option>)}</Select>
        <div className="grid grid-cols-2 gap-3">
          <Input label="Cantidad" type="number" value={form.cantidad} onChange={e=>setForm({...form,cantidad:+e.target.value})}/>
          <Input label="Fecha" type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/>
        </div>
        <Input label="Motivo" value={form.motivo} onChange={e=>setForm({...form,motivo:e.target.value})}/>
        <div className="flex justify-end gap-2 pt-2">
          <Btn variant="ghost" onClick={()=>setForm(null)}>Cancelar</Btn>
          <Btn onClick={()=>{
            const p = products.find(x=>x.id===form.productoId);
            if(!p) return;
            const delta = form.tipo==='Entrada'? form.cantidad : form.tipo==='Salida'? -form.cantidad : (form.cantidad - p.stock);
            const realCant = form.tipo==='Ajuste'? Math.abs(delta) : form.cantidad;
            dispatch({type:'UPSERT', collection:'movements', item:{id:uid('M'), productoId:form.productoId, tipo:form.tipo, cantidad:realCant, motivo:form.motivo||form.tipo, fecha:form.fecha, costoUnit:p.costo, usuario:'Arturo'}});
            dispatch({type:'UPSERT', collection:'products', item:{...p, stock: Math.max(0, p.stock + delta)}});
            toast('Movimiento registrado');
            setForm(null);
          }}>Registrar</Btn>
        </div>
      </div>}
    </Modal>
  </div>;
}

function ClientesView({go}){
  const { state, dispatch } = useStore();
  const { clients, invoices, payments, clientNotes } = state;
  const [q,setQ]=useState(''); const [seg,setSeg]=useState(''); const [estadoFil,setEstadoFil]=useState('');
  const [editing,setEditing]=useState(null);
  const [detail,setDetail]=useState(null);
  const toast = useToast();

  const enriched = clients.map(c=>{
    const stats = clientStats(c, invoices, payments);
    const churn = churnRisk(stats);
    let estado = 'Activo';
    if(!stats.lastInv || daysBetween(stats.lastInv, today())>180) estado='Perdido';
    else if(churn.level==='Alto') estado='Riesgo de fuga';
    else if(daysBetween(stats.lastInv, today())>90) estado='Inactivo';
    return {c, stats, churn, estado};
  });

  const filtered = enriched.filter(({c,estado})=>{
    if(q && !(`${c.razonSocial} ${c.contacto} ${c.rut} ${c.comuna}`.toLowerCase().includes(q.toLowerCase()))) return false;
    if(seg && c.segmento!==seg) return false;
    if(estadoFil && estado!==estadoFil) return false;
    return true;
  });

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
      <Kpi label="Clientes totales" value={clients.length} tone="neutral"/>
      <Kpi label="Activos" value={enriched.filter(e=>e.estado==='Activo').length} tone="good"/>
      <Kpi label="Riesgo de fuga" value={enriched.filter(e=>e.estado==='Riesgo de fuga').length} tone="warn"/>
      <Kpi label="Perdidos" value={enriched.filter(e=>e.estado==='Perdido').length} tone="risk"/>
    </div>
    <Card title="Cartera de clientes" action={
      <div className="flex gap-2 flex-wrap">
        <CsvActions stateKey="clients" label="Clientes" onImport={(items)=>{
          items.forEach(it=>{ if(!it.id) it.id=uid('C'); dispatch({type:'UPSERT', collection:'clients', item:it}); });
        }}/>
        <Btn onClick={()=>setEditing({id:uid('C'), razonSocial:'', contacto:'', rut:'', email:'', telefono:'', direccion:'', comuna:COMUNAS[0], ciudad:'Santiago', segmento:SEGMENTOS[0], ejecutivo:EJECUTIVOS[0], creado:today()})}>Nuevo cliente</Btn>
      </div>
    }>
      <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
        <Input placeholder="Buscar razón social, RUT, contacto..." value={q} onChange={e=>setQ(e.target.value)}/>
        <Select value={seg} onChange={e=>setSeg(e.target.value)}><option value="">Todos los segmentos</option>{SEGMENTOS.map(s=><option key={s}>{s}</option>)}</Select>
        <Select value={estadoFil} onChange={e=>setEstadoFil(e.target.value)}><option value="">Todos los estados</option><option>Activo</option><option>Inactivo</option><option>Riesgo de fuga</option><option>Perdido</option></Select>
        <div className="text-right text-xs text-sina-muted self-center">{filtered.length} cliente(s)</div>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="text-left text-xs text-sina-muted border-b border-sina-line">
            <tr><th className="py-2">Razón social</th><th>RUT</th><th>Segmento</th><th>Ejecutivo</th><th className="text-right">Compras</th><th className="text-right">Margen</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody>
            {filtered.slice(0,200).map(({c,stats,estado,churn})=>(
              <tr key={c.id} className="border-b border-sina-lineSoft row-hover">
                <td className="py-2"><div className="font-medium">{c.razonSocial}</div><div className="text-xs text-sina-muted">{c.contacto} · {c.comuna}</div></td>
                <td className="text-xs text-sina-body font-mono">{c.rut}</td>
                <td className="text-sina-body">{c.segmento}</td>
                <td className="text-sina-body">{c.ejecutivo}</td>
                <td className="text-right num">{CLP(stats.totalCompras)}</td>
                <td className="text-right num text-sina-mint">{CLP(stats.margen)}</td>
                <td><Badge tone={estado==='Activo'?'mint':estado==='Inactivo'?'amber':estado==='Riesgo de fuga'?'amber':'rose'}>{estado}</Badge></td>
                <td className="text-right">
                  <button className="text-sina-navy text-xs font-semibold mr-2" onClick={()=>setDetail({c,stats,churn})}>Ver 360°</button>
                  <button className="text-sina-muted text-xs font-semibold" onClick={()=>setEditing({...c})}>Editar</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>

          <Input label="Nombre contacto" value={editing.contacto} onChange={e=>setEditing({...editing, contacto:e.target.value})}/>
          <Input label="Email" value={editing.email} onChange={e=>setEditing({...editing, email:e.target.value})}/>
          <Input label="Teléfono" value={editing.telefono} onChange={e=>setEditing({...editing, telefono:e.target.value})}/>
          <Input label="Dirección" value={editing.direccion} onChange={e=>setEditing({...editing, direccion:e.target.value})}/>
          <Select label="Comuna" value={editing.comuna} onChange={e=>setEditing({...editing, comuna:e.target.value})}>{COMUNAS.map(c=><option key={c}>{c}</option>)}</Select>
          <Input label="Ciudad" value={editing.ciudad} onChange={e=>setEditing({...editing, ciudad:e.target.value})}/>
          <Select label="Segmento" value={editing.segmento} onChange={e=>setEditing({...editing, segmento:e.target.value})}>{SEGMENTOS.map(s=><option key={s}>{s}</option>)}</Select>
          <Select label="Ejecutivo comercial" value={editing.ejecutivo} onChange={e=>setEditing({...editing, ejecutivo:e.target.value})}>{EJECUTIVOS.map(s=><option key={s}>{s}</option>)}</Select>
        </div>
        <div className="flex justify-end gap-2 pt-2">
          <Btn variant="ghost" onClick={()=>setEditing(null)}>Cancelar</Btn>

}

function ClienteDetalle({data, go}){
  const { state, dispatch } = useStore();
  const { invoices, clientNotes, products } = state;
  const { c, stats, churn } = data;
  const own = invoices.filter(i=>i.clienteId===c.id).sort((a,b)=>b.fechaEmision.localeCompare(a.fechaEmision));
  const notes = clientNotes.filter(n=>n.clienteId===c.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const [nuevaNota,setNuevaNota]=useState({tipo:'Llamada', nota:''});
  const toast = useToast();
  // Series mensual del cliente
  const buckets={};
  range(12).forEach(i=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(11-i));buckets[d.toISOString().slice(0,7)]=0;});
  own.forEach(i=>{const k=i.fechaEmision.slice(0,7); if(buckets[k]!=null) buckets[k]+=i.neto;});

  // Productos preferidos
  const byProd={};
  own.forEach(i=>i.items.forEach(it=>{byProd[it.productoId]=(byProd[it.productoId]||0)+it.cantidad;}));
  const topProds = Object.entries(byProd).map(([id,q])=>{const p=products.find(x=>x.id===id); return {p,q};}).filter(x=>x.p).sort((a,b)=>b.q-a.q).slice(0,5);

  return <div className="space-y-5">
    <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
      <Kpi label="Compras totales" value={CLP(stats.totalCompras)} tone="accent"/>
      <Kpi label="Margen aportado" value={CLP(stats.margen)} tone="good"/>
      <Kpi label="Ticket promedio" value={CLP(stats.ticket)} tone="neutral"/>
      <Kpi label="Última compra" value={fmtDate(stats.lastInv)} sub={stats.lastInv? daysBetween(stats.lastInv,today())+' días': '—'} tone="neutral"/>
      <Kpi label="Riesgo de fuga" value={churn.level} sub={churn.score+' / 100'} tone={churn.level==='Alto'?'risk':churn.level==='Medio'?'warn':'good'}/>
    </div>
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <Card title="Datos de contacto" className="lg:col-span-1">
        <dl className="text-sm space-y-2">
          <div><dt className="text-xs text-sina-muted">RUT</dt><dd className="font-mono">{c.rut}</dd></div>
          <div><dt className="text-xs text-sina-muted">Contacto</dt><dd>{c.contacto}</dd></div>
          <div><dt className="text-xs text-sina-muted">Email</dt><dd>{c.email}</dd></div>
          <div><dt className="text-xs text-sina-muted">Teléfono</dt><dd>{c.telefono}</dd></div>
          <div><dt className="text-xs text-sina-muted">Dirección</dt><dd>{c.direccion}, {c.comuna}, {c.ciudad}</dd></div>
          <div><dt className="text-xs text-sina-muted">Segmento</dt><dd>{c.segmento}</dd></div>
          <div><dt className="text-xs text-sina-muted">Ejecutivo</dt><dd>{c.ejecutivo}</dd></div>
        </dl>
      </Card>
      <Card title="Evolución de compras (12 meses)" className="lg:col-span-2">
        <ChartBox type="bar" data={{labels:Object.keys(buckets).map(k=>fmtMonth(k+'-01')), datasets:[{label:'Compras', data:Object.values(buckets), backgroundColor:'#1C3566', borderRadius:6}]}} options={{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'$'+(v/1e3).toFixed(0)+'k'}}}}}/>
      </Card>
    </div>
    {churn.level!=='Bajo' && <Card title="Recomendaciones de retención">
      <ul className="text-sm space-y-2">
        {churn.reasons.map((r,i)=><li key={i} className="flex gap-2"><span className="text-sina-rose">•</span>{r}</li>)}
        <li className="pt-2 border-t border-sina-line text-sina-mint font-medium">Acción sugerida: contactar al cliente, programar visita, ofrecer descuento de fidelidad o presentar nueva línea de productos.</li>
      </ul>
    </Card>}
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <Card title="Productos más comprados">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Producto</th><th className="text-right">Unidades</th></tr></thead>
          <tbody>{topProds.map(({p,q})=><tr key={p.id} className="border-b border-sina-lineSoft"><td className="py-2"><div className="font-medium">{p.nombre}</div><div className="text-xs text-sina-muted">{p.sku}</div></td><td className="text-right num">{q}</td></tr>)}</tbody>
        </table>
      </Card>
      <Card title="Historial de facturas">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Folio</th><th>Fecha</th><th className="text-right">Total</th><th>Estado</th></tr></thead>
          <tbody>{own.slice(0,10).map(i=><tr key={i.id} className="border-b border-sina-lineSoft"><td className="py-2 font-mono text-xs">{i.folio}</td><td>{fmtDate(i.fechaEmision)}</td><td className="text-right num">{CLP(i.total)}</td><td><Badge tone={i.estadoPago==='Pagada'?'mint':'amber'}>{i.estadoPago}</Badge></td></tr>)}</tbody>
        </table>
      </Card>
    </div>
    <Card title="Notas y seguimiento" action={<span className="text-xs text-sina-muted">{notes.length} nota(s)</span>}>
      <div className="flex gap-2 mb-3">
        <Select value={nuevaNota.tipo} onChange={e=>setNuevaNota({...nuevaNota,tipo:e.target.value})} className="!w-40"><option>Llamada</option><option>Visita</option><option>Email</option><option>WhatsApp</option></Select>
        <Input placeholder="Escribir nota..." value={nuevaNota.nota} onChange={e=>setNuevaNota({...nuevaNota,nota:e.target.value})}/>
        <Btn onClick={()=>{if(!nuevaNota.nota) return; dispatch({type:'UPSERT', collection:'clientNotes', item:{id:uid('N'), clienteId:c.id, fecha:today(), autor:c.ejecutivo, tipo:nuevaNota.tipo, nota:nuevaNota.nota}}); setNuevaNota({tipo:'Llamada',nota:''}); toast('Nota agregada');}}>Agregar</Btn>
      </div>
      <div className="space-y-2 max-h-64 overflow-y-auto scrollbar">
        {notes.map(n=><div key={n.id} className="p-3 rounded-lg border border-sina-line flex gap-3">
          <Badge tone="sky">{n.tipo}</Badge>
          <div className="flex-1"><div className="text-sm">{n.nota}</div><div className="text-xs text-sina-muted mt-1">{n.autor} · {fmtDate(n.fecha)}</div></div>
        </div>)}
        {notes.length===0 && <div className="text-sm text-sina-muted">Sin notas registradas.</div>}
      </div>
    </Card>
  </div>;
}

function ComportamientoView({go}){
  const { state } = useStore();
  const { clients, invoices, payments, products } = state;
  const enriched = clients.map(c=>{
    const stats = clientStats(c, invoices, payments);
    return {c, stats};
  });
  // Insights
  const insights=[];
  enriched.forEach(({c,stats})=>{
    if(stats.trend!=null && stats.trend < -0.4 && stats.rev90>0){
      insights.push({sev:'alta', text:`${c.razonSocial} redujo sus compras en ${Math.round(-stats.trend*100)}% en los últimos 90 días.`, id:c.id});
    }
    if(stats.lastInv && daysBetween(stats.lastInv,today())>90){
      insights.push({sev:'media', text:`${c.razonSocial} no compra hace ${daysBetween(stats.lastInv,today())} días.`, id:c.id});
    }
  });
  // Crecimiento de clientes
  const crecimiento = enriched.filter(({stats})=>stats.trend!=null && stats.trend>0.3).sort((a,b)=>b.stats.trend-a.stats.trend).slice(0,8);
  const declinando = enriched.filter(({stats})=>stats.trend!=null && stats.trend<-0.2).sort((a,b)=>a.stats.trend-b.stats.trend).slice(0,8);
  // Distribución por segmento
  const segData={};
  enriched.forEach(({c,stats})=>{segData[c.segmento]=(segData[c.segmento]||0)+stats.totalCompras;});

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
      <Kpi label="Clientes con crecimiento" value={crecimiento.length} tone="good"/>
      <Kpi label="Clientes en declive" value={declinando.length} tone="warn"/>
      <Kpi label="Ticket promedio global" value={CLP(enriched.reduce((s,e)=>s+e.stats.ticket,0)/Math.max(1,enriched.filter(e=>e.stats.ticket>0).length))} tone="neutral"/>
      <Kpi label="Insights activos" value={insights.length} tone="accent"/>
    </div>
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <Card title="Distribución de compras por segmento" className="lg:col-span-2">
        <ChartBox type="doughnut" data={{labels:Object.keys(segData), datasets:[{data:Object.values(segData), backgroundColor:['#1C3566','#1C3566','#2A4E8C','#0E8A6B','#B45309','#e11d48','#2A4E8C']}]}} options={{plugins:{legend:{position:'right'}}}}/>
      </Card>
      <Card title="Insights accionables">
        <div className="space-y-2 max-h-72 overflow-y-auto scrollbar">
          {insights.slice(0,20).map((i,k)=><div key={k} className="p-3 rounded-lg border border-sina-line"><div className="text-sm">{i.text}</div></div>)}
          {insights.length===0 && <div className="text-sm text-sina-muted">Sin insights destacados.</div>}
        </div>
      </Card>
    </div>
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <Card title="Top 8 clientes en crecimiento">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Cliente</th><th className="text-right">Δ 90d</th><th className="text-right">Compras</th></tr></thead>
          <tbody>{crecimiento.map(({c,stats})=><tr key={c.id} className="border-b border-sina-lineSoft"><td className="py-2 font-medium">{c.razonSocial}</td><td className="text-right text-sina-mint num">+{Math.round(stats.trend*100)}%</td><td className="text-right num">{CLP(stats.totalCompras)}</td></tr>)}</tbody>
        </table>
      </Card>
      <Card title="Top 8 clientes en declive">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Cliente</th><th className="text-right">Δ 90d</th><th className="text-right">Compras</th></tr></thead>
          <tbody>{declinando.map(({c,stats})=><tr key={c.id} className="border-b border-sina-lineSoft"><td className="py-2 font-medium">{c.razonSocial}</td><td className="text-right text-sina-rose num">{Math.round(stats.trend*100)}%</td><td className="text-right num">{CLP(stats.totalCompras)}</td></tr>)}</tbody>
        </table>
      </Card>
    </div>
  </div>;
}

/* =====================================================================================
   MÓDULO 5 · RIESGO DE FUGA (CHURN)
   ===================================================================================== */
function ChurnView({go}){
  const { state } = useStore();
  const { clients, invoices, payments } = state;
  const list = clients.map(c=>{
    const stats = clientStats(c, invoices, payments);
    const ch = churnRisk(stats);
    return {c, stats, ch};
  }).filter(x=>x.stats.ordersCount>0).sort((a,b)=>b.ch.score-a.ch.score);
  const alto = list.filter(x=>x.ch.level==='Alto');
  const medio = list.filter(x=>x.ch.level==='Medio');
  const bajo = list.filter(x=>x.ch.level==='Bajo');

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
      <Kpi label="Riesgo Alto" value={alto.length} sub={CLP(alto.reduce((s,x)=>s+x.stats.totalCompras,0))+' en cartera'} tone="risk"/>
      <Kpi label="Riesgo Medio" value={medio.length} tone="warn"/>
      <Kpi label="Riesgo Bajo" value={bajo.length} tone="good"/>
    </div>
    <Card title="Clientes en riesgo de fuga" action={<span className="text-xs text-sina-muted">Algoritmo basado en recencia, frecuencia, monto, tendencia y diversidad de productos</span>}>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="text-left text-xs text-sina-muted border-b border-sina-line"><tr><th className="py-2">Cliente</th><th>Ejecutivo</th><th className="text-right">Score</th><th>Nivel</th><th>Razones</th><th>Acción sugerida</th></tr></thead>
          <tbody>
            {list.filter(x=>x.ch.level!=='Bajo').map(({c,stats,ch})=><tr key={c.id} className="border-b border-sina-lineSoft row-hover">
              <td className="py-2"><div className="font-medium">{c.razonSocial}</div><div className="text-xs text-sina-muted">Compras: {CLP(stats.totalCompras)}</div></td>
              <td className="text-sina-body">{c.ejecutivo}</td>
              <td className="text-right num font-bold">{ch.score}</td>
              <td><Badge tone={ch.level==='Alto'?'rose':'amber'}>{ch.level}</Badge></td>
              <td className="text-xs text-sina-body">{ch.reasons.slice(0,2).join(' · ')}</td>
              <td className="text-xs">
                <div className="space-x-1">
                  <Badge tone="sky">Contactar</Badge>
                  {ch.level==='Alto' && <Badge tone="navy">Visita</Badge>}
                  {ch.level==='Alto' && <Badge tone="mint">Descuento</Badge>}
                </div>
              </td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </Card>
  </div>;
}

/* =====================================================================================
   Editor común para Cotizaciones / Órdenes / (base de Factura)
   ===================================================================================== */
function DocItemsEditor({items, setItems, products, descuentoGlobal, setDescuentoGlobal}){
  const add = () => setItems([...items, {productoId:products[0].id, sku:products[0].sku, nombre:products[0].nombre, cantidad:1, precio:products[0].precio, descuento:0, descuentoTipo:'%', descuentoValor:0, total:products[0].precio, costo:products[0].costo}]);
  const recalcTotal = (n) => {
    const sub = n.cantidad*n.precio;
    if(n.descuentoTipo==='$') return { ...n, total: Math.max(0, Math.round(sub - (+n.descuentoValor||0))), descuento:0 };
    const pct = (+n.descuentoValor||0)/100;
    return { ...n, total: Math.max(0, Math.round(sub*(1-pct))), descuento:pct };
  };
  const upd = (i, patch) => setItems(items.map((it,j)=>{
    if(j!==i) return it;
    let n = {...it, ...patch};
    if(patch.productoId){const p=products.find(x=>x.id===patch.productoId); if(p){n.sku=p.sku; n.nombre=p.nombre; n.precio=p.precio; n.costo=p.costo;}}
    return recalcTotal(n);
  }));
  const del = (i) => setItems(items.filter((_,j)=>j!==i));

  const bruto = items.reduce((s,i)=>s+i.precio*i.cantidad,0);
  const conLinea = items.reduce((s,i)=>s+i.total,0);
  let neto = conLinea;
  if(descuentoGlobal && descuentoGlobal.valor){
    if(descuentoGlobal.tipo==='$') neto = Math.max(0, conLinea - (+descuentoGlobal.valor));
    else neto = Math.max(0, conLinea*(1-(+descuentoGlobal.valor)/100));
  }
  neto = Math.round(neto);
  const iva = Math.round(neto*0.19);
  const total = neto+iva;
  const costo = items.reduce((s,i)=>s+i.cantidad*i.costo,0);
  const margen = neto-costo;

  return <div className="space-y-3">
    <div className="border border-sina-line rounded-lg overflow-hidden">
      <table className="w-full text-sm">
        <thead className="text-left text-[11px] uppercase tracking-wider text-sina-muted bg-sina-bg"><tr><th className="py-2 px-3 font-medium">Producto</th><th className="text-right font-medium">Cant.</th><th className="text-right font-medium">Precio</th><th className="text-right font-medium">Descuento</th><th className="text-right font-medium">Total</th><th></th></tr></thead>
        <tbody>
          {items.map((it,i)=>{
            const tipo = it.descuentoTipo || (it.descuento? '%':'%');
            const val = it.descuentoValor != null ? it.descuentoValor : (it.descuento? Math.round(it.descuento*100):0);
            return <tr key={i} className="border-t border-sina-line">
              <td className="px-3 py-2"><select className="w-full text-sm bg-transparent" value={it.productoId} onChange={e=>upd(i,{productoId:e.target.value})}>{products.map(p=><option key={p.id} value={p.id}>{p.sku} · {p.nombre}</option>)}</select></td>
              <td className="text-right"><input type="number" className="w-16 text-right bg-transparent" value={it.cantidad} onChange={e=>upd(i,{cantidad:+e.target.value})}/></td>
              <td className="text-right num"><input type="number" className="w-24 text-right bg-transparent" value={it.precio} onChange={e=>upd(i,{precio:+e.target.value})}/></td>
              <td className="text-right">
                <div className="inline-flex items-center gap-1">
                  <input type="number" className="w-16 text-right bg-transparent" value={val} onChange={e=>upd(i,{descuentoValor:+e.target.value, descuentoTipo:tipo})}/>
                  <select value={tipo} onChange={e=>upd(i,{descuentoTipo:e.target.value, descuentoValor:val})} className="text-xs bg-transparent">
                    <option value="%">%</option><option value="$">$</option>
                  </select>
                </div>
              </td>
              <td className="text-right num font-medium">{CLP(it.total)}</td>
              <td className="text-right pr-2"><button onClick={()=>del(i)} className="text-sina-rose">×</button></td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
    <div className="flex justify-between items-center">
      <Btn variant="ghost" size="sm" onClick={add}>Agregar producto</Btn>
      {setDescuentoGlobal && (
        <div className="flex items-center gap-2 text-xs">
          <span className="text-sina-muted">Descuento global:</span>
          <input type="number" className="w-20 text-right px-2 py-1 rounded border border-sina-line" value={descuentoGlobal?.valor||0} onChange={e=>setDescuentoGlobal({tipo:descuentoGlobal?.tipo||'%', valor:+e.target.value})}/>
          <select value={descuentoGlobal?.tipo||'%'} onChange={e=>setDescuentoGlobal({tipo:e.target.value, valor:descuentoGlobal?.valor||0})} className="text-xs border border-sina-line rounded px-1 py-1">
            <option value="%">%</option><option value="$">$</option>
          </select>
        </div>
      )}
    </div>
    <div className="flex justify-end">
      <div className="text-sm space-y-1 text-right min-w-[240px]">
        <div className="flex justify-between gap-6"><span className="text-sina-muted">Subtotal</span><span className="num">{CLP(bruto)}</span></div>
        {bruto!==conLinea && <div className="flex justify-between gap-6"><span className="text-sina-muted">Descuentos por línea</span><span className="num text-sina-rose">-{CLP(bruto-conLinea)}</span></div>}
        {descuentoGlobal && descuentoGlobal.valor>0 && <div className="flex justify-between gap-6"><span className="text-sina-muted">Descuento global {descuentoGlobal.tipo==='$'? CLP(descuentoGlobal.valor):descuentoGlobal.valor+'%'}</span><span className="num text-sina-rose">-{CLP(conLinea-neto)}</span></div>}
        <div className="flex justify-between gap-6"><span className="text-sina-muted">Neto</span><span className="font-medium num">{CLP(neto)}</span></div>
        <div className="flex justify-between gap-6"><span className="text-sina-muted">IVA 19%</span><span className="font-medium num">{CLP(iva)}</span></div>
        <div className="flex justify-between gap-6 border-t border-sina-line pt-1 text-base"><span className="font-semibold">Total</span><span className="font-semibold num">{CLP(total)}</span></div>
        <div className="text-xs text-sina-mint pt-1">Margen estimado: <span className="num">{CLP(margen)}</span> ({PCT(neto>0?margen/neto:0)})</div>
      </div>
    </div>
  </div>;
}

/* =====================================================================================
   MÓDULO 6 · COTIZACIONES Y ÓRDENES DE VENTA
   ===================================================================================== */
function CotizacionesView({go}){
  const { state, dispatch } = useStore();
  const { quotes, clients, products, sales } = state;
  const [edit,setEdit]=useState(null);
  const [pdfPreview,setPdfPreview]=useState(null);
  const [emailDlg,setEmailDlg]=useState(null);
  const toast = useToast();

  // Marcar como Expirada las cotizaciones vencidas todavía en Borrador/Enviada
  const enriched = quotes.map(q=>{
    if(['Borrador','Enviada'].includes(q.estado) && q.vence < today()) return {...q, estado:'Expirada'};
    return q;
  });

  const newQuote = () => setEdit({id:uid('CT'), numero:'COT-'+rand(20000,29999), clienteId:clients[0].id, fecha:today(), vence:addDays(today(),15), items:[], neto:0, iva:0, total:0, estado:'Borrador', vendedor:EJECUTIVOS[0], descuentoGlobal:{tipo:'%',valor:0}, observaciones:'', condiciones:'Forma de pago: 30 días desde emisión de factura. Despacho FOB Santiago. Cotización sujeta a disponibilidad de stock.', historialEnvios:[]});
  const dup = (q) => setEdit({...q, id:uid('CT'), numero:'COT-'+rand(20000,29999), fecha:today(), vence:addDays(today(),15), estado:'Borrador', historialEnvios:[]});

  // Cuando una cotización pasa a Aprobada → crear automáticamente OV CONFIRMADA
  const saveQuote = (d) => {
    const prev = quotes.find(q=>q.id===d.id);
    dispatch({type:'UPSERT', collection:'quotes', item:d});
    if(d.estado==='Aprobada' && prev?.estado!=='Aprobada'){
      const oid = uid('OV');
      const items = d.items.map(it=>({...it}));
      dispatch({type:'UPSERT', collection:'sales', item:{
        id:oid, numero:'OV-'+rand(50000,59999), clienteId:d.clienteId, fecha:today(),
        items, neto:d.neto, iva:d.iva, total:d.total, estado:'Confirmada',
        vendedor:d.vendedor, descuentoGlobal:d.descuentoGlobal,
        cotizacionId:d.id,
        historialEstados:[{de:null, a:'Confirmada', fecha:today(), usuario:'Sistema', modo:'auto · desde cotización aprobada'}]
      }});
      toast(`Cotización aprobada · OV ${oid} creada como CONFIRMADA`);
    } else {
      toast('Cotización guardada');
    }
    setEdit(null);
  };

  const eliminar = (q) => { if(confirm(`¿Eliminar cotización ${q.numero}?`)){ dispatch({type:'DELETE', collection:'quotes', id:q.id}); toast('Cotización eliminada','warn'); } };

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
      <Kpi label="Total" value={enriched.length} tone="neutral"/>
      <Kpi label="Borradores" value={enriched.filter(q=>q.estado==='Borrador').length} tone="neutral"/>

      <Kpi label="Aprobadas" value={enriched.filter(q=>q.estado==='Aprobada').length} tone="good"/>
      <Kpi label="Expiradas" value={enriched.filter(q=>q.estado==='Expirada').length} tone="warn"/>
    </div>
    <Card title="Cotizaciones" action={<Btn onClick={newQuote}>Nueva cotización</Btn>}>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line"><th className="pb-2 font-medium">N°</th><th className="pb-2 font-medium">Cliente</th><th className="pb-2 font-medium">Fecha</th><th className="pb-2 font-medium">Vence</th><th className="pb-2 font-medium text-right">Total</th><th className="pb-2 font-medium">Estado</th><th></th></tr></thead>
        <tbody>{enriched.map(q=>{const c=clients.find(x=>x.id===q.clienteId); return <tr key={q.id} className="border-b border-sina-lineSoft row-hover">
          <td className="py-3 font-mono text-xs">{q.numero}</td>
          <td>{c?.razonSocial}</td>
          <td>{fmtDate(q.fecha)}</td>
          <td>{fmtDate(q.vence)}</td>
          <td className="text-right num">{CLP(q.total)}</td>
          <td><Badge tone={q.estado==='Aprobada'?'mint':q.estado==='Enviada'?'sky':q.estado==='Rechazada'?'rose':q.estado==='Expirada'?'amber':'navy'} dot>{q.estado}</Badge></td>
          <td className="text-right text-xs space-x-3">
            <button className="text-sina-navy font-medium" onClick={()=>setEdit({...q})}>Editar</button>
            <button className="text-sina-body font-medium" onClick={()=>setPdfPreview({...q})}>PDF</button>
            <button className="text-sina-body font-medium" onClick={()=>setEmailDlg({...q})}>Enviar</button>
            <button className="text-sina-body font-medium" onClick={()=>dup(q)}>Duplicar</button>
            <button className="text-sina-rose font-medium" onClick={()=>eliminar(q)}>Eliminar</button>
          </td>
        </tr>;})}</tbody>
      </table>
    </Card>

    <Modal open={!!edit} onClose={()=>setEdit(null)} title={`Cotización ${edit?.numero||''}`} size="xl">
      {edit && <DocEditor doc={edit} setDoc={setEdit} clients={clients} products={products}
        onSave={saveQuote}
        statuses={['Borrador','Enviada','Aprobada','Rechazada','Expirada']} onCancel={()=>setEdit(null)}/>}
    </Modal>

    <Modal open={!!pdfPreview} onClose={()=>setPdfPreview(null)} title={`Previsualización · ${pdfPreview?.numero}`} size="xl">
      {pdfPreview && <QuotePrintView quote={pdfPreview} cliente={clients.find(c=>c.id===pdfPreview.clienteId)} onClose={()=>setPdfPreview(null)}/>}
    </Modal>

    <Modal open={!!emailDlg} onClose={()=>setEmailDlg(null)} title={`Enviar cotización ${emailDlg?.numero} por email`} size="lg">
      {emailDlg && <EnviarCotizacionForm quote={emailDlg} cliente={clients.find(c=>c.id===emailDlg.clienteId)} onClose={()=>setEmailDlg(null)} onSent={(updated)=>{dispatch({type:'UPSERT', collection:'quotes', item:updated}); setEmailDlg(null);}}/>}
    </Modal>
  </div>;
}

function EnviarCotizacionForm({quote, cliente, onClose, onSent}){
  const [destinatario, setDest] = useState(cliente?.email||'');
  const [asunto, setAsunto] = useState(`Cotización Sina N° ${quote.numero}`);
  const [mensaje, setMensaje] = useState(`Estimado/a ${cliente?.contacto||cliente?.razonSocial},\n\nAdjuntamos la cotización N° ${quote.numero} por un total de ${CLP(quote.total)}, con validez hasta ${fmtDate(quote.vence)}.\n\nQuedamos atentos a sus comentarios.\n\nSaludos cordiales,\n${quote.vendedor}\nSina Pinturas SpA`);
  const toast = useToast();
  const enviar = () => {
    const evento = { fecha:today(), canal:'email', destinatario, asunto };
    const updated = {...quote, estado: quote.estado==='Borrador'?'Enviada':quote.estado, historialEnvios: [...(quote.historialEnvios||[]), evento]};
    onSent(updated);
    toast(`Cotización enviada a ${destinatario}`);
  };
  return <div className="space-y-3">
    <Input label="Para (email)" value={destinatario} onChange={e=>setDest(e.target.value)}/>
    <Input label="Asunto" value={asunto} onChange={e=>setAsunto(e.target.value)}/>
    <Textarea label="Mensaje" rows="8" value={mensaje} onChange={e=>setMensaje(e.target.value)} className="font-mono text-xs"/>
    <Card title="Historial de envíos">
      {quote.historialEnvios?.length ?
        <ul className="text-sm space-y-1">
          {quote.historialEnvios.map((e,i)=><li key={i} className="flex items-center gap-3 text-xs"><Badge tone="sky">{e.canal}</Badge><span className="text-sina-muted">{fmtDate(e.fecha)}</span><span className="text-sina-body">→ {e.destinatario}</span></li>)}
        </ul>
        : <div className="text-sm text-sina-muted">Sin envíos previos.</div>
      }
    </Card>
    <div className="flex justify-end gap-2 pt-2 border-t border-sina-line">
      <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
      <Btn onClick={enviar}>Enviar email</Btn>
    </div>
  </div>;
}
