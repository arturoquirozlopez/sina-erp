function DocEditor({doc, setDoc, clients, products, onSave, statuses, onCancel, isOV=false, extraTabs=null}){
  const [tab, setTab] = useState('detalle');
  const descG = doc.descuentoGlobal || {tipo:'%', valor:0};
  const setDescG = (val) => recalc({...doc, descuentoGlobal: val}, doc.items);
  const recalc = (next, items) => {
    const totals = computeDocTotals(items, next.descuentoGlobal);
    setDoc({...next, items, neto:totals.neto, iva:totals.iva, total:totals.total});
  };
  const setItems = (items) => recalc(doc, items);
  const changeEstado = (nuevo) => {
    if(nuevo===doc.estado){ return; }
    if(isOV){
      const hist = [...(doc.historialEstados||[]), {de:doc.estado, a:nuevo, fecha:today(), usuario:'Arturo', modo:'manual'}];
      setDoc({...doc, estado:nuevo, historialEstados:hist});
    } else setDoc({...doc, estado:nuevo});
  };
  const TabBtn = ({id,label}) => <button onClick={()=>setTab(id)} className={`px-3 py-2 text-[13px] border-b-2 -mb-px ${tab===id?'border-sina-navy text-sina-navy font-medium':'border-transparent text-sina-muted hover:text-sina-ink'}`}>{label}</button>;

  return <div className="space-y-4">
    <div className="border-b border-sina-line flex gap-2">
      <TabBtn id="detalle" label="Detalle"/>
      {isOV && <TabBtn id="historial" label={`Historial${doc.historialEstados?.length?` · ${doc.historialEstados.length}`:''}`}/>}
      {extraTabs && extraTabs(TabBtn)}
    </div>

    {tab==='detalle' && <Fragment>
      <div className="grid grid-cols-4 gap-3">
        <Input label="Número" value={doc.numero} onChange={e=>setDoc({...doc, numero:e.target.value})}/>
        <Select label="Cliente" value={doc.clienteId} onChange={e=>setDoc({...doc, clienteId:e.target.value})}>{clients.map(c=><option key={c.id} value={c.id}>{c.razonSocial}</option>)}</Select>
        <Input label="Fecha" type="date" value={doc.fecha} onChange={e=>setDoc({...doc, fecha:e.target.value})}/>
        {doc.vence!=null && <Input label="Vence" type="date" value={doc.vence} onChange={e=>setDoc({...doc, vence:e.target.value})}/>}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Select label="Estado" value={doc.estado} onChange={e=>changeEstado(e.target.value)}>{statuses.map(s=><option key={s}>{s}</option>)}</Select>
        <Select label="Vendedor" value={doc.vendedor} onChange={e=>setDoc({...doc, vendedor:e.target.value})}>{EJECUTIVOS.map(e=><option key={e}>{e}</option>)}</Select>
      </div>
      <DeliveryEditor doc={doc} setDoc={setDoc}/>
      <DocItemsEditor items={doc.items} setItems={setItems} products={products} descuentoGlobal={descG} setDescuentoGlobal={setDescG}/>
      {doc.observaciones!=null && <Textarea label="Observaciones" rows="2" value={doc.observaciones||''} onChange={e=>setDoc({...doc, observaciones:e.target.value})}/>}
      {doc.condiciones!=null && <Textarea label="Condiciones comerciales" rows="2" value={doc.condiciones||''} onChange={e=>setDoc({...doc, condiciones:e.target.value})}/>}
    </Fragment>}

    {tab==='historial' && isOV && (
      (doc.historialEstados||[]).length===0
        ? <div className="text-sm text-sina-muted py-4">Sin cambios de estado registrados aún.</div>
        : <ol className="relative border-l border-sina-line pl-5 space-y-3">
            {(doc.historialEstados||[]).map((h,i)=><li key={i} className="relative">
              <span className="absolute -left-[27px] top-1.5 dot" style={{background:h.modo==='manual'?'#7EB8F7':'#1C3566'}}/>
              <div className="text-sm text-sina-ink">{h.de? `${h.de} → ${h.a}` : `Creada como ${h.a}`} <Badge tone={h.modo==='manual'?'sky':'navy'}>{h.modo}</Badge></div>
              <div className="text-xs text-sina-muted">{fmtDate(h.fecha)} · {h.usuario}</div>
            </li>)}
          </ol>
    )}

    <div className="flex justify-end gap-2 pt-3 border-t border-sina-line">
      <Btn variant="ghost" onClick={onCancel}>Cancelar</Btn>
      <Btn onClick={()=>onSave(doc)}>Guardar</Btn>
    </div>
  </div>;
}

function OrdenesVentaView({go}){
  const { state, dispatch } = useStore();
  const { sales, clients, products, invoices } = state;
  const [edit,setEdit]=useState(null);
  const toast = useToast();

  const facturar = (o) => {
    const provider = PROVIDERS[ACTIVE_PROVIDER];
    const inv = { id:uid('F'), folio: rand(100000,999999), oid:o.id, clienteId:o.clienteId, items:o.items, neto:o.neto, iva:o.iva, total:o.total, fechaEmision:today(), fechaVencimiento:addDays(today(),30), estadoFactura:'Borrador', estadoPago:'Pendiente', providerName:provider.name };
    provider.emit(inv).then(r=>{
      const final = {...inv, providerResponse:r.response, providerFolio:r.providerFolio, trackId:r.trackId, estadoFactura:r.ok?'Emitida':'Borrador'};
      dispatch({type:'UPSERT', collection:'invoices', item:final});
      dispatch({type:'UPSERT', collection:'sales', item:{...o, estado:'Facturada'}});
      toast(`Factura ${final.folio} emitida vía ${provider.name}`);
    });
  };

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
      <Kpi label="Total OV" value={sales.length} tone="neutral"/>
      <Kpi label="Pendientes" value={sales.filter(s=>['Pendiente','Confirmada'].includes(s.estado)).length} tone="warn"/>
      <Kpi label="Entregadas" value={sales.filter(s=>s.estado==='Entregada').length} tone="accent"/>
      <Kpi label="Facturadas" value={sales.filter(s=>s.estado==='Facturada').length} tone="good"/>
      <Kpi label="Pagadas" value={sales.filter(s=>s.estado==='Pagada').length} tone="accent"/>
    </div>
    <Card title="Órdenes de venta" action={
      <div className="flex gap-2 flex-wrap">
        <CsvActions stateKey="sales" label="Ventas" onImport={(items)=>{
          // Agrupar por número de OV
          const byNum = {};
          items.forEach(it=>{ (byNum[it.numero] = byNum[it.numero]||[]).push(it); });
          Object.entries(byNum).forEach(([numero, rows])=>{
            const cli = clients.find(c=>c.rut===rows[0].clienteRut); if(!cli) return;
            const ovItems = rows.map(r=>{
              const p = products.find(x=>x.sku===r.sku); if(!p) return null;
              const desc = (+r.descuentoPct||0)/100;
              const total = Math.round(r.precioUnitario*r.cantidad*(1-desc));
              return { productoId:p.id, sku:p.sku, nombre:p.nombre, cantidad:+r.cantidad, precio:+r.precioUnitario, descuento:desc, descuentoTipo:'%', descuentoValor:+r.descuentoPct||0, total, costo:p.costo };
            }).filter(Boolean);
            const neto = ovItems.reduce((s,i)=>s+i.total,0);
            const iva = Math.round(neto*0.19);
            const id = uid('OV');
            dispatch({type:'UPSERT', collection:'sales', item:{ id, numero, clienteId:cli.id, fecha:rows[0].fecha||today(), items:ovItems, neto, iva, total:neto+iva, estado:'Confirmada', vendedor:cli.ejecutivo, historialEstados:[{de:null,a:'Confirmada',fecha:today(),usuario:'CSV',modo:'inicial'}], descuentoGlobal:{tipo:'%',valor:0} }});
          });
        }}/>
        <Btn onClick={()=>setEdit({id:uid('OV'), numero:'OV-'+rand(70000,79999), clienteId:clients[0].id, fecha:today(), items:[], neto:0, iva:0, total:0, estado:'Pendiente', vendedor:EJECUTIVOS[0], descuentoGlobal:{tipo:'%',valor:0}, historialEstados:[]})}>Nueva OV</Btn>
      </div>
    }>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line"><th className="pb-2 font-medium">N°</th><th className="pb-2 font-medium">Cliente</th><th className="pb-2 font-medium">Fecha</th><th className="pb-2 font-medium">Vendedor</th><th className="pb-2 font-medium">Origen</th><th className="pb-2 font-medium text-right">Total</th><th className="pb-2 font-medium">Estado</th><th></th></tr></thead>
        <tbody>{[...sales].sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,200).map(o=>{const c=clients.find(x=>x.id===o.clienteId); return <tr key={o.id} className="border-b border-sina-lineSoft row-hover">
          <td className="py-3 font-mono text-xs">{o.numero}</td>
          <td>{c?.razonSocial}</td>
          <td>{fmtDate(o.fecha)}</td>
          <td>{o.vendedor}</td>
          <td>{o.origen==='WhatsApp' ? <Badge tone="mint" dot>WhatsApp</Badge> : <span className="text-xs text-sina-muted">Manual</span>}</td>
          <td className="text-right num">{CLP(o.total)}</td>
          <td><Badge tone={o.estado==='Pagada'?'mint':o.estado==='Facturada'?'sky':o.estado==='Entregada'?'sky':o.estado==='Confirmada'?'amber':'navy'} dot>{o.estado}</Badge></td>
          <td className="text-right text-xs space-x-2">
            <button className="text-sina-navy font-medium" onClick={()=>setEdit({...o})}>Editar</button>
            {['Pendiente','Confirmada','Entregada'].includes(o.estado) && <button className="text-sina-mint font-medium" onClick={()=>facturar(o)}>Facturar</button>}
          </td>
        </tr>;})}</tbody>
      </table>
    </Card>
    <Modal open={!!edit} onClose={()=>setEdit(null)} title={`Orden de Venta ${edit?.numero||''}`} size="xl">
      {edit && <DocEditor doc={edit} setDoc={setEdit} clients={clients} products={products} isOV={true}
        onSave={(d)=>{dispatch({type:'UPSERT', collection:'sales', item:d}); toast('OV guardada'); setEdit(null);}}
        statuses={['Pendiente','Confirmada','Entregada','Facturada','Pagada']} onCancel={()=>setEdit(null)}/>}
    </Modal>
  </div>;
}

function pagoRechazado(p){ return (p?.estadoValidacion || 'validado') === 'rechazado'; }
function pagoConciliado(p, bankTransactions){
  if(!p) return false;
  if(p.conciliado || p.bankTransactionId) return true;
  return (bankTransactions||[]).some(t => t.paymentId === p.id);
}
function estadoPagoDesdePagos(inv, payments){
  const paid = (payments||[]).filter(p => p.invoiceId===inv.id && !pagoRechazado(p)).reduce((s,p)=>s+Number(p.monto||0),0);
  if(paid <= 0) return 'Pendiente';
  if(paid + 10 >= Number(inv.total||0)) return 'Pagada';
  return 'Parcialmente pagada';
}
function AnularPagoControl({pago}){
  const { state, dispatch } = useStore();
  const { can, currentUser } = useAuth();
  const toast = useToast();
  const [open, setOpen] = useState(false);
  const [motivo, setMotivo] = useState('');
  if(!can('cobranza','registrar_pago')) return null;
  if(pagoRechazado(pago)) return <Badge tone="rose">Anulado</Badge>;
  if(pagoConciliado(pago, state.bankTransactions)){
    return <span className="text-xs text-sina-amber">Conciliado · desconcilia antes de anular</span>;
  }
  const confirmar = () => {
    const inv = (state.invoices||[]).find(i => i.id === pago.invoiceId);
    if(!inv){ toast('Factura no encontrada','warn'); return; }
    const cuando = new Date().toLocaleString('es-CL', { hour12:false });
    const motivoLimpio = motivo.trim();
    const pagos = (state.payments||[]).map(p => p.id===pago.id ? {...p, estadoValidacion:'rechazado'} : p);
    const estadoPago = estadoPagoDesdePagos(inv, pagos);
    dispatch({type:'UPSERT', collection:'payments', item:{
      ...pago, estadoValidacion:'rechazado', anuladoMotivo: motivoLimpio || null,
      anuladoAt: new Date().toISOString(), anuladoPor: currentUser?.id || null,
    }});
    dispatch({type:'UPSERT', collection:'invoices', item:{...inv, estadoPago}});
    dispatch({type:'UPSERT', collection:'auditLog', item:{
      id: uid('AU'), userId: currentUser?.id || null, accion:'anular_pago_factura', modulo:'cobranza',
      fecha: today(),
      detalle: `Folio ${inv.folio} · pago ${CLP(pago.monto)} ${pago.metodo} del ${fmtDate(pago.fecha)} anulado · ${currentUser?.nombre||'usuario'} · ${cuando}${motivoLimpio ? ` · Motivo: ${motivoLimpio}` : ''}`,
    }});
    toast(`Pago anulado. La factura quedó ${estadoPago}.`);
    setOpen(false); setMotivo('');
  };
  if(!open) return <button type="button" className="text-sina-rose font-semibold" onClick={()=>setOpen(true)}>Anular pago</button>;
  return <div className="mt-2 p-2 rounded-lg border border-sina-line bg-sina-bg space-y-2 text-left">
    <div className="text-xs text-sina-body">¿Anular este pago? Queda en el historial y la factura vuelve a Pendiente o Parcial según el saldo.</div>
    <Input placeholder="Motivo (opcional)" value={motivo} onChange={e=>setMotivo(e.target.value)} maxLength={500}/>
    <div className="flex gap-2 justify-end">
      <Btn type="button" variant="ghost" size="sm" onClick={()=>{setOpen(false); setMotivo('');}}>Cancelar</Btn>
      <Btn type="button" variant="danger" size="sm" onClick={confirmar}>Confirmar anulación</Btn>
    </div>
  </div>;
}
function CobranzasView({go}){
  const { state, dispatch } = useStore();

    const c = clients.find(x=>x.id===i.clienteId);
    const dias = daysBetween(i.fechaVencimiento, today());
    const score = Math.max(0,dias)*2 + (i.total/100000);
    return {i,c,dias,score};
  }).sort((a,b)=>b.score-a.score);
  const aging = {'0-15':0,'16-30':0,'31-60':0,'60+':0};
  pendientes.forEach(({dias,i})=>{
    if(dias<=15) aging['0-15']+=i.total;

    else if(dias<=60) aging['31-60']+=i.total;
    else aging['60+']+=i.total;
  });

  const registrarPago = (i, monto) => {

          <td className="py-2 font-mono text-xs">{i.folio}</td>
          <td>{c?.razonSocial}</td>

function ConciliacionView(){
  const { state, dispatch } = useStore();
  const { bankTransactions, invoices, payments, clients } = state;
  const [match,setMatch]=useState(null);
  const toast = useToast();

  const autoMatch = () => {
    const updates = [];
    bankTransactions.forEach(tx=>{
      if(tx.conciliado) return;
      const candidate = invoices.find(inv=>inv.estadoPago!=='Pagada' && inv.total===tx.monto && Math.abs(daysBetween(inv.fechaEmision, tx.fecha))<60);
      if(candidate){ updates.push({tx, inv:candidate}); }
    });
    const pagos = [...state.payments];
    updates.forEach(({tx, inv})=>{
      const p = {id:uid('PG'), invoiceId:inv.id, fecha:tx.fecha, monto:tx.monto, metodo:'Transferencia', referencia:tx.referencia, origen:'admin', estadoValidacion:'validado', conciliado:true, bankTransactionId:tx.id};
      pagos.push(p);
      dispatch({type:'UPSERT', collection:'payments', item:p});
      dispatch({type:'UPSERT', collection:'invoices', item:{...inv, estadoPago: estadoPagoDesdePagos(inv, pagos)}});
      dispatch({type:'UPSERT', collection:'bankTransactions', item:{...tx, conciliado:true, paymentId:p.id}});
    });
    toast(`${updates.length} transacciones conciliadas automáticamente`);
  };

  const uploadCSV = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      const lines = r.result.split(/\r?\n/).filter(Boolean);
      const header = lines[0].toLowerCase();
      const news = [];
      lines.slice(1).forEach(l=>{
        const cols = l.split(',');
        if(cols.length<3) return;
        const fecha = cols[0]; const monto = +cols[1].replace(/[^\d.-]/g,''); const descripcion = cols[2]||'';
        if(!fecha||!monto) return;
        news.push({id:uid('TX'), fecha, monto, descripcion, referencia:cols[3]||'CSV-'+rand(1000,9999), conciliado:false, paymentId:null});
      });
      dispatch({type:'BULK', payload:{bankTransactions:[...news, ...bankTransactions]}});
      toast(`${news.length} transacciones importadas`);
    };
    r.readAsText(f);
  };

  const reconciliadas = bankTransactions.filter(t=>t.conciliado).length;
  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
      <Kpi label="Transacciones" value={bankTransactions.length} tone="neutral"/>
      <Kpi label="Conciliadas" value={reconciliadas} tone="good"/>
      <Kpi label="No conciliadas" value={bankTransactions.length-reconciliadas} tone="warn"/>
      <Kpi label="Monto sin conciliar" value={CLP(bankTransactions.filter(t=>!t.conciliado).reduce((s,t)=>s+t.monto,0))} tone="risk"/>
    </div>
    <Card title="Cartola bancaria" action={
      <div className="flex gap-2">
        <label className="px-3 py-2 rounded-lg text-sm font-semibold bg-white border border-sina-line cursor-pointer">Importar CSV<input type="file" accept=".csv" className="hidden" onChange={uploadCSV}/></label>
        <Btn onClick={autoMatch}>Conciliar automáticamente</Btn>
      </div>
    }>
      <div className="text-xs text-sina-muted mb-3">Formato CSV: <code className="bg-sina-bg px-1 rounded">fecha,monto,descripcion,referencia</code></div>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Fecha</th><th>Descripción</th><th>Referencia</th><th className="text-right">Monto</th><th>Estado</th><th></th></tr></thead>
        <tbody>{bankTransactions.slice(0,200).map(t=><tr key={t.id} className="border-b border-sina-lineSoft row-hover">
          <td className="py-2">{fmtDate(t.fecha)}</td>
          <td className="text-sina-ink">{t.descripcion}</td>
          <td className="font-mono text-xs text-sina-muted">{t.referencia}</td>
          <td className="text-right num font-semibold">{CLP(t.monto)}</td>
          <td><Badge tone={t.conciliado?'mint':'amber'}>{t.conciliado?'Conciliado':'No conciliado'}</Badge></td>
          <td className="text-right text-xs">{!t.conciliado && <button className="text-sina-navy font-semibold" onClick={()=>setMatch(t)}>Conciliar</button>}</td>
        </tr>)}</tbody>
      </table>
    </Card>
    <Modal open={!!match} onClose={()=>setMatch(null)} title="Conciliación manual">
      {match && <ConciliarManual tx={match} onClose={()=>setMatch(null)}/>}
    </Modal>
  </div>;
}

function ConciliarManual({tx, onClose}){
  const { state, dispatch } = useStore();
  const { invoices, clients } = state;
  const [q,setQ] = useState('');
  const toast = useToast();
  const candidates = invoices.filter(i=>i.estadoPago!=='Pagada').filter(i=>{
    const c = clients.find(x=>x.id===i.clienteId);
    return (`${i.folio} ${c?.razonSocial} ${c?.rut}`).toLowerCase().includes(q.toLowerCase());
  }).sort((a,b)=>Math.abs(a.total-tx.monto)-Math.abs(b.total-tx.monto)).slice(0,30);
  const confirm = (inv) => {
    const p={id:uid('PG'), invoiceId:inv.id, fecha:tx.fecha, monto:tx.monto, metodo:'Transferencia', referencia:tx.referencia, origen:'admin', estadoValidacion:'validado', conciliado:true, bankTransactionId:tx.id};
    const pagos=[...(state.payments||[]), p];
    dispatch({type:'UPSERT', collection:'payments', item:p});
    dispatch({type:'UPSERT', collection:'invoices', item:{...inv, estadoPago: estadoPagoDesdePagos(inv, pagos)}});
    dispatch({type:'UPSERT', collection:'bankTransactions', item:{...tx, conciliado:true, paymentId:p.id}});
    toast('Conciliación registrada'); onClose();
  };
  return <div className="space-y-3">
    <div className="p-3 rounded-lg bg-sina-bg text-sm">
      <div><b>Transacción:</b> {fmtDate(tx.fecha)} · {tx.descripcion} · <span className="num font-semibold">{CLP(tx.monto)}</span></div>
    </div>
    <Input placeholder="Buscar factura por folio, cliente o RUT..." value={q} onChange={e=>setQ(e.target.value)}/>
    <table className="w-full text-sm">
      <thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Folio</th><th>Cliente</th><th className="text-right">Total</th><th></th></tr></thead>
      <tbody>{candidates.map(i=>{const c=clients.find(x=>x.id===i.clienteId); return <tr key={i.id} className="border-b border-sina-lineSoft"><td className="py-2 font-mono text-xs">{i.folio}</td><td>{c?.razonSocial}</td><td className="text-right num">{CLP(i.total)}</td><td className="text-right"><Btn variant="ghost" onClick={()=>confirm(i)}>Conciliar</Btn></td></tr>;})}</tbody>
    </table>
  </div>;
}

function OrdenesCompraView({go}){
  const { state, dispatch } = useStore();
  const { purchaseOrders, suppliers, products, movements, receptions=[] } = state;
  const [edit,setEdit]=useState(null);
  const [receiving, setReceiving] = useState(null);
  const toast = useToast();

  const newOC = () => setEdit({id:uid('OC'), numero:'OC-'+rand(8000,9999), proveedorId:suppliers[0].id, fecha:today(), eta:addDays(today(),30), items:[], total:0, estado:'Borrador', moneda:'CLP', documentos:[], historial:[{de:null, a:'Borrador', fecha:today(), usuario:'Arturo'}]});

  // % recibido por OC
  const pctRecibido = (oc) => {
    const tot = oc.items.reduce((s,i)=>s+i.cantidad,0);
    if(!tot) return 0;
    const ya = receptions.filter(r=>r.ocId===oc.id).flatMap(r=>r.items).reduce((s,i)=>s+i.cantidadRecibida,0);
    return Math.round(ya/tot*100);
  };

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-6 gap-4">
      <Kpi label="OC totales" value={purchaseOrders.length} tone="neutral"/>
      <Kpi label="En producción" value={purchaseOrders.filter(p=>p.estado==='En producción').length} tone="warn"/>
      <Kpi label="En tránsito" value={purchaseOrders.filter(p=>p.estado==='En tránsito').length} tone="accent"/>
      <Kpi label="Llegadas" value={purchaseOrders.filter(p=>p.estado==='Llegada').length} tone="accent"/>
      <Kpi label="Recepción parcial" value={purchaseOrders.filter(p=>p.estado==='Recepción parcial').length} tone="warn"/>
      <Kpi label="Recibidas" value={purchaseOrders.filter(p=>p.estado==='Recibida').length} tone="good"/>
    </div>
    <Card title="Órdenes de compra" action={<Btn onClick={newOC}>Nueva OC</Btn>}>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line"><th className="pb-2 font-medium">N°</th><th className="pb-2 font-medium">Proveedor</th><th className="pb-2 font-medium">Fecha</th><th className="pb-2 font-medium">ETA</th><th className="pb-2 font-medium text-right">Recibido</th><th className="pb-2 font-medium">Docs</th><th className="pb-2 font-medium text-right">Total</th><th className="pb-2 font-medium">Estado</th><th></th></tr></thead>
        <tbody>{[...purchaseOrders].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(o=>{
          const s=suppliers.find(x=>x.id===o.proveedorId);
          const pct=pctRecibido(o);
          return <tr key={o.id} className="border-b border-sina-lineSoft row-hover">
            <td className="py-3 font-mono text-xs">{o.numero}</td>
            <td><div className="text-sina-ink">{s?.nombre}</div><div className="text-xs text-sina-muted">{s?.pais}</div></td>
            <td>{fmtDate(o.fecha)}</td>
            <td>{fmtDate(o.eta)}<div className="text-xs text-sina-muted">{daysBetween(today(),o.eta)>0?`en ${daysBetween(today(),o.eta)}d`:`hace ${-daysBetween(today(),o.eta)}d`}</div></td>
            <td className="text-right"><div className="num">{pct}%</div><div className="w-16 h-1 bg-sina-line rounded-full ml-auto mt-1"><div className="h-1 bg-sina-navy rounded-full" style={{width:pct+'%'}}/></div></td>
            <td>{(o.documentos||[]).length>0 && <Badge tone="sky" dot>{(o.documentos||[]).length}</Badge>}</td>
            <td className="text-right num">{o.moneda} {NUM(o.total)}</td>
            <td><Badge tone={o.estado==='Recibida'?'mint':o.estado==='En tránsito'?'sky':o.estado==='Llegada'?'sky':o.estado==='Recepción parcial'?'amber':'navy'} dot>{o.estado}</Badge></td>
            <td className="text-right text-xs space-x-2">

        onSave={(d)=>{dispatch({type:'UPSERT', collection:'purchaseOrders', item:d}); toast('OC guardada'); setEdit(null);}}
        onCancel={()=>setEdit(null)}

    </Modal>
    <Modal open={!!receiving} onClose={()=>setReceiving(null)} title={`Recibir mercadería · ${receiving?.numero}`} size="xl">
      {receiving && <RecepcionPanel oc={receiving} onClose={()=>setReceiving(null)}/>}
    </Modal>
  </div>;
}

function OCEditor({doc, setDoc, suppliers, products, receptions=[], onSave, onCancel, onRecibir}){
  const [tab, setTab] = useState('detalle');
  const setItems = (items) => {
    const total = items.reduce((s,i)=>s+i.total,0);
    setDoc({...doc, items, total});
  };
  const sup = suppliers.find(s=>s.id===doc.proveedorId);
  const filtProds = products.filter(p=>p.proveedorId===doc.proveedorId);
  const recOC = receptions.filter(r=>r.ocId===doc.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const changeEstado = (nuevo) => {
    if(nuevo===doc.estado) return;
    setDoc({...doc, estado:nuevo, historial:[...(doc.historial||[]), {de:doc.estado, a:nuevo, fecha:today(), usuario:'Arturo'}]});
  };

  const TabBtn = ({id,label}) => <button onClick={()=>setTab(id)} className={`px-3 py-2 text-[13px] border-b-2 -mb-px ${tab===id?'border-sina-navy text-sina-navy font-medium':'border-transparent text-sina-muted hover:text-sina-ink'}`}>{label}</button>;

  return <div className="space-y-4">
    <div className="border-b border-sina-line flex gap-2">
      <TabBtn id="detalle" label="Detalle"/>
      <TabBtn id="documentos" label={`Documentos${(doc.documentos||[]).length?` · ${(doc.documentos||[]).length}`:''}`}/>
      <TabBtn id="recepciones" label={`Recepciones${recOC.length?` · ${recOC.length}`:''}`}/>

    {tab==='detalle' && <Fragment>
      <div className="grid grid-cols-4 gap-3">
        <Input label="Número" value={doc.numero} onChange={e=>setDoc({...doc,numero:e.target.value})}/>

        <Input label="ETA" type="date" value={doc.eta} onChange={e=>setDoc({...doc,eta:e.target.value})}/>
      </div>
      <div className="grid grid-cols-3 gap-3">
        <Select label="Estado" value={doc.estado} onChange={e=>changeEstado(e.target.value)}>{['Borrador','Enviada','Confirmada','En producción','En tránsito','Llegada','Recepción parcial','Recibida'].map(s=><option key={s}>{s}</option>)}</Select>
        <Select label="Moneda" value={doc.moneda} onChange={e=>setDoc({...doc,moneda:e.target.value})}><option>CLP</option><option>USD</option><option>EUR</option></Select>

      </div>
      <div className="border border-sina-line rounded-lg overflow-hidden">
        <table className="w-full text-sm">
          <thead className="text-left text-[11px] uppercase tracking-wider text-sina-muted bg-sina-bg"><tr><th className="py-2 px-3 font-medium">Producto</th><th className="text-right font-medium">Cant.</th><th className="text-right font-medium">Costo unit.</th><th className="text-right font-medium">Total</th><th></th></tr></thead>

         </div>
         <table className="w-full text-xs"><thead><tr className="text-left text-sina-muted border-b border-sina-line"><th className="py-1">SKU</th><th>Producto</th><th className="text-right">Recibido</th><th className="text-right">De OC</th></tr></thead>
           <tbody>{r.items.map((i,k)=><tr key={k} className="border-b border-sina-lineSoft last:border-0"><td className="py-1 font-mono">{i.sku}</td><td>{i.nombre}</td><td className="text-right num">{i.cantidadRecibida}</td><td className="text-right num text-sina-muted">{i.cantidadOC}</td></tr>)}</tbody></table>
         {r.observaciones && <p className="text-xs text-sina-body mt-2 italic">{r.observaciones}</p>}
       </div>)}

    {tab==='historial' && <div>

              <span className="absolute -left-[27px] top-1.5 dot" style={{background:'#1C3566'}}/>

    </div>
  </div>;
}

function InteligenciaCompraView({go}){
  const { state, dispatch } = useStore();
  const { products, invoices, suppliers, purchaseOrders, sales, receptions=[] } = state;
  const recs = products.map(p=>({p, rec:purchaseRecommendation(p, invoices, suppliers, purchaseOrders, sales, receptions)})).filter(x=>x.rec.recomendado>0).sort((a,b)=>a.rec.urgencia-b.rec.urgencia);
  const toast = useToast();
  const generarOC = (sup) => {
    const items = recs.filter(({p})=>p.proveedorId===sup.id).slice(0,15).map(({p,rec})=>({productoId:p.id, sku:p.sku, nombre:p.nombre, cantidad:rec.recomendado, costo:p.costo, total:rec.recomendado*p.costo}));
    if(!items.length){ toast('Sin recomendaciones para este proveedor','warn'); return; }
    const total = items.reduce((s,i)=>s+i.total,0);
    const oc = {id:uid('OC'), numero:'OC-'+rand(8000,9999), proveedorId:sup.id, fecha:today(), eta:addDays(today(),sup.leadTimeDias), items, total, estado:'Borrador', moneda:sup.moneda};
    dispatch({type:'UPSERT', collection:'purchaseOrders', item:oc});
    toast(`OC ${oc.numero} generada con ${items.length} líneas`);
    go('compras','ordenes');
  };
  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
      <Kpi label="Productos a comprar" value={recs.length} tone="accent"/>
      <Kpi label="Urgentes (≤7 días)" value={recs.filter(r=>r.rec.urgencia<=7).length} tone="risk"/>
      <Kpi label="China (lead ~90d)" value={recs.filter(r=>r.rec.sup?.pais==='China').length} tone="warn"/>
      <Kpi label="Inversión estimada" value={CLP(recs.reduce((s,r)=>s+r.rec.recomendado*r.p.costo,0))} tone="neutral"/>
    </div>
    <Card title="Recomendaciones de compra" subtitle="Algoritmo basado en ventas históricas, estacionalidad, lead time observado, stock comprometido y OC en tránsito">
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
            <th className="pb-2 font-medium">Producto</th><th className="pb-2 font-medium">Proveedor</th><th className="pb-2 font-medium text-right">Stock</th><th className="pb-2 font-medium text-right">Compr.</th><th className="pb-2 font-medium text-right">Venta/día×est.</th><th className="pb-2 font-medium text-right">En tránsito</th><th className="pb-2 font-medium text-right">Recom.</th><th className="pb-2 font-medium">Quiebre</th><th className="pb-2 font-medium">Ordenar antes</th><th className="pb-2 font-medium">Urgencia</th>
          </tr></thead>
          <tbody>{recs.slice(0,80).map(({p,rec})=><tr key={p.id} className="border-b border-sina-lineSoft row-hover">
            <td className="py-3"><div className="text-sina-ink">{p.nombre}</div><div className="text-xs text-sina-muted font-mono">{p.sku}</div></td>
            <td className="text-xs"><div className="text-sina-ink">{rec.sup?.nombre}</div><div className="text-sina-muted">{rec.sup?.pais} · {rec.leadReal? `${rec.leadReal}d real` : `${rec.leadConfig}d config`}</div></td>
            <td className="text-right num">{p.stock}</td>
            <td className="text-right num text-sina-muted">{rec.comprometido||'—'}</td>
            <td className="text-right num">{NUM(rec.avgDailyAjustado)} <span className="text-xs text-sina-muted">×{rec.seasonality.toFixed(2)}</span></td>
            <td className="text-right num">{rec.enTransito||'—'}</td>
            <td className="text-right num font-semibold text-sina-navy">{rec.recomendado}</td>
            <td className="text-xs">{fmtDate(rec.stockoutDate)}</td>
            <td className="text-xs">{fmtDate(rec.orderByDate)}</td>
            <td><Badge tone={rec.urgencia<=0?'rose':rec.urgencia<=7?'amber':rec.urgencia<=30?'amber':'mint'} dot>{rec.urgencia<=0?'Atrasado':`${rec.urgencia}d`}</Badge></td>
          </tr>)}</tbody>
        </table>
      </div>
    </Card>

    <Card title="Lead time aprendido por proveedor" subtitle="Comparativa entre lead time configurado y observado en recepciones reales">
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
          <th className="pb-2 font-medium">Proveedor</th><th className="pb-2 font-medium">País</th><th className="pb-2 font-medium text-right">Configurado</th><th className="pb-2 font-medium text-right">Observado (prom.)</th><th className="pb-2 font-medium text-right">Muestras</th><th className="pb-2 font-medium text-right">Mín / Máx</th><th className="pb-2 font-medium">Desviación</th>
        </tr></thead>
        <tbody>{suppliers.map(s=>{
          const obs = supplierObservedLeadTime(s.id, purchaseOrders, receptions);
          const dev = obs? obs.promedio - s.leadTimeDias : null;
          return <tr key={s.id} className="border-b border-sina-lineSoft">
            <td className="py-3 text-sina-ink">{s.nombre}</td>
            <td>{s.pais}</td>
            <td className="text-right num">{s.leadTimeDias}d</td>
            <td className="text-right num">{obs? obs.promedio+'d' : '—'}</td>
            <td className="text-right num text-sina-muted">{obs? obs.muestras : '—'}</td>
            <td className="text-right num text-sina-muted">{obs? `${obs.min} / ${obs.max}` : '—'}</td>
            <td>{dev==null ? <span className="text-xs text-sina-muted">sin datos</span> : <Badge tone={dev>10?'rose':dev<-5?'mint':'navy'} dot>{dev>0?'+':''}{dev} días</Badge>}</td>
          </tr>;
        })}</tbody>
      </table>
    </Card>

    <Card title="Generar OC consolidada por proveedor">
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {suppliers.map(s=>{const n = recs.filter(({p})=>p.proveedorId===s.id).length; const obs = supplierObservedLeadTime(s.id, purchaseOrders, receptions); return <div key={s.id} className="p-4 rounded-lg border border-sina-line bg-white">
          <div className="text-sina-ink font-medium">{s.nombre}</div>
          <div className="text-xs text-sina-muted mb-3">{s.pais} · {s.leadTimeDias}d config · {obs? obs.promedio+'d real' : 'sin recepciones'}</div>
          <div className="text-sm text-sina-body">{n} producto(s) con recomendación</div>
          <div className="mt-3"><Btn variant={n?'primary':'secondary'} className="w-full" size="sm" onClick={()=>generarOC(s)} disabled={!n}>Generar OC</Btn></div>
        </div>;})}
      </div>
    </Card>
  </div>;
}

/* =====================================================================================
   MÓDULO 12 · REPORTES & BI
   ===================================================================================== */
function ReportesView(){
  const { state } = useStore();
  const { invoices, clients, products, suppliers, purchaseOrders, payments, sales, receptions=[] } = state;
  const [tab,setTab]=useState('ventas');
  const [from,setFrom]=useState(addDays(today(),-365));
  const [to,setTo]=useState(today());
  const inRange = inv => inv.fechaEmision>=from && inv.fechaEmision<=to;
  const facturasRango = invoices.filter(inRange);

  const exportCsv = (rows, name) => {
    if(!rows.length) return;
    const keys = Object.keys(rows[0]);
    const csv = [keys.join(',')].concat(rows.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name+'.csv'; a.click();
  };

  const tabs = [
    {id:'ventas', label:'Ventas'},
    {id:'margenes', label:'Márgenes'},
    {id:'rotacion', label:'Rotación inventario'},
    {id:'clientes', label:'Comportamiento clientes'},
    {id:'churn', label:'Riesgo de fuga'},
    {id:'quiebre', label:'Pronóstico de quiebres'},
    {id:'compras', label:'Recomendaciones compra'},
    {id:'aging', label:'Aging cuentas por cobrar'},
    {id:'proveedores', label:'Desempeño proveedores'},
  ];

  return <div className="p-8 space-y-6">
    <Card title="Filtros" action={<div className="flex gap-2">
      <Input type="date" value={from} onChange={e=>setFrom(e.target.value)}/>
      <Input type="date" value={to} onChange={e=>setTo(e.target.value)}/>
    </div>}>
      <div className="flex flex-wrap gap-2">
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-2 rounded-lg text-sm font-semibold ${tab===t.id?'bg-sina-navy text-white':'bg-white border border-sina-line text-sina-ink hover:bg-sina-bg'}`}>{t.label}</button>)}
      </div>
    </Card>

    {tab==='ventas' && (()=>{
      const series = salesByMonth(facturasRango, 12);
      const rows = series.map(s=>({mes:s.mes, ventas:s.ventas, margen:s.margen}));
      return <Card title="Reporte de Ventas" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'ventas')}>Exportar Excel/CSV</Btn>}>
        <ChartBox type="line" data={{labels:series.map(s=>fmtMonth(s.mes+'-01')), datasets:[{label:'Ventas',data:series.map(s=>s.ventas),borderColor:'#1C3566',backgroundColor:'#7EB8F733',fill:true,tension:.35}]}}/>
        <div className="mt-4">
          <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Mes</th><th className="text-right">Ventas (neto)</th><th className="text-right">Costo</th><th className="text-right">Margen</th></tr></thead>
            <tbody>{series.map(s=><tr key={s.mes} className="border-b border-sina-lineSoft"><td className="py-2">{fmtMonth(s.mes+'-01')}</td><td className="text-right num">{CLP(s.ventas)}</td><td className="text-right num">{CLP(s.costo)}</td><td className="text-right num text-sina-mint">{CLP(s.margen)}</td></tr>)}</tbody>
          </table>
        </div>
      </Card>;
    })()}

    {tab==='margenes' && (()=>{
      const byCat={};
      facturasRango.forEach(inv=>inv.items.forEach(it=>{
        const p = products.find(x=>x.id===it.productoId); if(!p) return;
        const c = p.categoria;
        if(!byCat[c]) byCat[c]={ventas:0,costo:0};
        byCat[c].ventas+=it.total;
        byCat[c].costo+=it.cantidad*it.costo;
      }));
      const rows = Object.entries(byCat).map(([c,v])=>({categoria:c, ventas:v.ventas, costo:v.costo, margen:v.ventas-v.costo, margenPct:(v.ventas-v.costo)/(v.ventas||1)}));
      return <Card title="Márgenes por categoría" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'margenes')}>Exportar</Btn>}>
        <ChartBox type="bar" data={{labels:rows.map(r=>r.categoria), datasets:[{label:'Margen', data:rows.map(r=>r.margen), backgroundColor:'#0E8A6B'},{label:'Costo', data:rows.map(r=>r.costo), backgroundColor:'#B45309'}]}} options={{scales:{x:{stacked:true},y:{stacked:true}}}}/>
        <table className="w-full text-sm mt-4"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Categoría</th><th className="text-right">Ventas</th><th className="text-right">Costo</th><th className="text-right">Margen</th><th className="text-right">% margen</th></tr></thead>
          <tbody>{rows.sort((a,b)=>b.margen-a.margen).map(r=><tr key={r.categoria} className="border-b border-sina-lineSoft"><td className="py-2">{r.categoria}</td><td className="text-right num">{CLP(r.ventas)}</td><td className="text-right num">{CLP(r.costo)}</td><td className="text-right num text-sina-mint">{CLP(r.margen)}</td><td className="text-right num">{PCT(r.margenPct)}</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}

    {tab==='rotacion' && (()=>{
      const rows = products.map(p=>{const s=productSalesStats(p, invoices, 90); return {sku:p.sku, nombre:p.nombre, stock:p.stock, vendido90:s.qty, rotacion: p.stock>0? (s.qty/p.stock).toFixed(2):'∞'};}).sort((a,b)=>b.vendido90-a.vendido90);
      return <Card title="Rotación de inventario (últimos 90 días)" action={<Btn variant="ghost" onClick={()=>exportCsv(rows.slice(0,200),'rotacion')}>Exportar</Btn>}>
        <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">SKU</th><th>Producto</th><th className="text-right">Stock</th><th className="text-right">Vendido 90d</th><th className="text-right">Rotación</th></tr></thead>
          <tbody>{rows.slice(0,80).map(r=><tr key={r.sku} className="border-b border-sina-lineSoft"><td className="py-2 font-mono text-xs">{r.sku}</td><td>{r.nombre}</td><td className="text-right num">{r.stock}</td><td className="text-right num">{r.vendido90}</td><td className="text-right num font-semibold">{r.rotacion}</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}

    {tab==='clientes' && (()=>{
      const rows = clients.map(c=>{const s=clientStats(c, invoices, payments); return {razon:c.razonSocial, segmento:c.segmento, compras:s.totalCompras, margen:s.margen, freq:s.freq, ticket:Math.round(s.ticket), trend: s.trend?(s.trend*100).toFixed(0)+'%':'-'};}).sort((a,b)=>b.compras-a.compras);
      return <Card title="Comportamiento de clientes" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'clientes')}>Exportar</Btn>}>
        <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Cliente</th><th>Segmento</th><th className="text-right">Compras</th><th className="text-right">Margen</th><th className="text-right">Frec.</th><th className="text-right">Ticket</th><th className="text-right">Δ 90d</th></tr></thead>
          <tbody>{rows.slice(0,80).map(r=><tr key={r.razon} className="border-b border-sina-lineSoft"><td className="py-2">{r.razon}</td><td>{r.segmento}</td><td className="text-right num">{CLP(r.compras)}</td><td className="text-right num">{CLP(r.margen)}</td><td className="text-right num">{r.freq}</td><td className="text-right num">{CLP(r.ticket)}</td><td className={`text-right num ${r.trend.startsWith('-')?'text-sina-rose':'text-sina-mint'}`}>{r.trend}</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}

    {tab==='churn' && (()=>{
      const rows = clients.map(c=>{const s=clientStats(c, invoices, payments); const r=churnRisk(s); return {razon:c.razonSocial, ejecutivo:c.ejecutivo, score:r.score, nivel:r.level, dias:r.dSinceLast||0, motivo:r.reasons.join('; ')};}).filter(x=>x.nivel!=='Bajo').sort((a,b)=>b.score-a.score);
      return <Card title="Riesgo de fuga" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'churn')}>Exportar</Btn>}>
        <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Cliente</th><th>Ejecutivo</th><th className="text-right">Score</th><th>Nivel</th><th>Motivos</th></tr></thead>
          <tbody>{rows.slice(0,80).map(r=><tr key={r.razon} className="border-b border-sina-lineSoft"><td className="py-2">{r.razon}</td><td>{r.ejecutivo}</td><td className="text-right num font-bold">{r.score}</td><td><Badge tone={r.nivel==='Alto'?'rose':'amber'}>{r.nivel}</Badge></td><td className="text-xs text-sina-body">{r.motivo}</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}

    {tab==='quiebre' && (()=>{
      const rows = products.map(p=>{const s=productSalesStats(p, invoices, 180); return {sku:p.sku, nombre:p.nombre, stock:p.stock, ventaDia:s.avgDaily.toFixed(2), dias: s.daysOfStock===999?'∞':s.daysOfStock, fechaQuiebre: s.stockoutDate? fmtDate(s.stockoutDate):'—'};}).filter(r=>r.dias!=='∞' && r.dias<=120).sort((a,b)=>a.dias-b.dias);
      return <Card title="Pronóstico de quiebres" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'quiebres')}>Exportar</Btn>}>
        <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">SKU</th><th>Producto</th><th className="text-right">Stock</th><th className="text-right">Venta/día</th><th className="text-right">Días</th><th>Quiebre estimado</th></tr></thead>
          <tbody>{rows.slice(0,80).map(r=><tr key={r.sku} className="border-b border-sina-lineSoft"><td className="py-2 font-mono text-xs">{r.sku}</td><td>{r.nombre}</td><td className="text-right num">{r.stock}</td><td className="text-right num">{r.ventaDia}</td><td className={`text-right num font-semibold ${r.dias<=14?'text-sina-rose':r.dias<=45?'text-sina-amber':'text-sina-ink'}`}>{r.dias}</td><td>{r.fechaQuiebre}</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}

    {tab==='compras' && (()=>{
      const rows = products.map(p=>{const r=purchaseRecommendation(p, invoices, suppliers, purchaseOrders, sales, receptions); return {sku:p.sku, nombre:p.nombre, proveedor:r.sup?.nombre, recomendado:r.recomendado, urgencia:r.urgencia, ordenarAntesDe:fmtDate(r.orderByDate)};}).filter(r=>r.recomendado>0).sort((a,b)=>a.urgencia-b.urgencia);
      return <Card title="Recomendaciones de compra" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'recomendaciones-compra')}>Exportar</Btn>}>
        <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">SKU</th><th>Producto</th><th>Proveedor</th><th className="text-right">Recom.</th><th className="text-right">Urgencia (días)</th><th>Ordenar antes de</th></tr></thead>
          <tbody>{rows.slice(0,80).map(r=><tr key={r.sku} className="border-b border-sina-lineSoft"><td className="py-2 font-mono text-xs">{r.sku}</td><td>{r.nombre}</td><td>{r.proveedor}</td><td className="text-right num font-semibold text-sina-navy">{r.recomendado}</td><td className={`text-right num ${r.urgencia<=0?'text-sina-rose':''}`}>{r.urgencia}</td><td>{r.ordenarAntesDe}</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}

    {tab==='aging' && (()=>{
      const buckets={'0-15':[],'16-30':[],'31-60':[],'60+':[]};
      invoices.filter(i=>i.estadoPago==='Pendiente').forEach(i=>{const d=daysBetween(i.fechaVencimiento,today()); const k=d<=15?'0-15':d<=30?'16-30':d<=60?'31-60':'60+'; buckets[k].push(i);});
      const rows = Object.entries(buckets).map(([k,arr])=>({tramo:k, cantidad:arr.length, monto:arr.reduce((s,i)=>s+i.total,0)}));
      return <Card title="Aging cuentas por cobrar" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'aging')}>Exportar</Btn>}>
        <ChartBox type="bar" data={{labels:rows.map(r=>r.tramo+' días'), datasets:[{label:'Monto', data:rows.map(r=>r.monto), backgroundColor:['#0E8A6B','#B45309','#1C3566','#e11d48']}]}}/>
      </Card>;
    })()}

    {tab==='proveedores' && (()=>{
      const rows = suppliers.map(s=>{const ocs=purchaseOrders.filter(o=>o.proveedorId===s.id); const recibidas=ocs.filter(o=>o.estado==='Recibida'); const desv = recibidas.filter(o=>o.etaReal).map(o=>daysBetween(o.eta,o.etaReal)); const desvProm = desv.length? desv.reduce((a,b)=>a+b,0)/desv.length : 0; return {proveedor:s.nombre, pais:s.pais, leadTime:s.leadTimeDias, oc:ocs.length, recibidas:recibidas.length, desvDias:desvProm.toFixed(1)};});
      return <Card title="Desempeño de proveedores" action={<Btn variant="ghost" onClick={()=>exportCsv(rows,'proveedores')}>Exportar</Btn>}>
        <table className="w-full text-sm"><thead><tr className="text-left text-xs text-sina-muted border-b border-sina-line"><th className="py-2">Proveedor</th><th>País</th><th className="text-right">Lead time</th><th className="text-right">OC totales</th><th className="text-right">Recibidas</th><th className="text-right">Desv. vs ETA</th></tr></thead>
          <tbody>{rows.map(r=><tr key={r.proveedor} className="border-b border-sina-lineSoft"><td className="py-2">{r.proveedor}</td><td>{r.pais}</td><td className="text-right num">{r.leadTime}d</td><td className="text-right num">{r.oc}</td><td className="text-right num">{r.recibidas}</td><td className={`text-right num ${+r.desvDias>5?'text-sina-rose':+r.desvDias<-5?'text-sina-mint':''}`}>{r.desvDias>0?'+':''}{r.desvDias}d</td></tr>)}</tbody>
        </table>
      </Card>;
    })()}
  </div>;
}

function CuentasPorPagarView({go}){
  const { state, dispatch } = useStore();
  const { supplierInvoices=[], suppliers, purchaseOrders } = state;
  const [filter,setFilter]=useState('');
  const [detail,setDetail]=useState(null);
  const toast = useToast();

  // Recalcular estado vencida
  const enriched = supplierInvoices.map(f=>{
    const sup = suppliers.find(s=>s.id===f.proveedorId);
    const oc = purchaseOrders.find(o=>o.id===f.ocId);
    const dias = daysBetween(f.fechaVencimiento, today());
    let estado = f.estado;
    if(estado!=='Pagada' && estado!=='Parcialmente pagada' && dias>0) estado='Vencida';
    return {f, sup, oc, dias, estado};
  });

  const filtered = enriched.filter(({estado, sup, f})=>{
    if(filter && filter!==estado) return false;
    return true;
  }).sort((a,b)=>b.dias - a.dias);

  const totalAdeudado = enriched.filter(e=>e.estado!=='Pagada').reduce((s,e)=>s+(e.f.saldo||e.f.total),0);
  const totalVencido = enriched.filter(e=>e.estado==='Vencida').reduce((s,e)=>s+(e.f.saldo||e.f.total),0);

  const registrarPago = (f, monto, metodo='Transferencia', ref='MANUAL-'+rand(1000,9999))=>{
    const nuevos = [...(f.pagos||[]), {fecha:today(), monto, metodo, referencia:ref}];
    const pagado = nuevos.reduce((s,p)=>s+p.monto,0);
    const saldo = Math.max(0, f.total - pagado);
    const estado = saldo===0 ? 'Pagada' : 'Parcialmente pagada';
    dispatch({type:'UPSERT', collection:'supplierInvoices', item:{...f, pagos:nuevos, saldo, estado}});
    toast('Pago a proveedor registrado por '+CLP(monto));
  };

  return <div className="p-8 space-y-6">
    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
      <Kpi label="Facturas totales" value={supplierInvoices.length}/>
      <Kpi label="Adeudado" value={CLP(totalAdeudado)} tone={totalAdeudado>0?'warn':'good'}/>
      <Kpi label="Vencido" value={CLP(totalVencido)} tone={totalVencido>0?'risk':'good'}/>
      <Kpi label="Pagadas" value={enriched.filter(e=>e.estado==='Pagada').length} tone="good"/>
    </div>
    <Card title="Cuentas por pagar a proveedores" subtitle="Control de pagos especialmente a proveedores chinos (USD)" action={
      <div className="flex gap-2 items-center">
        <Select value={filter} onChange={e=>setFilter(e.target.value)} className="!w-44"><option value="">Todos los estados</option><option>Pendiente</option><option>Parcialmente pagada</option><option>Pagada</option><option>Vencida</option></Select>
      </div>
    }>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
          <th className="py-2 font-medium">Factura</th><th className="font-medium">Proveedor</th><th className="font-medium">OC</th><th className="font-medium">Emisión</th><th className="font-medium">Vence</th><th className="font-medium text-right">Monto</th><th className="font-medium text-right">Saldo</th><th className="font-medium text-right">Días</th><th className="font-medium">Estado</th><th></th>
        </tr></thead>
        <tbody>{filtered.map(({f, sup, oc, dias, estado})=>(
          <tr key={f.id} className="border-b border-sina-lineSoft row-hover">
            <td className="py-3 font-mono text-xs">{f.numero}</td>
            <td><div className="text-sina-ink">{sup?.nombre}</div><div className="text-xs text-sina-muted">{sup?.pais}</div></td>
            <td className="font-mono text-xs text-sina-muted">{oc?.numero||'—'}</td>
            <td>{fmtDate(f.fechaEmision)}</td>
            <td>{fmtDate(f.fechaVencimiento)}</td>
            <td className="text-right num">{f.moneda} {NUM(f.total)}</td>
            <td className="text-right num font-semibold">{f.moneda} {NUM(f.saldo)}</td>
            <td className={`text-right num ${dias>0?'text-sina-rose':'text-sina-muted'}`}>{dias>0?'+'+dias:dias}</td>
            <td><Badge tone={estado==='Pagada'?'mint':estado==='Vencida'?'rose':estado==='Parcialmente pagada'?'amber':'sky'} dot>{estado}</Badge></td>
            <td className="text-right text-xs space-x-2">
              <button className="text-sina-navy font-medium" onClick={()=>setDetail({f, sup, oc, dias, estado})}>Detalle</button>
              {estado!=='Pagada' && <button className="text-sina-mint font-medium" onClick={()=>registrarPago(f, f.saldo)}>Pagar</button>}
            </td>
          </tr>
        ))}</tbody>
      </table>
    </Card>
    <Modal open={!!detail} onClose={()=>setDetail(null)} title={`Factura proveedor ${detail?.f.numero}`} size="lg">
      {detail && (() => {
        const {f, sup, oc} = detail;
        return <div className="space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <Kpi label="Total" value={f.moneda+' '+NUM(f.total)}/>
            <Kpi label="Saldo" value={f.moneda+' '+NUM(f.saldo)} tone={f.saldo===0?'good':'warn'}/>
          </div>
          <Card title="Datos">
            <dl className="grid grid-cols-2 gap-3 text-sm">
              <div><dt className="text-xs text-sina-muted">Proveedor</dt><dd>{sup?.nombre} ({sup?.pais})</dd></div>
              <div><dt className="text-xs text-sina-muted">OC asociada</dt><dd className="font-mono text-xs">{oc?.numero||'—'}</dd></div>
              <div><dt className="text-xs text-sina-muted">Banco destino</dt><dd>{sup?.banca?.banco||'—'}</dd></div>
              <div><dt className="text-xs text-sina-muted">Cuenta</dt><dd className="font-mono text-xs">{sup?.banca?.cuenta||'—'}</dd></div>
              <div><dt className="text-xs text-sina-muted">SWIFT</dt><dd className="font-mono text-xs">{sup?.banca?.swift||'—'}</dd></div>
              <div><dt className="text-xs text-sina-muted">Moneda</dt><dd>{f.moneda}</dd></div>
            </dl>
          </Card>
          <Card title="Pagos registrados">
            {f.pagos?.length ? <table className="w-full text-sm"><thead><tr className="text-left text-[11px] uppercase text-sina-muted border-b border-sina-line"><th className="pb-2">Fecha</th><th className="pb-2">Método</th><th className="pb-2">Referencia</th><th className="pb-2 text-right">Monto</th></tr></thead><tbody>{f.pagos.map((p,i)=><tr key={i} className="border-b border-sina-lineSoft last:border-0"><td className="py-2">{fmtDate(p.fecha)}</td><td>{p.metodo}</td><td className="font-mono text-xs">{p.referencia}</td><td className="text-right num">{f.moneda} {NUM(p.monto)}</td></tr>)}</tbody></table>
              : <div className="text-sm text-sina-muted">Sin pagos registrados.</div>}
          </Card>
          {f.saldo>0 && <PagoProveedorForm factura={f} onPagar={registrarPago}/>}
        </div>;
      })()}
    </Modal>
  </div>;
}

function PagoProveedorForm({factura, onPagar}){
  const [monto, setMonto] = useState(factura.saldo);
  const [metodo, setMetodo] = useState('Transferencia');
  const [ref, setRef] = useState('');
  return <Card title="Registrar pago">
    <div className="grid grid-cols-4 gap-3">
      <Input label={`Monto (${factura.moneda})`} type="number" value={monto} onChange={e=>setMonto(+e.target.value)}/>
      <Select label="Método" value={metodo} onChange={e=>setMetodo(e.target.value)}><option>Transferencia</option><option>Cheque</option><option>SWIFT</option><option>Otro</option></Select>
      <Input label="Referencia" value={ref} onChange={e=>setRef(e.target.value)} className="col-span-2"/>
    </div>
    <div className="flex justify-end mt-3">
      <Btn onClick={()=>onPagar(factura, +monto, metodo, ref||('PG-'+rand(10000,99999)))}>Registrar pago</Btn>
    </div>
  </Card>;
}

/* =====================================================================================
   COMPONENTE · Recepción parcial de OC
   ===================================================================================== */
function RecepcionPanel({oc, onClose}){
  const { state, dispatch } = useStore();
  const { products, receptions=[], movements } = state;
  const toast = useToast();

  const previas = receptions.filter(r=>r.ocId===oc.id);
  const recibidoAnterior = (productoId) => previas.flatMap(r=>r.items.filter(i=>i.productoId===productoId)).reduce((s,i)=>s+i.cantidadRecibida,0);

  const [linea, setLinea] = useState(() => oc.items.map(it=>{
    const ya = previas.flatMap(r=>r.items.filter(i=>i.productoId===it.productoId)).reduce((s,i)=>s+i.cantidadRecibida,0);
    const pend = Math.max(0, it.cantidad - ya);
    return { productoId:it.productoId, sku:it.sku, nombre:it.nombre, cantidadOC:it.cantidad, recibidoAnterior:ya, pendiente:pend, cantidadRecibida:pend };
  }));
  const [obs, setObs] = useState('');

  const upd = (i, val) => setLinea(linea.map((l,j)=> j===i? {...l, cantidadRecibida:Math.max(0, Math.min(l.pendiente, val))} : l));

  const recibirTodoPendiente = () => setLinea(linea.map(l=>({...l, cantidadRecibida:l.pendiente})));
  const limpiar = () => setLinea(linea.map(l=>({...l, cantidadRecibida:0})));

  const ejecutar = () => {
    const items = linea.filter(l=>l.cantidadRecibida>0);
    if(!items.length){ toast('No hay cantidades a recibir','warn'); return; }
    // 1) registrar recepción
    const recId = uid('REC');
    dispatch({type:'UPSERT', collection:'receptions', item:{id:recId, ocId:oc.id, fecha:today(), usuario:'Bodega', items, observaciones:obs, completa:false}});
    // 2) actualizar stock + movimientos
    items.forEach(it=>{
      const p = products.find(x=>x.id===it.productoId); if(!p) return;
      dispatch({type:'UPSERT', collection:'products', item:{...p, stock: p.stock + it.cantidadRecibida}});
      const ocItem = oc.items.find(i=>i.productoId===it.productoId);
      dispatch({type:'UPSERT', collection:'movements', item:{id:uid('M'), productoId:p.id, tipo:'Entrada', cantidad:it.cantidadRecibida, motivo:'Recepción OC '+oc.numero, fecha:today(), costoUnit:ocItem?.costo||p.costo, usuario:'Bodega'}});
    });
    // 3) determinar nuevo estado de OC
    const recibidoTotal = oc.items.reduce((s,it)=>{
      const ya = recibidoAnterior(it.productoId);
      const ahora = items.find(x=>x.productoId===it.productoId)?.cantidadRecibida || 0;
      return s + (ya + ahora >= it.cantidad ? 1 : 0);
    },0);
    const todoRecibido = recibidoTotal === oc.items.length;
    const nuevoEstado = todoRecibido ? 'Recibida' : 'Recepción parcial';
    const hist = (oc.historial||[]).concat([{de:oc.estado, a:nuevoEstado, fecha:today(), usuario:'Bodega'}]);
    dispatch({type:'UPSERT', collection:'purchaseOrders', item:{...oc, estado:nuevoEstado, etaReal: todoRecibido? today() : oc.etaReal, historial:hist}});

    toast(`Recepción registrada · ${items.reduce((s,i)=>s+i.cantidadRecibida,0)} unid · ${nuevoEstado}`);
    onClose();
  };

  return <div className="space-y-4">
    <div className="grid grid-cols-3 gap-3">
      <Kpi label="Líneas OC" value={oc.items.length}/>
      <Kpi label="Recepciones previas" value={previas.length}/>
      <Kpi label="OC pendiente" value={oc.items.reduce((s,it)=>s+Math.max(0,it.cantidad-recibidoAnterior(it.productoId)),0)} tone="accent"/>
    </div>
    <Card title="Cantidades a recibir" action={
      <div className="flex gap-2"><Btn variant="ghost" size="sm" onClick={limpiar}>Limpiar</Btn><Btn variant="secondary" size="sm" onClick={recibirTodoPendiente}>Recibir todo pendiente</Btn></div>
    }>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-[11px] uppercase tracking-wider text-sina-muted border-b border-sina-line">
          <th className="pb-2 font-medium">Producto</th><th className="pb-2 font-medium text-right">OC</th><th className="pb-2 font-medium text-right">Ya recibido</th><th className="pb-2 font-medium text-right">Pendiente</th><th className="pb-2 font-medium text-right">A recibir</th>
        </tr></thead>
        <tbody>{linea.map((l,i)=>(
          <tr key={i} className="border-b border-sina-lineSoft">
            <td className="py-3"><div className="text-sina-ink">{l.nombre}</div><div className="text-xs text-sina-muted font-mono">{l.sku}</div></td>
            <td className="text-right num">{l.cantidadOC}</td>
            <td className="text-right num text-sina-body">{l.recibidoAnterior}</td>
            <td className="text-right num font-medium">{l.pendiente}</td>
            <td className="text-right"><input type="number" min="0" max={l.pendiente} value={l.cantidadRecibida} onChange={e=>upd(i, +e.target.value)} className="w-24 text-right px-2 py-1 rounded border border-sina-line"/></td>
          </tr>
        ))}</tbody>
      </table>
    </Card>
    <Textarea label="Observaciones de la recepción" rows="2" value={obs} onChange={e=>setObs(e.target.value)} placeholder="Ej. faltó 1 caja, daños menores, etc."/>
    <div className="flex justify-end gap-2 pt-2 border-t border-sina-line">
      <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
      <Btn onClick={ejecutar}>Confirmar recepción</Btn>
    </div>
  </div>;
}

    if(!files.length) return;
    const docs = await Promise.all(files.map(f=>fileToDoc(f, tipoCarga)));
    onChange([...(oc.documentos||[]), ...docs]);
    toast(`${docs.length} documento(s) adjuntado(s)`);
    e.target.value='';

  parseInboundPayload(payload){

    const out = [];

      });
    }));
    return out;
  }
}

/* =====================================================================================
   SalesAgentService — agente comercial (rule-based, listo para LLM)
   ---------------------------------------------------------------------------------------
   Responsable de:
   - interpretar mensajes
   - extraer intención comercial
   - detectar productos, cantidades, cliente, dirección
   - validar stock, crédito, descuento
   - decidir respuesta (continuar / pedir info / confirmar / derivar)
   - crear Orden de Venta cuando el cliente confirma
   ---------------------------------------------------------------------------------------
   Para integrar un LLM: reemplazar SalesAgentService.classify() y .extract() por llamadas
   al modelo manteniendo la misma interfaz de retorno.
   ===================================================================================== */

const HUMAN_HANDOFF_THRESHOLD_CLP = 2_000_000;
const MAX_FAILED_ATTEMPTS = 2;

const WORDS = {
  saludo:        ['hola','buenas','buen día','buenos días','buenas tardes','saludos','qué tal'],
  confirmacion:  ['sí','si','confirmo','confirmado','dale','acepto','ok','okey','perfecto','listo','adelante'],
  negacion:      ['no','cancela','olvida','espera','aún no','aun no'],
  reclamo:       ['molesto','enojado','pésimo','pesimo','malo','reclamo','queja','horrible','retraso','demora','no sirve','muy mal'],
  pedir_humano:  ['hablar con','hablar con una persona','una persona','humano','ejecutivo','vendedor','encargado','asesor','contactar'],
  descuento:     ['descuento','rebaja','precio especial','oferta','más barato','mas barato','mejor precio','volumen'],
  pedido_hint:   ['necesito','quiero','requiero','solicito','cotizar','presupuesto','comprar','pedir','pedido','encargar']
};
function _norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function _matches(text, list){
  // Match con límites de palabra para evitar falsos positivos
  // (ej. "si" no debe matchear dentro de "sintético").
  const t = ' '+_norm(text).replace(/[^\p{L}\p{N}\s]/gu,' ')+' ';
  return list.some(w=>{
    const nw = _norm(w);
    return t.includes(' '+nw+' ');
  });
}

const SalesAgentService = {
  /* ---------- Clasificación de intención (reemplazable por LLM) ---------- */
  classify(text){
    const intents = [];
    if(_matches(text, WORDS.pedir_humano)) intents.push('pedir_humano');
    if(_matches(text, WORDS.reclamo))      intents.push('reclamo');
    if(_matches(text, WORDS.descuento))    intents.push('pedir_descuento');
    if(_matches(text, WORDS.confirmacion)) intents.push('confirmacion');
    if(_matches(text, WORDS.negacion))     intents.push('negacion');
    if(_matches(text, WORDS.saludo))       intents.push('saludo');
    if(_matches(text, WORDS.pedido_hint))  intents.push('pedido');
    // Heurística: si menciona cantidades o unidades, probablemente es pedido
    if(/\d+\s*(unidad|u\b|kg|kilos?|lts?|litros?|gl\b|galon|galones)/i.test(text)) intents.push('pedido');
    return intents.length ? intents : ['otro'];
  },

  /* ---------- Extracción de entidades ---------- */
  extract(text, state){
    const ent = { rut:null, clienteId:null, productos:[], cantidades:[], items:[], despacho:null, direccion:null, comuna:null, fechaRequerida:null, condicionesEspeciales:null };

    // RUT
    const rutMatch = text.match(/(\d{1,2}\.?\d{3}\.?\d{3}-[\dkK])/);
    if(rutMatch){
      ent.rut = rutMatch[1];
      const cli = state.clients.find(c=>c.rut.replace(/\./g,'')===ent.rut.replace(/\./g,''));
      if(cli) ent.clienteId = cli.id;
    }

    // Cantidades con unidades
    const qtyRegex = /(\d+(?:[\.,]\d+)?)\s*(unidades?|u\b|kg|kilos?|lts?|litros?|gl\b|galones?|gal\b|tarros?|tambores?)/gi;
    let m; while((m = qtyRegex.exec(text))!==null){
      ent.cantidades.push({ valor: parseFloat(m[1].replace(',','.')), unidad: m[2].toLowerCase() });
    }

    // Productos: fuzzy por tokens contra el catálogo
    const normText = _norm(text);
    const tokens = normText.split(/\s+/).filter(t=>t.length>2);
    const scored = state.products.map(p=>{
      const hay = _norm(`${p.nombre} ${p.categoria} ${p.color||''} ${p.formato||''}`);
      const score = tokens.reduce((s,t)=> hay.includes(t) ? s+1 : s, 0);
      return { p, score };
    }).filter(x=>x.score>=2).sort((a,b)=>b.score-a.score);
    ent.productos = scored.slice(0,3).map(x=>x.p);

    // Combinar productos con cantidades (heurística simple: 1:1 por orden de aparición)
    ent.items = ent.productos.slice(0, Math.max(ent.cantidades.length, 1)).map((p, i)=>({
      productoId: p.id, sku: p.sku, nombre: p.nombre,
      cantidad: ent.cantidades[i]?.valor || ent.cantidades[0]?.valor || 1,
      unidad: ent.cantidades[i]?.unidad || ent.cantidades[0]?.unidad || 'u',
      precio: p.precio, costo: p.costo
    }));

    // Despacho/retiro
    if(/retiro|bodega|paso a buscar/i.test(text)) ent.despacho = 'retiro';
    if(/despach[oa]|envío|envio|entrega|llevar/i.test(text)) ent.despacho = 'despacho';

    // Dirección (heurística simple: capturamos lo que sigue a "a" o "en")
    const dirMatch = text.match(/(?:despacho a|enviar a|en)\s+([A-Za-zÀ-ÿ0-9\s\.]+?)(?:,|\.|$)/i);
    if(dirMatch) ent.direccion = dirMatch[1].trim();
    const comMatch = COMUNAS.find(c=>new RegExp(`\\b${c}\\b`,'i').test(text));
    if(comMatch) ent.comuna = comMatch;

    // Urgencia / fecha
    if(/urgente|hoy mismo|cuanto antes|a la brevedad/i.test(text)) ent.fechaRequerida = today();
    if(/mañana|manana/i.test(text)) ent.fechaRequerida = addDays(today(),1);
    if(/viernes/i.test(text)) ent.fechaRequerida = addDays(today(),3);

    return ent;
  },

  /* ---------- Validación de pedido ---------- */
  validate(draft, state){
    const issues = []; const blockers = []; const info = {};
    const cliente = state.clients.find(c=>c.id===draft.clienteId);
    if(!cliente) blockers.push('cliente_no_identificado');
    else {
      // Facturas vencidas
      const vencidas = state.invoices.filter(i=>i.clienteId===cliente.id && i.estadoPago==='Pendiente' && daysBetween(i.fechaVencimiento, today())>0);
      if(vencidas.length>0){ issues.push('facturas_vencidas'); info.vencidas = vencidas.length; info.montoVencido = vencidas.reduce((s,i)=>s+i.total,0); }
    }

    // Stock por línea
    const stockIssues = [];
    draft.items?.forEach(it=>{
      const p = state.products.find(x=>x.id===it.productoId);
      if(!p){ blockers.push('producto_no_identificado'); return; }
      if(p.stock < it.cantidad){
        stockIssues.push({sku:p.sku, nombre:p.nombre, requerido:it.cantidad, disponible:p.stock});
      }
    });
    if(stockIssues.length){ issues.push('sin_stock'); info.stockIssues = stockIssues; }

    // Monto total estimado
    const neto = (draft.items||[]).reduce((s,it)=>s+it.precio*it.cantidad,0);
    const total = Math.round(neto*1.19);
    info.estimadoNeto = neto;
    info.estimadoTotal = total;
    if(total >= HUMAN_HANDOFF_THRESHOLD_CLP) issues.push('monto_alto');

    return { ok: blockers.length===0 && issues.length===0, issues, blockers, info, cliente };
  },

  /* ---------- Decisión principal por turno ---------- */
  process({conversation, draft, message, state}){
    const intents = SalesAgentService.classify(message);
    const ent = SalesAgentService.extract(message, state);
    const logs = [];
    const pushLog = (decision, detalle, confianza=0.9) => logs.push({ts:new Date().toISOString(), decision, detalle, confianza});
    pushLog('mensaje_recibido', message.slice(0,200), 1);

    // 1) Solicitudes explícitas de humano / reclamo / descuento → handoff
    if(intents.includes('pedir_humano')){
      pushLog('derivar_humano','cliente pidió hablar con una persona',1);
      return { reply:'Te derivo con un ejecutivo de Sina. En unos minutos te contactará.', action:'derivar', motivo:'pidio_humano', logs };
    }
    if(intents.includes('reclamo')){
      pushLog('derivar_humano','reclamo detectado',0.95);
      return { reply:'Lamento la situación. Te conecto con un ejecutivo de Sina para resolverlo cuanto antes.', action:'derivar', motivo:'reclamo', logs };
    }
    if(intents.includes('pedir_descuento')){
      pushLog('derivar_humano','descuento_solicitado',1);
      return { reply:'Los descuentos especiales requieren autorización del ejecutivo comercial. Te derivo con quien puede ayudarte.', action:'derivar', motivo:'descuento_solicitado', logs };
    }

    // 2) Identificar cliente si aún no
    let updatedDraft = { ...draft, ...(draft||{}), items: draft?.items?.slice()||[] };
    if(!updatedDraft.clienteId && (ent.clienteId || conversation.clienteId)){
      updatedDraft.clienteId = ent.clienteId || conversation.clienteId;
    }

    // 3) Fusionar productos detectados (no duplicar si ya existe la línea)
    ent.items.forEach(it=>{
      const existing = updatedDraft.items.find(x=>x.productoId===it.productoId);
      if(existing){ existing.cantidad = it.cantidad; }
      else updatedDraft.items.push(it);
    });

    // 4) Fusionar despacho / dirección / fecha
    if(ent.despacho)         updatedDraft.despacho = { tipo: ent.despacho, direccion: ent.direccion || updatedDraft.despacho?.direccion, comuna: ent.comuna || updatedDraft.despacho?.comuna };
    if(ent.direccion && !updatedDraft.despacho) updatedDraft.despacho = { tipo:'despacho', direccion: ent.direccion, comuna: ent.comuna };
    if(ent.fechaRequerida)   updatedDraft.fechaRequerida = ent.fechaRequerida;

    // 5) Si fue saludo y todavía no hay items, devolver bienvenida
    if(intents.includes('saludo') && !updatedDraft.items.length){
      pushLog('saludo','bienvenida',1);
      const cli = state.clients.find(c=>c.id===updatedDraft.clienteId);
      return { reply:`Hola${cli? ' '+(cli.contacto||cli.razonSocial):''}, soy el agente comercial de Sina. ¿Qué producto necesitas? Puedes indicar nombre, color y formato.`, action:'continuar', updatedDraft, newConvState:'en_conversacion', logs };
    }

    // 6) Si el cliente confirma y ya teníamos un draft listo → crear OV
    if(intents.includes('confirmacion') && conversation.estado==='pendiente_aprobacion' && updatedDraft.items.length){
      pushLog('crear_ov','cliente confirmó',1);
      return { reply:'(creando orden...)', action:'crear_ov', updatedDraft, logs };
    }
    if(intents.includes('negacion') && conversation.estado==='pendiente_aprobacion'){
      pushLog('cancelar','cliente canceló',1);
      return { reply:'Entendido, no genero la orden. ¿Quieres ajustar algo del pedido?', action:'continuar', updatedDraft, newConvState:'en_conversacion', logs };
    }

    // 7) Si no se detectó nada útil → contador de intentos fallidos
    if(!ent.productos.length && !updatedDraft.items.length && !ent.clienteId && !intents.includes('confirmacion')){
      const intentos = (conversation.intentosFallidos||0) + 1;
      pushLog('interpretacion_fallida','sin entidades ni intent comercial', 0.4);
      if(intentos > MAX_FAILED_ATTEMPTS){
        return { reply:'Quiero asegurarme de entenderte bien. Te derivo con un ejecutivo de Sina.', action:'derivar', motivo:'intentos_fallidos', logs, updatedDraft, intentosFallidos:intentos };
      }
      return { reply:'No estoy seguro de entender. ¿Puedes indicarme qué producto necesitas y la cantidad? Por ejemplo: "20 unidades de Latex Premium Blanco 4 L".', action:'esperar_info', updatedDraft, intentosFallidos:intentos, logs };
    }

    // 8) Validar lo que tenemos
    const v = SalesAgentService.validate(updatedDraft, state);

    if(v.blockers.includes('producto_no_identificado')){
      pushLog('producto_ambiguo','no se pudo mapear ningún producto del catálogo',0.5);
      return { reply:'No encontré ese producto en nuestro catálogo. ¿Puedes darme un poco más de detalle (nombre, color, formato)?', action:'esperar_info', updatedDraft, logs };
    }

    if(v.issues.includes('sin_stock')){
      pushLog('derivar_humano','sin_stock',0.95);
      const det = v.info.stockIssues.map(s=>`• ${s.nombre} (disponible: ${s.disponible}, solicitado: ${s.requerido})`).join('\n');
      return { reply:`Algunos productos no tienen stock suficiente:\n${det}\nTe derivo con un ejecutivo para evaluar alternativas.`, action:'derivar', motivo:'sin_stock', updatedDraft, logs };
    }
    if(v.issues.includes('facturas_vencidas')){
      pushLog('derivar_humano','facturas_vencidas',0.95);
      return { reply:`Detecté ${v.info.vencidas} factura(s) pendiente(s) por ${CLP(v.info.montoVencido)}. Te derivo con cobranza para regularizar antes de procesar el pedido.`, action:'derivar', motivo:'facturas_vencidas', updatedDraft, logs };
    }
    if(v.issues.includes('monto_alto')){
      pushLog('derivar_humano','monto_alto',1);
      return { reply:`Este pedido supera el monto autorizado para procesar automáticamente (${CLP(v.info.estimadoTotal)}). Te derivo con un ejecutivo comercial para validarlo.`, action:'derivar', motivo:'monto_alto', updatedDraft, logs };
    }

    // 9) Pedir información faltante en orden de prioridad
    if(!updatedDraft.clienteId){
      pushLog('solicitar_rut','cliente no identificado',0.9);
      return { reply:'Para asociar el pedido necesito tu RUT o razón social. ¿Me lo puedes confirmar?', action:'esperar_info', updatedDraft, logs };
    }
    if(!updatedDraft.items.length){
      pushLog('solicitar_producto','no se detectó producto',0.6);
      return { reply:'¿Qué producto necesitas? Puedes indicarme nombre, color y formato.', action:'esperar_info', updatedDraft, logs };
    }
    if(!updatedDraft.despacho){
      pushLog('solicitar_despacho','falta retiro/despacho',0.9);
      return { reply:'¿Es para retiro en bodega o despacho? Si es despacho, ¿a qué dirección?', action:'esperar_info', updatedDraft, logs };
    }

    // 10) Todo listo → resumen y pedir confirmación
    const items = updatedDraft.items.map(it=>`• ${it.cantidad} × ${it.nombre} (${CLP(it.precio*it.cantidad)})`).join('\n');
    const reply = `Resumen del pedido:\n${items}\nNeto: ${CLP(v.info.estimadoNeto)} · Total con IVA: ${CLP(v.info.estimadoTotal)}\nDespacho: ${updatedDraft.despacho.tipo==='retiro'?'retiro en bodega':(updatedDraft.despacho.direccion||'')+(updatedDraft.despacho.comuna?', '+updatedDraft.despacho.comuna:'')}\n\n¿Confirmas el pedido?`;
    pushLog('pendiente_aprobacion','resumen enviado al cliente',0.95);
    return { reply, action:'pedir_confirmacion', updatedDraft, newConvState:'pendiente_aprobacion', logs };
  }
};

function ConversacionDetalle({data, onClose, go}){
  const { state, dispatch } = useStore();
  const { c, cli, draft } = data;
  const msgs = state.whatsappMessages.filter(m=>m.conversationId===c.id).sort((a,b)=>a.ts.localeCompare(b.ts));
  const handoffs = (state.humanHandoffs||[]).filter(h=>h.conversationId===c.id);
  const logs = (state.aiAgentLogs||[]).filter(l=>l.conversationId===c.id);
  const ov = c.ovId ? state.sales.find(s=>s.id===c.ovId) : null;
  const [reply, setReply] = useState('');
  const toast = useToast();

  const sendManual = async () => {
    if(!reply.trim()) return;
    const provider = MESSAGING_PROVIDERS[ACTIVE_MESSAGING_PROVIDER];
    await provider.send(c.telefono, reply);
    dispatch({type:'UPSERT', collection:'whatsappMessages', item:{id:uid('WM'), conversationId:c.id, direccion:'out', texto:reply, ts:new Date().toISOString(), autor:'humano'}});
    setReply('');
    toast('Mensaje enviado');
  };

  const derivar = () => {
    const responsable = EJECUTIVOS[0];
    dispatch({type:'UPSERT', collection:'whatsappConversations', item:{...c, estado:'derivado', responsable}});
    dispatch({type:'UPSERT', collection:'humanHandoffs', item:{id:uid('HH'), conversationId:c.id, fecha:today(), motivo:'manual', detalle:'Derivación manual desde detalle', responsable, resuelto:false}});
    toast('Conversación derivada a '+responsable,'warn');
  };

  const cerrar = () => {
    dispatch({type:'UPSERT', collection:'whatsappConversations', item:{...c, estado:'cerrado'}});
    toast('Conversación cerrada');
  };

  return <div className="grid grid-cols-3 gap-5">
    <div className="col-span-2 flex flex-col h-[60vh]">
      <div className="flex-1 overflow-y-auto scrollbar bg-sina-bg rounded-lg p-4 space-y-2">
        {msgs.map(m=>(
          <div key={m.id} className={`flex ${m.direccion==='in'?'justify-start':'justify-end'}`}>
            <div className={`max-w-[78%] px-3 py-2 rounded-lg text-sm ${m.direccion==='in'? 'bg-white border border-sina-line text-sina-ink' : (m.autor==='humano'?'bg-sina-mid text-white':'bg-sina-navy text-white')} whitespace-pre-line`}>
              <div>{m.texto}</div>
              <div className={`text-[10px] mt-1 ${m.direccion==='in'?'text-sina-muted':'opacity-75'}`}>{m.autor} · {new Date(m.ts).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
          </div>
        ))}
      </div>
      <div className="mt-3 flex gap-2">
        <textarea value={reply} onChange={e=>setReply(e.target.value)} placeholder="Responder como humano..." className="flex-1 px-3 py-2 rounded-md border border-sina-line text-sm" rows="2"/>
        <div className="flex flex-col gap-1">
          <Btn size="sm" onClick={sendManual}>Enviar</Btn>
          <Btn variant="ghost" size="sm" onClick={derivar}>Derivar</Btn>
          <Btn variant="ghost" size="sm" onClick={cerrar}>Cerrar</Btn>
        </div>
      </div>
    </div>
    <div className="space-y-4">
      <Card title="Cliente">
        {cli ? <dl className="text-sm space-y-1">
          <div><dt className="text-xs text-sina-muted">Razón social</dt><dd>{cli.razonSocial}</dd></div>
          <div><dt className="text-xs text-sina-muted">RUT</dt><dd className="font-mono text-xs">{cli.rut}</dd></div>
          <div><dt className="text-xs text-sina-muted">Ejecutivo</dt><dd>{cli.ejecutivo}</dd></div>

        {draft?.items?.length ? <div className="text-sm space-y-2">
          {draft.items.map((it,i)=>(<div key={i} className="flex justify-between gap-2"><span className="truncate">{it.cantidad} × {it.nombre}</span><span className="num">{CLP(it.precio*it.cantidad)}</span></div>))}
          <div className="flex justify-between font-medium pt-2 border-t border-sina-line"><span>Total estimado</span><span className="num">{CLP(draft.estimadoTotal||0)}</span></div>
          {draft.despacho && <div className="text-xs text-sina-muted">{draft.despacho.tipo==='retiro'?'Retiro en bodega':`Despacho a ${draft.despacho.direccion||'—'}${draft.despacho.comuna?', '+draft.despacho.comuna:''}`}</div>}

        {ov && <div className="mt-3 pt-3 border-t border-sina-line text-xs"><Badge tone="mint" dot>OV creada</Badge> <span className="font-mono">{ov.numero}</span> · <button className="text-sina-navy font-medium" onClick={()=>go('ventas','ordenes')}>Ver OV</button></div>}

        <ul className="text-xs space-y-2 max-h-48 overflow-y-auto scrollbar">
